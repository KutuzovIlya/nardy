<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1218">
<title>Длинные нарды</title>
<meta name="description" content="Длинные нарды: партия против компьютера или вдвоём по сети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css?v=24">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">

  <header class="rail">
    <div class="mark">Нарды <em>длинные</em></div>

    <div class="tally">
      <span class="chip" id="net-chip" hidden></span>
      <b id="tally-w">0</b>
      <span>:</span>
      <b id="tally-b">0</b>
    </div>

    <nav class="rail-actions">
      <button class="btn btn-icon" id="act-hint" type="button" title="Подсказка" aria-label="Подсказка">?</button>
      <button class="btn btn-icon" id="act-undo" type="button" title="Отменить ход" aria-label="Отменить ход">↶</button>
      <button class="btn btn-icon" id="act-sound" type="button" aria-pressed="true" title="Звук">♪</button>
      <button class="btn btn-key" id="act-new" type="button">Партия</button>
    </nav>
  </header>

  <main class="table">
    <div class="plaque" id="pl-b">
      <span class="ava" id="ava-b"><span class="disc b"></span></span>
      <div class="pwho">
        <div class="pname">Чёрные</div>
        <div class="pmeta" id="meta-b">Компьютер</div>
      </div>
      <span class="turn">ходит</span>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board">
        <canvas id="scene"></canvas>
        <div class="layer hit" id="zones"></div>
        <div class="layer" id="men"></div>
        <div class="layer" id="spots"></div>
        <canvas class="layer" id="dicefx"></canvas>
        <div class="quip" id="quip"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>

    <div class="plaque" id="pl-w">
      <span class="ava" id="ava-w"><span class="disc w"></span></span>
      <div class="pwho">
        <div class="pname">Белые</div>
        <div class="pmeta" id="meta-w">Игрок</div>
      </div>
      <span class="turn">ходит</span>
    </div>
  </main>

</div>

<div class="veil" id="veil">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Меню"></div>
</div>

<script src="js/mock-db.js?v=24"></script>
<script src="js/engine.js?v=24"></script>
<script src="js/ai.js?v=24"></script>
<script src="js/board.js?v=24"></script>
<script src="js/dicefx.js?v=24"></script>
<script src="js/banter.js?v=24"></script>
<script src="js/voice.js?v=24"></script>
<script src="js/tg.js?v=24"></script>
<script src="js/net.js?v=24"></script>
<script src="js/ui.js?v=24"></script>
</body>
</html>
