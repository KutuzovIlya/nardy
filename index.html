<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1218">
<title>Длинные нарды</title>
<meta name="description" content="Длинные нарды: партия против компьютера или вдвоём по сети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css?v=37">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">

  <!-- Раскладка «к большому пальцу»: всё нужное внизу, пустое место уходит наверх -->
  <main class="table">
    <div class="plaque" id="pl-b">
      <span class="ava-ring">
        <span class="ava" id="ava-b"><span class="disc b"></span></span>
        <svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle class="track" cx="26" cy="26" r="24"/><circle class="left" id="ring-b" cx="26" cy="26" r="24" transform="rotate(-90 26 26)"/></svg>
      </span>
      <div class="pwho">
        <div class="pname" id="name-b">Компьютер</div>
        <div class="pmeta" id="meta-b">чёрные</div>
      </div>
      <span class="turn" id="turn-b">ходит</span>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board">
        <canvas id="scene"></canvas>
        <div class="layer hit" id="zones"></div>
        <div class="layer" id="men"></div>
        <div class="layer" id="spots"></div>
        <canvas class="layer" id="dicefx"></canvas>
        <div class="quip" id="quip"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>

    <div class="plaque" id="pl-w">
      <span class="ava-ring">
        <span class="ava" id="ava-w"><span class="disc w"></span></span>
        <svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle class="track" cx="26" cy="26" r="24"/><circle class="left" id="ring-w" cx="26" cy="26" r="24" transform="rotate(-90 26 26)"/></svg>
      </span>
      <div class="pwho">
        <div class="pname" id="name-w">Игрок</div>
        <div class="pmeta" id="meta-w">белые</div>
      </div>
      <span class="turn" id="turn-w">ходит</span>
    </div>
  </main>

  <nav class="bar">
    <button class="btn btn-key" id="act-new" type="button">Партия</button>
    <button class="btn" id="act-undo" type="button" title="Отменить ход" aria-label="Отменить ход">↶</button>
    <div class="score" id="score" aria-label="Счёт матча">
      <b class="mono"><span id="tally-a">0</span> : <span id="tally-z">0</span></b>
      <span id="score-sub">счёт</span>
    </div>
    <button class="btn" id="act-sound" type="button" aria-pressed="true" title="Стук" aria-label="Стук костей и шашек">♪</button>
    <button class="btn" id="act-amb" type="button" aria-pressed="true" title="Фон" aria-label="Гул чайханы">≋</button>
  </nav>

</div>

<div class="veil" id="veil">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Меню"></div>
</div>

<script src="js/mock-db.js?v=37"></script>
<script src="js/engine.js?v=37"></script>
<script src="js/ai.js?v=37"></script>
<script src="js/table.js?v=37"></script>
<script src="js/board.js?v=37"></script>
<script src="js/dicefx.js?v=37"></script>
<script src="js/banter.js?v=37"></script>
<script src="js/stats.js?v=37"></script>
<script src="js/profile.js?v=37"></script>
<script src="js/account.js?v=37"></script>
<script src="js/tg.js?v=37"></script>
<script src="js/fb.js?v=37"></script>
<script src="js/sound.js?v=37"></script>
<script src="js/net.js?v=37"></script>
<script src="js/ui.js?v=37"></script>
</body>
</html>
