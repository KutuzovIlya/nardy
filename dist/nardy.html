            if (first && mine) heartbeat(code, mine);        /* «в сети» — сразу, не через 20 секунд */
            guard(t);
            cb(view(t));
            if (again) { again = false; read(); }
          }, function (e) {
            busyRead = false;
            if (dead) return;
            if (++fails === 3 && onErr) onErr(e);
            setTimeout(read, Math.min(8000, 500 * Math.pow(2, fails)));
          });
        }

        function beatNow() {
          heartbeat(code, mine).then(function () { if (!dead) read(); });
        }

        s = stream('tables/' + code, read);
        beatNow();
        beat = setInterval(beatNow, 20000);

        /* из фона iOS мог оборвать поток молча — переподключаемся сразу */
        function wake() { if (!document.hidden && !dead) { s.kick(); beatNow(); } }
        document.addEventListener('visibilitychange', wake);

        return function () {
          dead = true;
          clearInterval(beat);
          clearTimeout(clockTimer);
          document.removeEventListener('visibilitychange', wake);
          s.close();
        };
      },

      write: function () { return Promise.resolve(); },

      peek: function (code) {
        return get('tables/' + code).then(function (t) { return t ? view(t) : null; });
      },

      turn: function (game, ply, moves) { return ask('turn', { game: game, ply: ply, moves: moves }); },
      offer: function () { return ask('offer'); },
      answer: function (yes) { return ask('answer', { yes: !!yes }); },
      again: function () { return ask('again'); },

      now: now,
      here: function () {},
      watchPeers: function () { return function () {}; }
    };
  }

  global.NardyFB = {
    transport: transport,
    profile: profile,
    saveMe: saveMe,
    photoOf: photoOf,
    putPhoto: putPhoto,
    top: top,
    now: now,
    ready: function () { return typeof fetch === 'function' && typeof EventSource === 'function'; }
  };
})(window);
</script>
<script>
/* ============================================================
   Звук. Всё синтезируется на месте, записей не скачиваем.

   Стук: дерево о дерево — несколько затухающих тонов корпуса
   и короткий щелчок в начале. Кость о доску — суше и выше,
   шашка на пункт — глухое «тук».

   Фон: чайхана. Гул голосов вдалеке (шум, пропущенный через
   «гласные» фильтры, с неровным ритмом речи), звон стаканов,
   кости за соседним столом.
   ============================================================ */
(function (global) {
  'use strict';

  var ctx = null, fx = null, amb = null, far = null, buf = null;

  function ac() {
    if (!ctx) {
      var A = global.AudioContext || global.webkitAudioContext;
      if (!A) return null;
      ctx = new A();
      fx = ctx.createGain();
      fx.gain.value = 1;
      fx.connect(ctx.destination);
      amb = ctx.createGain();
      amb.gain.value = 0;
      amb.connect(ctx.destination);
      /* всё, что «за соседним столом», слышно глуше */
      far = ctx.createBiquadFilter();
      far.type = 'lowpass';
      far.frequency.value = 1800;
      far.connect(amb);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function noise() {
    if (buf) return buf;
    var len = ctx.sampleRate * 2, d, i;
    buf = ctx.createBuffer(1, len, ctx.sampleRate);
    d = buf.getChannelData(0);
    for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* Удар дерева: base — основной тон корпуса, gain — громкость,
     decay — сколько звенит, click — где «щёлкает» начало. */
  var RATIOS = [1, 2.32, 4.25, 6.8], AMPS = [1, .55, .3, .15];
  function knock(t, base, gain, decay, click, out) {
    out = out || fx;
    for (var i = 0; i < RATIOS.length; i++) {
      var f = base * RATIOS[i] * rnd(.98, 1.02);
      if (f > 9000) continue;
      var o = ctx.createOscillator(), g = ctx.createGain(), d = decay / (1 + i * .9);
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(gain * AMPS[i], t + .002);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g);
      g.connect(out);
      o.start(t);
      o.stop(t + d + .02);
    }
    var n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
    n.buffer = noise();
    bp.type = 'bandpass';
    bp.frequency.value = click;
    bp.Q.value = .9;
    ng.gain.setValueAtTime(gain * .7, t);
    ng.gain.exponentialRampToValueAtTime(.0001, t + .018);
    n.connect(bp);
    bp.connect(ng);
    ng.connect(out);
    n.start(t, rnd(0, 1.5));
    n.stop(t + .03);
  }

  /* Стеклянный стакан: высокие чистые тоны, звенят дольше дерева */
  function clink(t, pitch, gain, out) {
    [1, 1.62, 2.26].forEach(function (r, i) {
      var o = ctx.createOscillator(), g = ctx.createGain(), d = [.7, .45, .3][i];
      o.type = 'sine';
      o.frequency.value = pitch * r * rnd(.995, 1.005);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(gain / (1 + i), t + .003);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g);
      g.connect(out);
      o.start(t);
      o.stop(t + d + .02);
    });
  }

  function tone(t, freq, dur, gain, type) {
    var o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    lp.type = 'lowpass';
    lp.frequency.value = 2600;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + .015);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(lp);
    lp.connect(g);
    g.connect(fx);
    o.start(t);
    o.stop(t + dur + .05);
  }

  /* ---------- стук ---------- */

  var last = 0;

  function play(kind) {
    if (!ac()) return;
    var t = ctx.currentTime + .005, i;
    try {
      if (kind === 'tick') {
        /* отскок кости: не чаще, чем ухо различает */
        if (t - last < .05) return;
        last = t;
        knock(t, rnd(900, 1300), rnd(.06, .11), .06, 3400);
      } else if (kind === 'dice') {
        /* кости в руке: несколько сухих щелчков друг о друга */
        for (i = 0; i < 5; i++) knock(t + i * rnd(.03, .055), rnd(1900, 2700), .045, .03, 4200);
      } else if (kind === 'move') {
        knock(t, rnd(250, 310), .2, .13, 1800);
        knock(t + .028, rnd(300, 360), .06, .07, 2200);          /* шашка чуть подпрыгнула */
      } else if (kind === 'off') {
        knock(t, rnd(400, 440), .15, .1, 2400);
        clink(t + .05, 1760, .025, fx);
      } else if (kind === 'no') {
        knock(t, 140, .2, .09, 900);
      } else if (kind === 'win') {
        [523, 659, 784, 1047].forEach(function (f, k) { tone(t + k * .11, f, .55, .07); });
      } else if (kind === 'lose') {
        tone(t, 392, .5, .06);
        tone(t + .18, 311, .7, .06);
      }
    } catch (e) {}
  }

  /* ---------- фон: чайхана ---------- */

  var on = false, want = false, loops = [], voices = [], timer = null, nextClink = 0, nextRattle = 0;

  var VOWELS = [
    { f: 290, q: 2.4, w: 1 },
    { f: 520, q: 2.2, w: 1 },
    { f: 860, q: 2.0, w: .7 },
    { f: 1400, q: 2.6, w: .45 }
  ];

  function start() {
    if (on || !ac()) return;
    on = true;
    var t = ctx.currentTime;

    /* гул помещения */
    var room = ctx.createBufferSource(), lp = ctx.createBiquadFilter(), rg = ctx.createGain();
    room.buffer = noise();
    room.loop = true;
    lp.type = 'lowpass';
    lp.frequency.value = 240;
    rg.gain.value = .25;
    room.connect(lp);
    lp.connect(rg);
    rg.connect(amb);
    room.start(t, rnd(0, 2));
    loops.push(room);

    /* голоса: у каждого свой «гласный» фильтр и свой неровный ритм */
    voices = VOWELS.map(function (v) {
      var s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise();
      s.loop = true;
      bp.type = 'bandpass';
      bp.frequency.value = v.f;
      bp.Q.value = v.q;
      g.gain.value = 0;
      s.connect(bp);
      bp.connect(g);
      g.connect(amb);
      s.start(t, rnd(0, 2));
      loops.push(s);
      return { g: g, bp: bp, v: v, at: 0 };
    });

    nextClink = t + rnd(3, 7);
    nextRattle = t + rnd(8, 16);
    timer = setInterval(tickAmb, 60);

    amb.gain.cancelScheduledValues(t);
    amb.gain.setValueAtTime(amb.gain.value, t);
    amb.gain.linearRampToValueAtTime(.6, t + 2.5);            /* входим в чайхану, а не врубаем */
  }

  function tickAmb() {
    if (!on) return;
    var t = ctx.currentTime;
    voices.forEach(function (x, i) {
      if (t < x.at) return;
      /* речь — это слоги и паузы: то громче, то тише, иногда тишина */
      /* узкая полоса шума тихая сама по себе — отсюда такие множители */
      var lvl = Math.random() < .22 ? 0 : rnd(.15, .5) * x.v.w;
      x.g.gain.setTargetAtTime(lvl, t, rnd(.04, .1));
      x.bp.frequency.setTargetAtTime(x.v.f * rnd(.85, 1.2), t, .08);
      x.at = t + rnd(.09, .26);
    });
    if (t >= nextClink) {
      /* стаканы: иногда один, иногда чокаются двое */
      var p = rnd(2400, 3100);
      clink(t, p, rnd(.02, .04), amb);
      if (Math.random() < .4) clink(t + rnd(.06, .12), p * rnd(1.05, 1.15), rnd(.015, .03), amb);
      nextClink = t + rnd(4, 13);
    }
    if (t >= nextRattle) {
      /* за соседним столом бросили кости */
      var n = 3 + Math.floor(Math.random() * 4);
      for (var k = 0; k < n; k++) knock(t + k * rnd(.05, .14), rnd(900, 1500), rnd(.02, .04), .05, 3000, far);
      nextRattle = t + rnd(12, 30);
    }
  }

  function stop() {
    if (!on) return;
    on = false;
    clearInterval(timer);
    timer = null;
    var t = ctx.currentTime;
    amb.gain.cancelScheduledValues(t);
    amb.gain.setValueAtTime(amb.gain.value, t);
    amb.gain.linearRampToValueAtTime(0, t + .6);
    var old = loops;
    loops = [];
    voices = [];
    setTimeout(function () { old.forEach(function (s) { try { s.stop(); } catch (e) {} }); }, 700);
  }

  /* Фон включается только после первого касания — раньше браузер звук не даст */
  function ambience(flag) {
    want = !!flag;
    if (!ctx) return;                    /* ещё не было касания — включим при нём */
    if (want && !document.hidden) start(); else stop();
  }

  function unlock() {
    if (!ac()) return;
    if (want && !document.hidden) start();
  }

  /* свернули Telegram — чайхана замолкает, вернулись — снова шумит */
  document.addEventListener('visibilitychange', function () {
    if (!ctx) return;
    if (document.hidden) { stop(); ctx.suspend && ctx.suspend(); }
    else { ctx.resume && ctx.resume(); if (want) start(); }
  });

  function state() { return { ctx: ctx ? ctx.state : 'none', amb: on, want: want }; }

  global.NardySound = { play: play, ambience: ambience, unlock: unlock, state: state };
})(window);
</script>
<script>
/* ============================================================
   Сетевой стол. Главный путь — Firebase (js/fb.js): стол лежит
   в базе Google, партию ведут сами телефоны по общим правилам
   js/table.js. Если когда-нибудь появится свой сервер (адрес
   в js/account.js), стол поведёт он — транспорт «srv» ниже.
   Запасные транспорты под тем же интерфейсом:

   • «db» — общее хранилище опубликованной страницы. Живая
     подписка, список открытых столов, атомарная посадка.
     Работает только внутри организации владельца страницы.

   • «relay» — бесплатный ретранслятор ntfy.sh, ни регистрации,
     ни ключей. Состояние партии летит обычным сообщением в тему
     nardy-<код>, подписка идёт через SSE. Работает откуда угодно,
     в том числе с GitHub Pages, но списка столов нет: соперник
     приходит по коду или по ссылке.

   Состояние партии в обоих случаях одно и то же — целиком, одним
   куском. Переписывает его только тот, чья очередь ходить.
   ============================================================ */
(function (global) {
  'use strict';

  var ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var TABLES = 'tables';
  var STALE = 6 * 60 * 60 * 1000;
  var RELAY = 'https://ntfy.sh';

  var T = null, boot = null;
  var myId = null, myName = '';

  try {
    myId = localStorage.getItem('nardy.id');
    myName = localStorage.getItem('nardy.name') || '';
  } catch (e) {}
  if (!myId) {
    myId = 'p' + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem('nardy.id', myId); } catch (e) {}
  }

  function code6() {
    var s = '';
    for (var i = 0; i < 6; i++) s += ABC[Math.floor(Math.random() * ABC.length)];
    return s;
  }

  function clone(v) { return v ? JSON.parse(JSON.stringify(v)) : v; }

  /* ---------- транспорт 1: хранилище артефакта ---------- */

  function dbTransport(db, room) {
    var cur = null;
    function ref(code) { return db.collection(TABLES).doc(code); }

    function sweep(code) { try { ref(code).delete(); } catch (e) {} }

    /* раз за сеанс убираем брошенные столы, иначе они копятся */
    try {
      db.collection(TABLES).where('updatedAt', '<', Date.now() - STALE).limit(20).get()
        .then(function (s) { s.docs.forEach(function (d) { sweep(d.id); }); }, function () {});
    } catch (e) {}

    return {
      kind: 'db',
      hasLobby: true,
      hasPresence: !!room,

      watchLobby: function (cb, onErr) {
        var q = db.collection(TABLES).where('status', '==', 'open')
          .orderBy('createdAt', 'desc').limit(12);
        return q.onSnapshot(function (snap) {
          var now = Date.now(), list = [];
          snap.docs.forEach(function (d) {
            var t = d.data();
            if (!t || !t.createdAt) return;
            if (now - t.createdAt > STALE) { sweep(d.id); return; }
            list.push(t);
          });
          cb(list);
        }, onErr);
      },

      create: function (body) {
        var code = code6(), r = ref(code);
        return r.get().then(function (snap) {
          if (snap.exists) return T.create(body);
          body.code = code;
          return r.set(body).then(function () { cur = r; return code; });
        });
      },

      sit: function (code, seat, who, prepare) {
        var r = ref(code);
        return r.acquire({ holder: myId, ttlMs: 4000 }).then(function (lease) {
          if (!lease.acquired) return { ok: false, why: 'busy' };
          return r.get().then(function (snap) {
            if (!snap.exists) return { ok: false, why: 'gone' };
            var t = clone(snap.data());
            if (!t.seats) return { ok: false, why: 'gone' };
            if (!seat) seat = !t.seats.w ? 'w' : (!t.seats.b ? 'b' : null);
            if (!seat) return { ok: false, why: 'full' };
            if (t.seats[seat] && t.seats[seat].id !== myId) return { ok: false, why: 'taken' };
            who = who || {};
            t.seats[seat] = { id: myId, name: who.name || 'Игрок', photo: who.photo || '' };
            t.updatedAt = Date.now();
            t.seq = (t.seq || 0) + 1;
            if (t.seats.w && t.seats.b) {
              t.status = 'live';
              if (prepare) prepare(t);
            }
            return r.set(t).then(function () {
              cur = r;
              return { ok: true, seat: seat, table: t };
            });
          });
        });
      },

      watchTable: function (code, cb, onErr) {
        var r = ref(code);
        cur = r;
        return r.onSnapshot(function (snap) {
          cb(snap.exists ? clone(snap.data()) : null);
        }, onErr);
      },

      write: function (body) {
        if (!cur) return Promise.resolve();
        return cur.set(body);
      },

      peek: function (code) {
        return ref(code).get().then(function (s) { return s.exists ? clone(s.data()) : null; });
      },

      here: function (code, seat) {
        if (!room || !room.presence) return;
        try {
          var p = room.presence({ table: code || null, seat: seat || null, id: myId, name: myName || 'Игрок' });
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      },

      watchPeers: function (cb) {
        if (!room || !room.onPeers) return function () {};
        try {
          return room.onPeers(function (ch) { cb(ch && ch.peers ? ch.peers : []); }, function () {}) ||
            function () {};
        } catch (e) { return function () {}; }
      }
    };
  }

  /* ---------- транспорт 2: ретранслятор ---------- */

  function relayTransport() {
    var cur = null;

    function topic(code) { return 'nardy-' + code; }

    /* Последнее состояние стола. Раньше тянулась вся история темы за 12 часов —
       к концу партии это полтора мегабайта на каждый опрос. Теперь только
       последнее сообщение; если ретранслятор так не умеет — по-старому. */
    function poll(code) {
      var base = RELAY + '/' + topic(code) + '/json?poll=1&since=';
      return fetch(base + 'latest', { cache: 'no-store' })
        .then(function (r) {
          if (r.ok) return r.text();
          return fetch(base + '12h', { cache: 'no-store' }).then(function (r2) { return r2.ok ? r2.text() : ''; });
        })
        .then(function (txt) {
          var lines = txt.split('\n'), last = null, i, o;
          for (i = 0; i < lines.length; i++) {
            if (!lines[i]) continue;
            try { o = JSON.parse(lines[i]); } catch (e) { continue; }
            if (o.event !== 'message' || !o.message) continue;
            try { last = JSON.parse(o.message); } catch (e) {}
          }
          return last;
        });
    }

    function sendOnce(body) {
      return fetch(RELAY + '/' + topic(body.code), {
        method: 'POST',
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) throw new Error('relay ' + r.status);
      });
    }

    /* Отправка с повтором. Важен только последний вариант стола, поэтому
       держим одну ячейку «к отправке»: новая запись вытесняет старую,
       а неудача не теряет ход — повторяем, пока не уйдёт. */
    var pending = null, waiters = [], busySend = false, tries = 0;

    function flush() {
      if (busySend || !pending) return;
      busySend = true;
      var body = pending;
      sendOnce(body).then(function () {
        busySend = false;
        if (pending === body) {
          pending = null;
          var w = waiters; waiters = [];
          if (tries && global.NardyNet && NardyNet.onBack) NardyNet.onBack();
          tries = 0;
          w.forEach(function (f) { f.ok(); });
        }
        flush();
      }, function () {
        busySend = false;
        tries++;
        if (tries === 1 && global.NardyNet && NardyNet.onLost) NardyNet.onLost();
        setTimeout(flush, Math.min(15000, 800 * Math.pow(2, tries - 1)));
      });
    }

    function send(body) {
      pending = body;
      return new Promise(function (ok, no) {
        waiters.push({ ok: ok, no: no });
        flush();
      });
    }

    return {
      kind: 'relay',
      hasLobby: false,
      hasPresence: false,

      watchLobby: function (cb) { cb([]); return function () {}; },

      create: function (body) {
        body.code = code6();
        return send(body).then(function () { cur = body.code; return body.code; });
      },

      sit: function (code, seat, who, prepare) {
        return poll(code).then(function (t) {
          if (!t || !t.seats) return { ok: false, why: 'gone' };
          t = clone(t);
          if (!seat) seat = !t.seats.w ? 'w' : (!t.seats.b ? 'b' : null);
          if (!seat) return { ok: false, why: 'full' };
          if (t.seats[seat] && t.seats[seat].id !== myId) return { ok: false, why: 'taken' };
          who = who || {};
            t.seats[seat] = { id: myId, name: who.name || 'Игрок', photo: who.photo || '' };
          t.updatedAt = Date.now();
          t.seq = (t.seq || 0) + 1;
          t.code = code;
          if (t.seats.w && t.seats.b) {
            t.status = 'live';
            if (prepare) prepare(t);
          }
          return send(t).then(function () {
            cur = code;
            return { ok: true, seat: seat, table: t };
          });
        });
      },

      watchTable: function (code, cb, onErr) {
        cur = code;
        var dead = false, seen = null, es = null, timer = null;

        function deliver(t) {
          if (dead || !t) return;
          var key = JSON.stringify(t);
          if (key === seen) return;
          seen = key;
          cb(t);
        }

        poll(code).then(deliver, function () {});

        try {
          es = new EventSource(RELAY + '/' + topic(code) + '/sse');
          es.onmessage = function (e) {
            var o;
            try { o = JSON.parse(e.data); } catch (err) { return; }
            if (o.event !== 'message' || !o.message) return;
            try { deliver(JSON.parse(o.message)); } catch (err) {}
          };
          es.onerror = function () { /* EventSource переподключается сам */ };
        } catch (e) {
          if (onErr) onErr({ code: 'unavailable', message: 'нет подписки' });
        }

        /* страховка на случай разрыва: тихо перечитываем тему */
        timer = setInterval(function () {
          poll(code).then(deliver, function () {});
        }, 25000);

        /* вернулись из фона — сразу подтягиваем ходы, не ждём таймера */
        function wake() { if (!document.hidden) poll(code).then(deliver, function () {}); }
        document.addEventListener('visibilitychange', wake);

        return function () {
          dead = true;
          clearInterval(timer);
          document.removeEventListener('visibilitychange', wake);
          if (es) es.close();
        };
      },

      write: function (body) {
        if (!cur) return Promise.resolve();
        body.code = cur;
        return send(body);
      },

      peek: function (code) { return poll(code); },
      here: function () {},
      watchPeers: function () { return function () {}; }
    };
  }

  /* ---------- транспорт 3: свой сервер ---------- */

  /* Стол ведёт сервер: он бросает кости, проверяет ходы, считает время.
     Телефон только просит — «вот мой ход», «давай заново» — и ждёт
     перемен. Место за столом держится секретным ключом стола. */
  function srvTransport(api) {
    var keys = {};
    try { keys = JSON.parse(localStorage.getItem('nardy.keys') || '{}') || {}; } catch (e) { keys = {}; }

    function keep(code, key) {
      if (!code || !key) return;
      delete keys[code];
      keys[code] = key;
      var list = Object.keys(keys);
      while (list.length > 10) delete keys[list.shift()];
      try { localStorage.setItem('nardy.keys', JSON.stringify(keys)); } catch (e) {}
    }

    /* JSON уходит обычным текстом: так браузер не шлёт перед каждым
       ходом предварительный запрос, и ход доходит вдвое быстрее. */
    function post(path, body, signal) {
      return fetch(api + path, { method: 'POST', body: JSON.stringify(body), signal: signal, cache: 'no-store' })
        .then(function (r) {
          return r.json().then(function (d) {
            if (r.status >= 500) { var e = new Error(d.error || 'server'); e.status = r.status; throw e; }
            d.status = r.status;
            if (d.table) clock(d.table.now);
            return d;
          }, function () {
            var e = new Error('bad answer'); e.status = r.status; throw e;
          });
        });
    }

    function clock(now) { if (now) skew = now - Date.now(); }

    function who(w) {
      return {
        id: myId,
        name: (w && w.name) || myName || 'Игрок',
        photo: (w && w.photo) || ''
      };
    }
    function tg() { return global.NardyTG ? NardyTG.initData() : ''; }

    /* Просьбы игрока идут по одной и повторяются, пока связь не вернётся.
       Ответ с ошибкой — тоже ответ: в нём свежий стол, по нему и выравниваемся. */
    var queue = [], sending = false, tries = 0;

    function pump() {
      if (sending || !queue.length) return;
      sending = true;
      var job = queue[0];
      post(job.path, job.body).then(function (d) {
        sending = false;
        queue.shift();
        if (tries && global.NardyNet && NardyNet.onBack) NardyNet.onBack();
        tries = 0;
        job.ok(d);
        pump();
      }, function (e) {
        sending = false;
        if (e && e.status >= 500 && tries >= 4) { queue.shift(); job.ok({ error: 'server' }); tries = 0; pump(); return; }
        tries++;
        if (tries === 1 && global.NardyNet && NardyNet.onLost) NardyNet.onLost();
        setTimeout(pump, Math.min(10000, 600 * Math.pow(2, tries - 1)));
      });
    }

    function ask(path, extra) {
      var body = { code: cur, key: keys[cur] };
      for (var k in extra) body[k] = extra[k];
      return new Promise(function (ok) {
        queue.push({ path: path, body: body, ok: ok });
        pump();
      });
    }

    var cur = null;

    function seated(d) {
      if (d.error) return { ok: false, why: d.error };
      cur = d.table.code;
      keep(cur, d.key);
      return { ok: true, seat: d.seat, table: d.table, code: cur };
    }

    return {
      kind: 'srv',
      hasLobby: false,
      hasPresence: true,
      authoritative: true,

      watchLobby: function (cb) { cb([]); return function () {}; },

      create: function (body) {
        return post('/api/table', { seat: body.seat, opts: body.opts, who: who(body.who), initData: tg() })
          .then(function (d) { return seated(d); });
      },

      sit: function (code, seat, w) {
        return post('/api/table/sit', { code: code, key: keys[code], who: who(w), initData: tg() })
          .then(function (d) { return seated(d); });
      },

      /* Долгое ожидание: сервер держит запрос, пока на столе ничего не
         случилось (до 25 секунд), и отвечает сразу, как только случилось. */
      watchTable: function (code, cb, onErr) {
        cur = code;
        var dead = false, after = -1, ctl = null, fails = 0, timer = null;

        function loop() {
          if (dead) return;
          clearTimeout(timer);
          ctl = typeof AbortController === 'function' ? new AbortController() : null;
          var mine = ctl;
          post('/api/table/watch', { code: code, key: keys[code], after: after }, ctl && ctl.signal)
            .then(function (d) {
              if (dead || mine !== ctl) return;
              if (d.status === 404) { dead = true; cb(null); return; }
              fails = 0;
              if (d.table) { after = d.table.seq; cb(d.table); }
              loop();
            }, function (e) {
              if (dead || mine !== ctl) return;          /* сами оборвали — уже ждём заново */
              fails++;
              if (fails === 3 && onErr) onErr(e);
              timer = setTimeout(loop, Math.min(8000, 400 * Math.pow(2, fails)));
            });
        }

        /* из фона iOS мог оборвать запрос молча — начинаем ждать заново сразу */
        function wake() {
          if (document.hidden || dead) return;
          if (ctl) ctl.abort();
          ctl = null;
          loop();
        }
        document.addEventListener('visibilitychange', wake);
        loop();

        return function () {
          dead = true;
          clearTimeout(timer);
          document.removeEventListener('visibilitychange', wake);
          if (ctl) ctl.abort();
        };
      },

      write: function () { return Promise.resolve(); },

      peek: function (code) {
        return post('/api/table/watch', { code: code, key: keys[code], after: -1 })
          .then(function (d) { return d.table || null; });
      },

      turn: function (game, ply, moves) { return ask('/api/table/turn', { game: game, ply: ply, moves: moves }); },
      offer: function () { return ask('/api/table/offer', {}); },
      answer: function (yes) { return ask('/api/table/answer', { yes: !!yes }); },
      again: function () { return ask('/api/table/again', {}); },

      here: function () {},
      watchPeers: function () { return function () {}; }
    };
  }

  /* ---------- выбор транспорта ---------- */

  var skew = 0;           /* насколько часы сервера впереди наших */

  function connect() {
    if (boot) return boot;
    boot = pickTransport().then(function (t) { T = t; return t; });
    return boot;
  }

  function pickTransport() {
    if (global.claude && typeof global.claude.use === 'function') {
      return global.claude.use('db').then(function (db) {
        if (!db) return relayIfPossible();
        return global.claude.use('room').then(
          function (room) { return dbTransport(db, room || null); },
          function () { return dbTransport(db, null); }
        );
      }, function () { return relayIfPossible(); });
    }
    var api = global.NardyAccount && NardyAccount.api();
    if (api && typeof fetch === 'function') return Promise.resolve(srvTransport(api));
    if (global.NardyFB && NardyFB.ready() && !global.claude) {
      return Promise.resolve(NardyFB.transport(function () { return myId; }, function () { return myName; }));
    }
    return Promise.resolve(relayIfPossible());
  }

  /* Ретранслятор нужен снаружи: со страницы артефакта наружу не пускает
     политика безопасности, а с file:// запросы часто рубит CORS. */
  function relayIfPossible() {
    if (global.claude && typeof global.claude.use === 'function') return null;
    if (global.location.protocol !== 'http:' && global.location.protocol !== 'https:') return null;
    if (typeof fetch !== 'function' || typeof EventSource !== 'function') return null;
    return relayTransport();
  }

  function api(name) {
    return function () {
      if (!T) return name === 'watchLobby' || name === 'watchPeers' || name === 'watchTable'
        ? function () {} : Promise.resolve(null);
      return T[name].apply(T, arguments);
    };
  }

  global.NardyNet = {
    connect: connect,
    id: function () { return myId; },
    name: function () { return myName; },
    rename: function (n) {
      myName = (n || '').slice(0, 18);
      try { localStorage.setItem('nardy.name', myName); } catch (e) {}
    },
    kind: function () { return T ? T.kind : null; },
    hasLobby: function () { return !!(T && T.hasLobby); },
    hasRoom: function () { return !!(T && T.hasPresence); },
    /* стол ведёт сервер — телефон ничего не пишет сам */
    authoritative: function () { return !!(T && T.authoritative); },
    /* время по часам сервера — для отсчёта хода */
    now: function () { return T && T.now ? T.now() : Date.now() + skew; },
    watchLobby: api('watchLobby'),
    create: api('create'),
    sit: api('sit'),
    watchTable: api('watchTable'),
    write: api('write'),
    peek: api('peek'),
    here: api('here'),
    watchPeers: api('watchPeers'),
    turn: api('turn'),
    offer: api('offer'),
    answer: api('answer'),
    again: api('again'),
    leave: function () { if (T) T.here(null, null); }
  };
})(window);
</script>
<script>
/* ============================================================
   Нарды — интерфейс: расстановка шашек, ходы, диалоги, звук
   ============================================================ */
(function () {
  'use strict';

  var N = window.Nardy, B = window.NardyBoard, AI = window.NardyAI;
  var $ = function (id) { return document.getElementById(id); };

  var board = $('board'), scene = $('scene'), stage = $('stage');
  var lZones = $('zones'), lMen = $('men');

  var S = null;              /* состояние партии */
  var VIS = null;            /* какие шашки где лежат: { pts: [..], off: {} } */
  var men = {};              /* id шашки -> элемент */
  var pos = {};              /* id -> {x,y} в пикселях */
  var tags = [];             /* счётчики на высоких стопках */
  var sel = null;            /* выбранный пункт */
  var legal = [];
  var busy = true;
  var undoStack = [];
  var tally = { w: 0, b: 0 };
  var drag = null;

  var opts = { mode: 'ai', level: 'normal', human: 'w', sound: true, amb: true, banter: 'hard', timer: 'off', match: '0' };
  try {
    var prefs = JSON.parse(localStorage.getItem('nardy.opts') || 'null');
    if (prefs) { for (var k in prefs) if (opts[k] !== undefined) opts[k] = prefs[k]; }
    var sc = JSON.parse(localStorage.getItem('nardy.tally') || 'null');
    if (sc) tally = sc;
  } catch (e) { /* приватный режим — просто играем без сохранения */ }

  function save() {
    try {
      localStorage.setItem('nardy.opts', JSON.stringify(opts));
      localStorage.setItem('nardy.tally', JSON.stringify(tally));
    } catch (e) {}
  }

  /* Незаконченная партия переживает перезагрузку страницы */
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('nardy.game') || 'null'); } catch (e) {}
  if (saved && (!saved.s || saved.s.winner)) saved = null;

  function persist() {
    if (opts.mode === 'net') return;
    try {
      localStorage.setItem('nardy.game', JSON.stringify({ s: S }));
    } catch (e) {}
  }

  function forget() {
    saved = null;
    try { localStorage.removeItem('nardy.game'); } catch (e) {}
  }

  function isAI(p) { return opts.mode === 'ai' && p !== opts.human; }
  function nameOf(p) { return p === 'w' ? 'Белые' : 'Чёрные'; }

  /* ---------- сетевой стол ---------- */

  var net = {
    ready: null,      /* null — проверяем, false — сети нет */
    code: null,
    seat: null,
    table: null,
    unsub: null,
    unpeers: null,
    peers: [],
    shown: false,     /* итог партии уже показан */
    toss: null,
    moves: [],        /* шашки, сдвинутые за мой текущий ход, — уйдут серверу разом */
    gid: null,        /* какая партия стола сейчас на доске */
    turnKey: '',      /* чей и какой по счёту ход сейчас на доске */
    warned: ''        /* о каком ходе уже предупредили «осталось 10 секунд» */
  };
  var lobbyOff = null;
  var bf = {};              /* какие подколы за партию уже прозвучали */
  var sixes = { w: 0, b: 0 };  /* сколько раз за партию выпало 6-6 — для наколки */

  function isNet() { return opts.mode === 'net' && !!net.code; }

  /* Стол ведёт сервер: кости бросает он, ход уходит ему целиком */
  function auth() { return isNet() && NardyNet.authoritative(); }

  /* Ссылка, по которой соперник попадает сразу за стол */
  function shareLink() {
    return location.origin + location.pathname + location.search + '#stol=' + net.code;
  }

  function readInvite() {
    var p = NardyTG.startParam();
    if (p && p.length >= 4 && p.length <= 8) return p;
    var m = /[#?&]stol=([A-Za-z0-9]{4,8})/.exec(location.hash + location.search);
    return m ? m[1].toUpperCase() : null;
  }

  function forgetInvite() {
    try {
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {}
  }

  /* Чей сейчас ход с точки зрения этого устройства */
  function mine() {
    if (!S || S.winner) return false;
    return isNet() ? net.seat === S.turn : !isAI(S.turn);
  }

  function canPlay() { return !busy && !!S && !S.winner && mine(); }

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function sig(st) {
    return st.points.join(',') + '|' + st.off.w + ':' + st.off.b + '|' + st.turn +
      '|' + st.dice.slice().sort().join('') + '|' + st.roll.join('') +
      '|' + st.headUsed + '|' + (st.winner || '');
  }

  /* ---------- звук ---------- */

  /* Стук — кости и шашки, фон — гул чайханы (js/sound.js).
     Вибрация идёт всегда: она не мешает соседям. */
  function sfx(kind) {
    NardyTG.buzz(kind);
    if (opts.sound) NardySound.play(kind);
  }

  /* ---------- построение доски ---------- */

  function box(el, r) {
    var q = B.map(r.x, r.y, r.w, r.h);
    el.style.left = (q.x / B.vw() * 100) + '%';
    el.style.top = (q.y / B.vh() * 100) + '%';
    el.style.width = (q.w / B.vw() * 100) + '%';
    el.style.height = (q.h / B.vh() * 100) + '%';
  }

  function buildZones() {
    lZones.innerHTML = '';
    for (var i = 0; i < 24; i++) {
      var g = B.geom(i), z = document.createElement('div');
      z.className = 'zone';
      z.dataset.i = i;
      box(z, g);
      lZones.appendChild(z);
    }
    /* лотки: бросить шашку в лоток = снять её с доски */
    ['w', 'b'].forEach(function (p) {
      var e = document.createElement('div');
      e.className = 'zone tray';
      e.dataset.tray = p;
      box(e, B.trayBox(p));
      lZones.appendChild(e);
    });
  }

  function buildMen() {
    lMen.innerHTML = '';
    men = {}; tags = [];
    ['w', 'b'].forEach(function (p) {
      for (var i = 0; i < N.NC; i++) {
        var e = document.createElement('div');
        e.className = 'man ' + p;
        e.style.backgroundImage = 'url(' + B.checker(p, 176) + ')';
        e.dataset.id = p + i;
        lMen.appendChild(e);
        men[p + i] = e;
      }
    });
    for (var t = 0; t < 24; t++) {
      var tg = document.createElement('div');
      tg.className = 'tag';
      tg.style.display = 'none';
      lMen.appendChild(tg);
      tags.push(tg);
    }
  }

  /* Раскладка шашек выводится из позиции: один источник правды */
  function visFrom(st) {
    var v = { pts: [], off: { w: [], b: [] } }, i, j, c;
    for (i = 0; i < 24; i++) v.pts.push([]);
    ['w', 'b'].forEach(function (p) {
      var next = 0;
      for (i = 0; i < 24; i++) {
        c = N.cnt(st, i, p);
        for (j = 0; j < c; j++) v.pts[i].push(p + (next++));
      }
      for (j = 0; j < st.off[p]; j++) v.off[p].push(p + (next++));
    });
    return v;
  }

  /* Доска лежит горизонтально и занимает всю ширину экрана.
     Таблички игроков прижимаются к ней вплотную, а свободная высота
     уходит наружу — иначе вокруг доски зияют пустые поля. */
  function fit() {
    var tbl = document.querySelector('.table');
    var w = tbl.clientWidth;
    var h = tbl.clientHeight - $('pl-w').offsetHeight - $('pl-b').offsetHeight - 20;
    if (!w || h < 120) return;
    var ar = B.vw() / B.vh();
    if (w / h > ar) w = h * ar; else h = w / ar;
    board.style.width = Math.floor(w) + 'px';
    board.style.height = Math.floor(h) + 'px';
    stage.style.flex = 'none';
    stage.style.height = Math.floor(h) + 'px';
  }

  /* Свой цвет снизу, свой дом — в ближнем углу: как за настоящим столом */
  function setSides() {
    var my = isNet() ? net.seat : (opts.mode === 'ai' ? opts.human : 'w');
    $('pl-w').style.order = my === 'b' ? '0' : '2';
    $('pl-b').style.order = my === 'b' ? '2' : '0';
    stage.style.order = '1';
    /* доску не разворачиваем: расстановка голов фиксированная */
  }

  function scale() { return board.clientWidth / B.vw(); }

  /* из координат доски — в экранные пиксели с учётом разворота */
  function px(x, y, size, k) {
    var q = B.map(x, y, size, size);
    return { x: q.x * k, y: q.y * k };
  }

  function setT(id, x, y, extra) {
    pos[id] = { x: x, y: y };
    men[id].style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)' + (extra || '');
  }

  function place(instant) {
    var k = scale(), i, j, ids, n, p, id;
    if (!k) return;
    lMen.style.setProperty('--cd', (B.CD * k) + 'px');

    if (instant) {
      lMen.style.transition = 'none';
      for (id in men) men[id].style.transition = 'none';
    }

    for (i = 0; i < 24; i++) {
      ids = VIS.pts[i]; n = ids.length;
      for (j = 0; j < n; j++) {
        p = px(B.manAt(i, j, n).x, B.manAt(i, j, n).y, B.CD, k);
        var lift = (sel === i && j === n - 1) ? ' scale(1.06)' : '';
        setT(ids[j], p.x, p.y, lift);
        men[ids[j]].style.zIndex = 1 + j;
        men[ids[j]].classList.toggle('pick', sel === i && j === n - 1);
      }
      var tg = tags[i];
      if (n > 5) {
        var top = px(B.manAt(i, n - 1, n).x, B.manAt(i, n - 1, n).y, B.CD, k);
        tg.style.display = '';
        tg.textContent = n;
        tg.style.transform = 'translate3d(' + top.x.toFixed(1) + 'px,' +
          (top.y + B.CD * k * 0.32).toFixed(1) + 'px,0)';
        tg.className = 'tag' + (VIS.pts[i][0][0] === 'b' ? ' on-dark' : '');
      } else tg.style.display = 'none';
    }

    ['w', 'b'].forEach(function (pl) {
      VIS.off[pl].forEach(function (mid, idx) {
        var t = B.trayAt(pl, idx), q = px(t.x, t.y, B.CD, k);
        setT(mid, q.x, q.y);
        men[mid].style.zIndex = 1 + idx;
      });
    });

    if (instant) {
      void lMen.offsetHeight;
      lMen.style.transition = '';
      for (id in men) men[id].style.transition = '';
    }
    renderDice(false);
    markLive();
  }

  /* Пункты, с которых сейчас есть ход */
  function markLive() {
    var live = {};
    if (!busy && mine()) {
      legal.forEach(function (m) {
        live[m.from] = 1;
        if (m.to === N.OFF) live.off = 1;
      });
    }
    for (var i = 0; i < 24; i++) lZones.children[i].classList.toggle('live', !!live[i]);
    lZones.children[24].classList.remove('live');
    lZones.children[25].classList.remove('live');
  }

  /* ---------- кости ---------- */

  var diceKey = '';

  /* Кости живут на своём холсте: бросок считается физикой */
  function renderDice(animate) {
    if (!S || !S.roll.length) { diceKey = ''; NardyDice.clear(); return; }
    var vals = S.roll[0] === S.roll[1]
      ? [S.roll[0], S.roll[0], S.roll[0], S.roll[0]]
      : S.roll.slice();
    var left = S.dice.slice(), used = [];
    vals.forEach(function (v) {
      var at = left.indexOf(v);
      if (at >= 0) { left.splice(at, 1); used.push(false); } else used.push(true);
    });
    var key = S.turn + ':' + S.roll.join(',') + ':' + S.turnNo.w + ':' + S.turnNo.b;
    if (animate) {
      diceKey = key;
      NardyDice.roll(S.turn, vals, diceTick, function () { renderDice(false); });
      return;
    }
    if (NardyDice.rolling()) return;
    if (key !== diceKey) { diceKey = key; NardyDice.place(S.turn, vals); }
    NardyDice.show(used);
  }

  /* стук кости о доску на каждом отскоке.
     Имя не tick: так называется счётчик отложенных действий. */
  function diceTick() { if (opts.sound) NardySound.play('tick'); }

  /* жеребьёвка: по кости каждому, летят с обеих сторон */
  function renderOpeningDice(a, b) {
    diceKey = 'toss';
    NardyDice.roll('w', [a, b], diceTick, null, { sides: ['w', 'b'], wide: true });
  }

  /* ---------- метки возможных ходов ---------- */

  /* Куда дойдёт выбранная шашка: {пункт: цепочка ходов}.
     При 6-4 сюда попадают и +6, и +4, и +10 одним махом. */
  var reach = {};

  /* ---------- панели ---------- */

  /* Реплика комментатора. side: 'me' — событие у того, кто смотрит */
  function sideOf(p) {
    var who = isNet() ? net.seat : (opts.mode === 'ai' ? opts.human : null);
    return (who && p === who) ? 'me' : 'foe';
  }

  function quip(event, who, force) {
    var text = NardyBanter.line(opts.banter, event, sideOf(who), force);
    if (!text) return;
    var q = $('quip');
    q.textContent = text;
    q.classList.add('show');
    clearTimeout(quip._t);
    quip._t = setTimeout(function () { q.classList.remove('show'); }, 2600);
  }

  function hushQuip() {
    $('quip').classList.remove('show');
    clearTimeout(quip._t);
  }

  function toast(text, ms) {
    var t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 1900);
  }

  /* Чей цвет «мой» на этом экране: он снизу, его счёт — первым */
  function myColor() { return isNet() ? net.seat : (opts.mode === 'ai' ? opts.human : null); }

  function updateUI() {
    if (!S) return;
    var me = myColor(), a = me || 'w', z = N.opp(a);
    $('tally-a').textContent = tally[a];
    $('tally-z').textContent = tally[z];
    var to = auth() && net.table && net.table.opts ? net.table.opts.to : 0;
    $('score-sub').textContent = to ? 'до ' + to : 'счёт';
    ['w', 'b'].forEach(function (p) {
      var who = plate(p);
      $('name-' + p).textContent = who.name;
      $('meta-' + p).textContent = who.meta;
      $('pl-' + p).classList.toggle('act', !S.winner && S.turn === p);
    });
    paintClock();
    var my = canPlay();
    $('act-undo').disabled = !(my && undoStack.length);
    setSides();
    setAvatars();
    $('act-sound').setAttribute('aria-pressed', String(opts.sound));
    $('act-sound').classList.toggle('off', !opts.sound);
    $('act-sound').title = opts.sound ? 'Выключить стук' : 'Включить стук';
    $('act-amb').setAttribute('aria-pressed', String(opts.amb));
    $('act-amb').classList.toggle('off', !opts.amb);
    $('act-amb').title = opts.amb ? 'Выключить гул чайханы' : 'Включить гул чайханы';
  }

  /* Что написано на табличке игрока: имя крупно, под ним цвет и состояние */
  function plate(p) {
    var color = p === 'w' ? 'белые' : 'чёрные';
    if (isNet()) {
      var seat = net.table && net.table.seats ? net.table.seats[p] : null;
      if (!seat) return { name: 'Место свободно', meta: color + ' · ждём соперника' };
      if (seat.id === NardyNet.id()) return { name: seat.name || 'Вы', meta: color + ' · вы' };
      var tag = NardyNet.hasRoom() ? (oppOnline(p) ? ' · в сети' : ' · не в сети') : '';
      return { name: seat.name || 'Соперник', meta: color + tag };
    }
    if (isAI(p)) {
      var lvl = { easy: 'новичок', normal: 'опытный', hard: 'мастер' }[opts.level];
      return { name: 'Компьютер', meta: color + ' · ' + lvl };
    }
    if (opts.mode === 'ai') {
      var u = NardyAccount.user();
      return { name: (u && u.name) || NardyNet.name() || 'Вы', meta: color };
    }
    return { name: p === 'w' ? 'Белые' : 'Чёрные', meta: 'игрок' };
  }

  /* Часы хода: «ходит · 0:42» и кольцо вокруг аватарки того, чей ход */
  var RING = 2 * Math.PI * 24;
  function paintClock() {
    var ms = clockLeft(), full = NardyTable.LIMITS.move;
    ['w', 'b'].forEach(function (p) {
      var on = ms >= 0 && S && !S.winner && S.turn === p;
      $('pl-' + p).classList.toggle('clocked', on);
      $('pl-' + p).classList.toggle('hurry', on && ms <= 10000);
      $('turn-' + p).textContent = on ? 'ходит · ' + clockText(ms) : 'ходит';
      if (on) {
        var frac = Math.max(0, Math.min(1, ms / full));
        $('ring-' + p).style.strokeDasharray = (frac * RING).toFixed(1) + ' ' + RING.toFixed(1);
      }
    });
  }

  /* Аватарка: у людей — фото или медальон, у компьютера — резная шашка */
  var seatPhotos = {};

  function seatPic(seat) {
    var lk = seat.look || {};
    if (lk.pic === 'medal') return NardyProfile.medal(lk.medal, 96);
    if (lk.pic === 'photo' && seat.acc && window.NardyFB) {
      if (seatPhotos[seat.acc] === undefined) {
        seatPhotos[seat.acc] = '';
        NardyFB.photoOf(seat.acc).then(function (src) { seatPhotos[seat.acc] = src || ''; updateUI(); });
      }
      if (seatPhotos[seat.acc]) return seatPhotos[seat.acc];
    }
    return seat.photo || '';
  }

  function setAvatars() {
    ['w', 'b'].forEach(function (p) {
      var box = $('ava-' + p);
      if (!box) return;
      var url = '';
      if (isNet()) {
        var seat = net.table && net.table.seats ? net.table.seats[p] : null;
        url = !seat ? '' : (p === net.seat ? myPic(96) : seatPic(seat));
      } else if (opts.mode === 'ai' && p === opts.human) {
        url = myPic(96);
      }
      if (box.dataset.url === url) return;
      box.dataset.url = url;
      box.innerHTML = url
        ? '<img alt="" src="' + esc(url) + '" onerror="this.remove()">'
        : '<span class="disc ' + p + '"></span>';
      var d = box.querySelector('.disc');
      if (d) d.style.backgroundImage = 'url(' + B.checker(p, 96) + ')';
    });
  }

  /* ---------- ход ---------- */

  /* Пока тикает таймер, состояние может смениться (пришёл ход соперника).
     Такой отложенный вызов нужно отменить, иначе он сработает не по той партии. */
  var tick = 0;

  function later(ms, fn) {
    var at = tick;
    setTimeout(function () { if (at === tick) fn(); }, ms);
  }

  function snapshot() {
    return {
      st: N.clone(S),
      vis: {
        pts: VIS.pts.map(function (a) { return a.slice(); }),
        off: { w: VIS.off.w.slice(), b: VIS.off.b.slice() }
      },
      sent: net.moves.length
    };
  }

  function doMove(mv) { doChain([mv]); }

  /* Одна шашка за один жест — даже если это сумма костей: при 6-2
     на 8 правила проверяют каждый шаг, а глазу видно одно движение,
     прямо на 8, без заезда на промежуточный пункт. И отменяется
     такой ход тоже целиком. */
  function doChain(path) {
    tick++;
    undoStack.push(snapshot());
    var p = S.turn, last = path[path.length - 1];
    var id = VIS.pts[path[0].from].pop();
    if (last.to === N.OFF) VIS.off[p].push(id); else VIS.pts[last.to].push(id);
    path.forEach(function (mv) {
      N.applyTo(S, mv);
      if (auth() && p === net.seat) net.moves.push({ from: mv.from, to: mv.to, die: mv.die });
    });
    sel = null;
    place(false);
    men[id].classList.remove('land');
    void men[id].offsetWidth;
    men[id].classList.add('land');
    sfx(last.to === N.OFF ? 'off' : 'move');
    if (last.to === N.OFF) quip('off', p);
    updateUI();
    persist();
    /* По сети отдельные шашки не шлём: сопернику уходит весь ход разом,
       при передаче хода. */
  }

  function undo() {
    if (!undoStack.length) return;
    quip('undo', S.turn);
    var s = undoStack.pop();
    S = s.st;
    VIS = s.vis;
    net.moves.length = s.sent;
    sel = null;
    legal = N.legalMoves(S);
    place(false);
    updateUI();
  }

  function afterMove() {
    if (S.winner) { auth() ? sendTurn() : finish(); return; }
    legal = N.legalMoves(S);
    if (!legal.length) {
      if (S.dice.length && !isAI(S.turn)) toast('Больше ходить нечем');
      later(850, passTurn);
      return;
    }
    if (!isAI(S.turn)) busy = false;
    markLive();
    updateUI();
  }

  function passTurn() {
    if (auth()) { sendTurn(); return; }
    if (S.winner) { finish(); return; }
    N.endTurn(S);
    if (isNet()) { busy = true; legal = []; markLive(); updateUI(); pushTable(); return; }
    beginTurn();
  }

  function beginTurn() {
    sel = null;
    undoStack = [];
    busy = true;
    misses = 0;
    tick++;
    var d1 = N.rollDie(), d2 = N.rollDie();
    N.setRoll(S, d1, d2);
    renderDice(true);
    sfx('dice');
    legal = N.legalMoves(S);
    updateUI();
    persist();
    pushTable();
    banter(d1, d2);
    if (!legal.length) {
      toast(nameOf(S.turn) + ': ходов нет');
      sfx('no');
      quip('stuck', S.turn, true);
      later(1500, passTurn);
      return;
    }
    if (isAI(S.turn)) later(700, aiTurn);
    else { busy = false; markLive(); updateUI(); }
  }

  /* На каждый бросок — своя реплика. Редкое событие важнее обычного броска */
  function banter(d1, d2) {
    var p = S.turn, ev;
    if (d1 === 6 && d2 === 6) sixes[p]++;
    if (!S.turnNo.w && !S.turnNo.b) ev = 'start';
    else if (!bf['home' + p] && N.allHome(S, p) && S.off[p] < 12) { bf['home' + p] = 1; ev = 'home'; }
    else if (!bf['almost' + p] && S.off[p] >= 12) { bf['almost' + p] = 1; ev = 'almost'; }
    else if (d1 === d2 && d1 === 6) ev = 'six';
    else if (d1 === d2) ev = 'double';
    else if (d1 + d2 === 3) ev = 'worst';
    else if (!bf.slow && S.turnNo.w + S.turnNo.b >= 90) { bf.slow = 1; ev = 'slow'; }
    else if (!bf.head && S.turnNo[p] >= 8 && N.cnt(S, N.HEAD[p], p) >= 10 &&
             sideOf(p) === 'me') { bf.head = 1; ev = 'head'; }
    else ev = 'roll';
    quip(ev, p, true);
  }

  function aiTurn() {
    var path = AI.choose(S, opts.level);
    if (!path.length) { passTurn(); return; }
    (function step(i) {
      if (i >= path.length || S.winner) { afterMove(); return; }
      doMove(path[i]);
      later(500, function () { step(i + 1); });
    })(0);
  }

  /* ---------- выбор шашки ---------- */

  function pick(i) {
    sel = i;
    reach = N.chains(S, i);
    place(false);
    markLive();
  }

  function clearSel() {
    if (sel === null) return;
    sel = null;
    reach = {};
    place(false);
    markLive();
  }

  function tryMoveTo(to) {
    var path = reach[to];
    if (!path || !path.length) return false;
    busy = true;
    reach = {};
    doChain(path);
    later(260, afterMove);
    return true;
  }

  function canPick(i) {
    return legal.some(function (m) { return m.from === i; });
  }

  /* ---------- указатель: клик и перетаскивание ---------- */

  /* Промах: щелчок и отдача, а на каждый третий за ход — фраза */
  var misses = 0;

  function miss() {
    sfx('no');
    misses++;
    if (misses % 3 === 0) quip('miss', S.turn, true);
  }

  function onDown(e) {
    if (!canPlay()) return;
    var z = e.target.closest ? e.target.closest('.zone') : null;
    if (!z) { clearSel(); return; }
    if (z.dataset.tray) {
      if (z.dataset.tray === S.turn && sel !== null) tryMoveTo(N.OFF);
      return;
    }
    var i = +z.dataset.i;
    if (sel !== null && sel !== i) {
      if (tryMoveTo(i)) return;
      if (N.cnt(S, i, S.turn) === 0) { miss(); clearSel(); return; }
    }
    if (!canPick(i)) {
      miss();
      clearSel();
      return;
    }
    if (sel !== i) pick(i);          /* по своей же шашке — сразу тащим */
    var ids = VIS.pts[i];
    var id = ids[ids.length - 1];
    drag = { id: id, from: i, x0: e.clientX, y0: e.clientY, moved: false };
    try { lZones.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function onMove(e) {
    if (!drag) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 7) return;
    drag.moved = true;
    var el = men[drag.id], p = pos[drag.id];
    el.style.transition = 'none';
    el.style.zIndex = 30;
    el.classList.add('carry');
    el.style.transform = 'translate3d(' + (p.x + dx) + 'px,' + (p.y + dy - B.CD * scale() * 0.18) +
      'px,0) scale(1.16)';
  }

  /* Куда упала шашка. Палец редко попадает точно, поэтому если промах —
     берём ближайший доступный пункт в пределах полутора шашек. */
  function dropTarget(cx, cy) {
    var el = document.elementFromPoint(cx, cy);
    var z = el && el.closest ? el.closest('.zone') : null;
    if (z) {
      if (z.dataset.tray) {
        if (z.dataset.tray === S.turn && reach[N.OFF]) return N.OFF;
      } else if (reach[+z.dataset.i]) return +z.dataset.i;
    }
    var r = board.getBoundingClientRect(), k = r.width / B.vw();
    var bx = (cx - r.left) / k, by = (cy - r.top) / k;
    var best = null, bd = 1e9;
    Object.keys(reach).forEach(function (key) {
      var to = +key, p, n;
      if (to === N.OFF) p = B.trayAt(S.turn, VIS.off[S.turn].length);
      else { n = VIS.pts[to].length + 1; p = B.manAt(to, n - 1, n); }
      var q = B.map(p.x, p.y, B.CD, B.CD);
      var ddx = bx - (q.x + B.CD / 2), ddy = by - (q.y + B.CD / 2);
      var dist = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dist < bd) { bd = dist; best = to; }
    });
    return (best !== null && bd < B.CD * 1.7) ? best : null;
  }

  function onCancel() {
    if (!drag) return;
    var el = men[drag.id];
    el.style.transition = '';
    el.classList.remove('carry');
    drag = null;
    place(false);
  }

  function onUp(e) {
    if (!drag) return;
    var d = drag;
    drag = null;
    try { lZones.releasePointerCapture(e.pointerId); } catch (err) {}
    var el = men[d.id];
    el.style.transition = '';
    el.classList.remove('carry');
    if (!d.moved) { place(false); return; }      /* просто нажали — шашка выбрана */
    var to = dropTarget(e.clientX, e.clientY);
    if (to === null || !tryMoveTo(to)) {
      miss();
      place(false);
    }
  }


  /* ---------- игра по сети ---------- */

  function oppOnline(p) {
    var t = net.table;
    if (t && t.seen) return !!t.seen[p] && t.now - t.seen[p] < 45000;
    for (var i = 0; i < net.peers.length; i++) {
      var pr = net.peers[i].presence;
      if (pr && pr.table === net.code && pr.seat === p && !net.peers[i].isMe) return true;
    }
    return false;
  }

  /* Полное тело документа стола */
  function tableBody(extra) {
    var t = net.table || {};
    var b = {
      v: 1,
      seq: (t.seq || 0) + 1,      /* растущий номер: отсеиваем отставшие копии */
      code: net.code,
      status: 'live',
      createdAt: t.createdAt || Date.now(),
      updatedAt: Date.now(),
      seats: t.seats || { w: null, b: null },
      state: S,
      tally: tally,
      toss: t.toss || null,
      gid: t.gid || null,            /* номер партии для сервера */
      offer: t.offer || null,        /* предложение переиграть */
      declined: t.declined || 0
    };
    if (extra) for (var k in extra) b[k] = extra[k];
    return b;
  }

  NardyNet.onLost = function () { if (isNet()) toast('Нет связи — ход уйдёт, как только появится', 3000); };
  NardyNet.onBack = function () { if (isNet()) toast('Связь есть, ход ушёл'); };

  function pushTable(extra) {
    if (!isNet()) return;
    net.table = tableBody(extra);
    NardyNet.write(net.table).then(null, function () {
      toast('Ход не ушёл — проверьте связь');
    });
  }

  /* Двигаем к новой позиции те шашки, которые действительно сдвинулись,
     иначе анимация превратилась бы в телепортацию всей доски. */
  function reconcile() {
    ['w', 'b'].forEach(function (p) {
      var pool = [], take = [], give = [], i, j, k, arr, have, need;
      for (i = 0; i < 24; i++) {
        arr = VIS.pts[i];
        have = 0;
        for (j = 0; j < arr.length; j++) if (arr[j].charAt(0) === p) have++;
        need = N.cnt(S, i, p);
        if (have > need) take.push([i, have - need]);
        else if (need > have) give.push([i, need - have]);
      }
      take.sort(function (a, b) { return N.rel(p, a[0]) - N.rel(p, b[0]); });
      give.sort(function (a, b) { return N.rel(p, a[0]) - N.rel(p, b[0]); });
      take.forEach(function (t) {
        arr = VIS.pts[t[0]];
        for (k = 0; k < t[1]; k++) {
          for (j = arr.length - 1; j >= 0; j--) {
            if (arr[j].charAt(0) === p) { pool.push(arr.splice(j, 1)[0]); break; }
          }
        }
      });
      while (VIS.off[p].length > S.off[p]) pool.push(VIS.off[p].pop());
      give.forEach(function (g) {
        for (k = 0; k < g[1] && pool.length; k++) VIS.pts[g[0]].push(pool.shift());
      });
      while (VIS.off[p].length < S.off[p] && pool.length) VIS.off[p].push(pool.shift());
    });
    if (!visOk()) VIS = visFrom(S);
    place(false);
  }

  function visOk() {
    var i, j, arr, w, b;
    for (i = 0; i < 24; i++) {
      arr = VIS.pts[i]; w = 0; b = 0;
      for (j = 0; j < arr.length; j++) arr[j].charAt(0) === 'w' ? w++ : b++;
      if (w && b) return false;
      if (w !== N.cnt(S, i, 'w') || b !== N.cnt(S, i, 'b')) return false;
    }
    return VIS.off.w.length === S.off.w && VIS.off.b.length === S.off.b;
  }

  /* ---------- стол, который ведёт сервер ---------- */

  function turnKey(t) {
    var st = t.state;
    return t.gid + '|' + st.turn + '|' + st.turnNo.w + '|' + st.turnNo.b + '|' + (st.winner || '');
  }

  /* Ход готов — отдаём серверу все шашки разом. Ответ — новый стол
     с костями соперника; по нему доска и выравнивается. */
  function sendTurn() {
    busy = true;
    legal = [];
    sel = null;
    markLive();
    updateUI();
    var t = net.table;
    NardyNet.turn(t.game, S.turnNo[net.seat], net.moves.slice()).then(function (d) {
      if (!d || !d.table) return;
      /* сервер ход не принял — ставим его позицию, иначе доски разойдутся */
      var bad = d.error && d.error !== 'stale';
      if (bad) toast('Ход не прошёл проверку — позиция восстановлена');
      syncAuth(d.table, bad || d.error === 'stale');
    });
  }

  function syncAuth(t, force) {
    if (!t) {
      toast('Стол закрыт');
      quitTable(true);
      return;
    }
    var old = net.table;
    if (old && t.seq < old.seq) return;                  /* пришла старая копия */
    var newer = !old || t.seq > old.seq || !S || force;
    net.table = t;
    if (t.tally) tally = t.tally;
    if (t.status === 'open') {
      updateUI();
      if (sheet.dataset.kind === 'table' && veil.classList.contains('show')) tableSheet();
      return;
    }
    /* соперник только что сел — окно со столом больше не нужно */
    if ((!old || old.status === 'open') && sheet.dataset.kind === 'table' && veil.classList.contains('show')) {
      closeSheet();
      var opp = t.seats[N.opp(net.seat)];
      toast((opp && opp.name ? opp.name : 'Соперник') + ' за столом — начинаем');
    }
    if (!newer) { updateUI(); return; }                   /* только «в сети» и часы */

    offers(t);
    var st = t.state, key = turnKey(t), fresh = t.gid !== net.gid;
    /* свой ход в разгаре: мои сдвинутые шашки не трогаем */
    if (!force && S && !fresh && key === net.turnKey && st.turn === net.seat && !st.winner) {
      updateUI();
      return;
    }

    tick++;
    if (drag) onCancel();                     /* шашка в пальцах — отпускаем, позиция сменилась */
    var rolled = fresh || key !== net.turnKey;
    net.turnKey = key;
    if (fresh) {
      net.gid = t.gid;
      net.shown = false;
      bf = {}; sixes = { w: 0, b: 0 }; recorded = false; NardyBanter.reset();
      if (sheet.dataset.kind === 'result' && veil.classList.contains('show')) closeSheet();
    }
    S = st;
    if (!VIS) VIS = visFrom(S);
    reconcile();
    sel = null;
    undoStack = [];
    net.moves = [];

    if (rolled && t.last && t.last.auto && !fresh) {
      toast(t.last.by === net.seat
        ? 'Время вышло — за вас сходил компьютер. Просрочка ' + t.late[net.seat] + ' из 3'
        : ((t.seats[t.last.by] || {}).name || 'Соперник') + ' не успел — за него сходил компьютер', 2600);
    }
    if (S.winner) {
      busy = true;
      legal = [];
      renderDice(false);
      markLive();
      updateUI();
      if (!net.shown) finish(false);
      return;
    }
    if (fresh && t.toss && !S.turnNo.w && !S.turnNo.b) {
      /* сначала жеребьёвка по кости с каждой стороны, потом первый бросок */
      busy = true;
      legal = [];
      markLive();
      updateUI();
      NardyDice.clear();
      renderOpeningDice(t.toss.a, t.toss.b);
      sfx('dice');
      toast('Жеребьёвка: ' + t.toss.a + ' — ' + t.toss.b + '. Первыми ходят ' +
        (S.turn === 'w' ? 'белые' : 'чёрные'), 1600);
      later(1700, function () { startTurn(true); });
      return;
    }
    startTurn(rolled);
  }

  /* Начало хода: кости уже брошены сервером, осталось показать */
  function startTurn(rolled) {
    renderDice(rolled);
    if (rolled) { sfx('dice'); banter(S.roll[0], S.roll[1]); }
    if (net.seat !== S.turn) {
      busy = true;
      legal = [];
      markLive();
      updateUI();
      return;
    }
    misses = 0;
    legal = N.legalMoves(S);
    if (!legal.length) {
      busy = true;
      toast('Ходов нет');
      if (rolled) quip('stuck', S.turn, true);
      markLive();
      updateUI();
      later(1500, passTurn);
      return;
    }
    busy = false;
    markLive();
    updateUI();
  }

  /* предложение переиграть: сопернику — вопрос, себе — ответ */
  function offers(t) {
    if (t.offer && t.offer.by !== net.seat && net.seenOffer !== t.offer.ts) {
      net.seenOffer = t.offer.ts;
      offerSheet(t);
    }
    if (net.mineOffer && t.declined && t.declined !== net.seenDecline) {
      net.seenDecline = t.declined;
      net.mineOffer = 0;
      toast('Соперник хочет доиграть');
    }
    if (net.mineOffer && !t.offer) net.mineOffer = 0;
    if (sheet.dataset.kind === 'offer' && !t.offer && veil.classList.contains('show')) closeSheet();
  }

  /* Сколько осталось на ход — по часам сервера */
  function clockLeft() {
    var t = net.table;
    if (!auth() || !t || !t.deadline || !S || S.winner) return -1;
    return Math.max(0, t.deadline - NardyNet.now());
  }

  function clockText(ms) {
    var s = Math.ceil(Math.min(ms, 60000) / 1000);     /* пока идёт жеребьёвка, часы стоят на минуте */
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  setInterval(function () {
    var ms = clockLeft();
    if (ms < 0) return;
    paintClock();
    if (S.turn === net.seat && ms <= 10000 && ms > 0 && net.warned !== net.turnKey) {
      net.warned = net.turnKey;
      NardyTG.buzz('lose');
      toast('Осталось 10 секунд');
    }
  }, 500);

  /* Единственный источник правды в сетевой партии — документ стола */
  function syncFrom(t, force) {
    if (NardyNet.authoritative()) { syncAuth(t, force); return; }
    if (!t) {
      toast('Стол закрыт');
      quitTable(true);
      return;
    }
    if (net.table && (t.seq || 0) < (net.table.seq || 0)) return;   /* пришла старая копия */
    var was = net.table ? net.table.status : 'open';
    net.table = t;
    if (t.status === 'open') {
      updateUI();
      if (sheet.dataset.kind === 'table' && veil.classList.contains('show')) tableSheet();
      return;
    }
    if (was === 'open' && sheet.dataset.kind === 'table' && veil.classList.contains('show')) {
      closeSheet();
      var opp = t.seats[N.opp(net.seat)];
      toast((opp && opp.name ? esc(opp.name) : 'Соперник') + ' за столом — начинаем');
    }
    var st = t.state;
    if (!st || !st.points) return;
    var fresh = !S || sig(st) !== sig(S);
    if (fresh) {
      tick++;                       /* всё отложенное по старой позиции отменяем */
      var rolled = !S || S.roll.join() !== st.roll.join() || S.turn !== st.turn;
      S = st;
      if (!VIS) VIS = visFrom(S);
      reconcile();
      renderDice(rolled);
      sel = null;
      undoStack = [];
    }
    if (t.tally) tally = t.tally;

    /* предложение переиграть: сопернику — вопрос, себе — ответ */
    if (t.offer && t.offer.by !== net.seat && net.seenOffer !== t.offer.ts) {
      net.seenOffer = t.offer.ts;
      offerSheet(t);
    }
    if (net.mineOffer && t.declined && t.declined !== net.seenDecline) {
      net.seenDecline = t.declined;
      net.mineOffer = 0;
      toast('Соперник хочет доиграть');
    }
    if (net.mineOffer && !t.offer) net.mineOffer = 0;
    if (sheet.dataset.kind === 'offer' && !t.offer && veil.classList.contains('show')) {
      closeSheet();
    }
    /* соперник начал новую партию — убираем со своего экрана итог прошлой */
    if (fresh && !st.winner && sheet.dataset.kind === 'result' && veil.classList.contains('show')) {
      closeSheet();
    }
    if (t.toss && net.toss !== t.toss.n && !st.turnNo.w && !st.turnNo.b) {
      net.toss = t.toss.n;
      toast('Жеребьёвка: ' + t.toss.a + ' — ' + t.toss.b + '. Первыми ходят ' +
        (st.turn === 'w' ? 'белые' : 'чёрные'), 1800);
    }
    updateUI();
    if (S.winner) {
      if (!net.shown) finish(false);
      return;
    }
    if (!fresh) return;
    if (net.seat === S.turn) {
      if (!S.dice.length) { beginTurn(); return; }
      legal = N.legalMoves(S);
      if (!legal.length) { busy = true; later(900, passTurn); return; }
      busy = false;
      markLive();
      updateUI();
    } else {
      busy = true;
      legal = [];
      markLive();
      updateUI();
    }
  }

  function toss() {
    var a, b;
    do { a = N.rollDie(); b = N.rollDie(); } while (a === b);
    return { a: a, b: b, n: Date.now(), turn: a > b ? 'w' : 'b' };
  }

  function openTable(code) {
    if (net.unsub) net.unsub();
    if (net.unpeers) net.unpeers();
    net.code = code;
    net.shown = false;
    opts.mode = 'net';
    try { localStorage.setItem('nardy.net', JSON.stringify({ code: code, seat: net.seat })); } catch (e) {}
    buildMen();
    place(true);
    updateUI();
    net.unsub = NardyNet.watchTable(code, syncFrom, function () {
      toast('Связь со столом потеряна');
    });
    NardyNet.here(code, net.seat);
    net.unpeers = NardyNet.watchPeers(function (peers) {
      net.peers = peers;
      updateUI();
    });
  }

  /* Садимся за стол, который ведёт сервер: и свой новый, и чужой */
  function seatedAuth(r) {
    net.seat = r.seat;
    net.table = null;
    net.gid = null;
    net.turnKey = '';
    S = null;
    tally = r.table.tally || { w: 0, b: 0 };
    VIS = visFrom(r.table.state);
    closeSheet();
    openTable(r.code);
    syncAuth(r.table);
  }

  function createTable() {
    var seat = opts.human === 'b' ? 'b' : 'w';
    if (NardyNet.authoritative()) {
      NardyNet.create({
        seat: seat,
        who: { name: NardyNet.name() || 'Игрок', photo: NardyTG.photo() },
        opts: { timer: opts.timer === 'on', to: Number(opts.match) || 0 }
      }).then(function (r) {
        if (!r.ok) { toast('Не удалось создать стол'); return; }
        seatedAuth(r);
        tableSheet();
      }, function () { toast('Сервер не отвечает — стол не создан'); });
      return;
    }
    var seats = { w: null, b: null };
    seats[seat] = { id: NardyNet.id(), name: NardyNet.name() || 'Игрок', photo: NardyTG.photo() };
    var fresh = N.create();
    net.seat = seat;
    net.table = null;
    S = null;
    VIS = visFrom(fresh);
    var body = {
      v: 1, seq: 1, status: 'open', createdAt: Date.now(), updatedAt: Date.now(),
      seats: seats, state: fresh, tally: { w: 0, b: 0 }, toss: null
    };
    NardyNet.create(body).then(function (code) {
      tally = { w: 0, b: 0 };
      net.table = body;        /* что опубликовали, то и знаем — эха не ждём */
      openTable(code);
      tableSheet();
    }, function () { toast('Не удалось создать стол'); });
  }

  function sitDown(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4 || code.length > 8) { toast('Код стола — шесть знаков'); return; }
    NardyNet.sit(code, null, { name: NardyNet.name() || 'Игрок', photo: NardyTG.photo() }, function (t) {
      var st = t.state;
      if (!t.toss && !st.roll.length && !st.turnNo.w && !st.turnNo.b) {
        var x = toss();
        st.turn = x.turn;
        t.toss = x;
        t.gid = code + '-' + Date.now();
      }
    }).then(function (r) {
      if (!r.ok) {
        toast({
          busy: 'За стол как раз садится другой — попробуйте ещё раз',
          gone: 'Такого стола нет',
          full: 'За столом уже двое',
          taken: 'Это место занято'
        }[r.why] || 'Не вышло сесть за стол');
        return;
      }
      if (NardyNet.authoritative()) { seatedAuth(r); return; }
      net.seat = r.seat;
      net.table = r.table;
      S = null;
      VIS = visFrom(r.table.state);
      closeSheet();
      openTable(code);
      syncFrom(r.table);
    }, function () { toast('Не удалось сесть за стол'); });
  }

  /* Итог партии — в личную историю. Игры вдвоём за одним экраном
     не записываем: там оба игрока свои, счёт для профиля бессмыслен. */
  var recorded = false;

  function keepScore(winner, mars) {
    if (recorded) return;
    recorded = true;
    var foe = null, mine;
    if (isNet()) {
      var seat = net.table && net.table.seats ? net.table.seats[N.opp(net.seat)] : null;
      if (!seat) return;
      foe = { id: seat.id, name: seat.name, kind: 'net', acc: seat.acc || null };
      mine = net.seat;
    } else if (opts.mode === 'ai') {
      var lvl = { easy: 'Новичок', normal: 'Опытный', hard: 'Мастер' }[opts.level];
      foe = { id: opts.level, name: 'Компьютер · ' + lvl, kind: 'ai' };
      mine = opts.human;
    } else return;
    /* в общий профиль партию по сети записывает сам стол — здесь только своё, на телефоне */
    var end = auth() && net.table ? net.table.end : null;
    NardyStats.record(foe, winner === mine, mars, {
      six: sixes[mine] || 0,
      shutout: !!(end && end.shutout && winner === mine)
    });
  }

  /* ---------- профиль — главный экран ---------- */

  var remoteMe = null;      /* профиль из общей базы, если игрок из Telegram */

  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  /* Сводка «с людьми»: из общей базы, если она есть, иначе с телефона */
  function peopleStats() {
    var st = NardyStats.summary(), srv = shared() ? remoteMe : null, k;
    var P = srv
      ? { w: srv.w, l: srv.l, mars: srv.mars, marsLost: srv.marsLost, streak: srv.streak, best: srv.best,
          foes: srv.foes || [], bros: srv.bros || [], recent: (srv.recent || []).map(function (g) {
            return { at: g.at, win: g.win, mars: g.mars, why: g.why, kind: 'net', name: g.foe && g.foe.name, acc: g.foe && g.foe.acc };
          }) }
      : { w: st.people.w, l: st.people.l, mars: st.people.mars, marsLost: st.people.marsLost, streak: st.streak, best: st.best,
          foes: st.foes.filter(function (f) { return f.kind === 'net' && f.games > 0; }),
          bros: Object.keys(st.bros), recent: st.recent.filter(function (g) { return g.kind === 'net'; }) };
    P.badges = {};
    for (k in st.badges) P.badges[k] = st.badges[k];
    if (srv && srv.badges) for (k in srv.badges) P.badges[k] = srv.badges[k];
    /* последние партии: с людьми и с компьютером вперемешку, свежие сверху */
    P.last = P.recent.concat(st.recent.filter(function (g) { return g.kind === 'ai'; }))
      .sort(function (a, b) { return b.at - a.at; }).slice(0, 10);
    P.ai = st.ai;
    return P;
  }

  function statsGrid(P) {
    var games = P.w + P.l, pct = games ? Math.round(P.w * 100 / games) : 0;
    var streak = P.streak > 0 ? '+' + P.streak : String(P.streak || 0);
    function cell(v, t) { return '<div><b>' + v + '</b><span>' + t + '</span></div>'; }
    return '<div class="stats">' +
      cell(games, plural(games, 'партия', 'партии', 'партий')) +
      cell(P.w + ':' + P.l, 'победы : поражения') +
      cell(pct + '%', 'побед') +
      cell((P.mars || 0) + ' / ' + (P.marsLost || 0), 'марсы: ставил / ловил') +
      cell(streak, 'серия') +
      cell(P.best || 0, 'лучшая серия') +
      '</div>';
  }

    return '<div class="badges">' + NardyProfile.BADGES.map(function (b) {

        ? '<div class="field"><label>Последние партии</label><ul class="tables">' + P.last.map(function (g) {
            return '<li><b class="mono' + (g.win ? ' won' : ' lost') + '">' + (g.win ? 'П' : 'П̶') + '</b>' +
              '<span>' + (g.win ? 'Победа' : 'Поражение') + (g.mars ? ' марсом' : '') + (g.why === 'time' ? ' по времени' : '') +
              ' · ' + esc(g.name || (g.kind === 'ai' ? 'компьютер' : 'соперник')) + '</span>' +
              '<span class="dim">' + ago(g.at) + '</span></li>';

        : '') +

      '<div class="field"><label>С компьютером</label><ul class="tables"><li><b class="mono">' +
        P.ai.w + ':' + P.ai.l + '</b><span>' + (P.ai.w + P.ai.l) + ' ' +
        plural(P.ai.w + P.ai.l, 'партия', 'партии', 'партий') + ' — в звание не идут</span></li></ul></div>' +

      '<div class="sheet-actions">' +
        (NardyAccount.hasServer() ? '<button class="btn" type="button" data-act="top">Рейтинг</button>' : '') +
        '<button class="btn" type="button" data-act="rules">Правила</button>' +
        (S ? '<button class="btn" type="button" data-act="close">К доске</button>' : '') +
      '</div>' +
      '<div class="sheet-actions" id="home-add" hidden><button class="btn" type="button" data-act="home-add">' +
        'Значок на экран «Домой»</button></div>' +
      '</div>'
    );
    NardyTG.homeScreen(function (status) {
      var box = $('home-add');
      if (box && (status === 'missed' || status === 'unknown')) box.hidden = false;
    });
  }

  function ago(ts) {
    if (!ts) return '';
    var d = Math.max(0, Date.now() - ts), m = Math.round(d / 60000);
    if (m < 1) return 'только что';
    if (m < 60) return m + ' мин';
    var h = Math.round(m / 60);
    if (h < 24) return h + ' ч';
    var days = Math.round(h / 24);
    return days + ' ' + plural(days, 'день', 'дня', 'дней');
  }
