<meta name="theme-color" content="#0F1218">
<title>Длинные нарды</title>
<meta name="description" content="Длинные нарды: партия против компьютера или вдвоём по сети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Нарды. Свёрстано под телефон «к большому пальцу»: соперник,
   доска, вы и полоса кнопок — всё прижато к низу экрана, куда
   дотягивается палец одной руки; пустое место уходит наверх.
   На большом экране раскладка та же, просто шире.
   ============================================================ */

:root {
  --bg:        #0F1218;
  --bg-deep:   #06080D;
  --panel:     #171B24;
  --panel-2:   #1F242F;
  --line:      rgba(200, 162, 74, .18);
  --text:      #EBE3D3;
  --text-dim:  #968D7C;
  --brass:     #C8A24A;
  --brass-lit: #E5C97F;
  --shadow-lg: 0 40px 90px -35px rgba(0, 0, 0, .9);
  --radius:    14px;
  --move-dur:  360ms;
  --ease:      cubic-bezier(.22, .68, .36, 1);
  --gap:       10px;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  background-image: radial-gradient(120% 80% at 50% 0%, #161B24 0%, var(--bg-deep) 100%);
  color: var(--text);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; }

/* ---------- каркас ---------- */

.app {
  height: 100dvh;
  max-width: 760px;
  margin: 0 auto;
  padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
           calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  user-select: none;
  -webkit-user-select: none;
}

/* внутри Telegram шапку рисует сам мессенджер, а высоту окна он же и сообщает */
.tg .app {
  padding-top: 6px;
  height: var(--tgh, 100dvh);
}

/* ---------- кнопки ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color .18s, background .18s, transform .12s, color .18s, opacity .18s;
}

.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .32; }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.btn-key {
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  border-color: transparent;
  color: #14100A;
  font-weight: 500;
}

@media (hover: hover) {
  .btn:hover:not(:disabled) { border-color: var(--brass); color: var(--brass-lit); }
  .btn-key:hover:not(:disabled) { color: #14100A; filter: brightness(1.08); }
}

/* ---------- стол ---------- */

.table {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 8px;
}

/* ---------- нижняя полоса: партия, отмена, счёт, звук ---------- */

.bar {
  flex: none;
  display: grid;
  grid-template-columns: 1.3fr 1fr 1.5fr 1fr 1fr;
  gap: 6px;
}

.bar .btn {
  height: 46px;
  padding: 0 8px;
  border-radius: var(--radius);
  font-size: 13px;
}

.bar #act-undo, .bar #act-sound, .bar #act-amb { font-size: 18px; line-height: 1; }

/* выключенный звук — тусклый и перечёркнутый */
.bar .btn.off { color: var(--text-dim); text-decoration: line-through; text-decoration-thickness: 2px; }

.score {
  display: grid;
  place-items: center;
  align-content: center;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  text-align: center;
  line-height: 1.05;
}

.score b { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }

.score > span {
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.board {
  position: relative;
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  touch-action: none;
}

.board canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  display: block;
}

.layer { position: absolute; inset: 0; pointer-events: none; }
.layer.hit { pointer-events: auto; }

.zone { position: absolute; border-radius: 4px; }

.zone.live { cursor: pointer; }

.zone.live::after {
  content: "";
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 162, 74, .34), transparent 70%);
  opacity: 0;
  transition: opacity .2s;
}

@media (hover: hover) {
  .zone.live:hover::after { opacity: 1; }
}

.zone.tray.live {
  box-shadow: inset 0 0 0 2px rgba(200, 162, 74, .45), inset 0 0 26px rgba(200, 162, 74, .25);
  border-radius: 9px;
}

.zone.tray::after { display: none; }

/* ---------- шашки ---------- */

.man {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  height: var(--cd);
  border-radius: 50%;
  background-size: 100% 100%;
  will-change: transform;
  transition: transform var(--move-dur) var(--ease), filter .2s ease;
  z-index: 1;
  filter: drop-shadow(0 5px 7px rgba(0, 0, 0, .6));
}

.man.pick { z-index: 6; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .7)) brightness(1.08); }

/* шашка в руке: приподнята и отбрасывает длинную тень */
.man.carry {
  z-index: 30;
  filter: drop-shadow(0 16px 18px rgba(0, 0, 0, .75)) brightness(1.12);
}

.man.pick::before {
  content: "";
  position: absolute;
  inset: -6%;
  border-radius: 50%;
  border: 2px solid var(--brass);
  box-shadow: 0 0 18px rgba(200, 162, 74, .55);
}

.man.land { animation: land .34s var(--ease); }

@keyframes land {
  0% { filter: drop-shadow(0 5px 7px rgba(0, 0, 0, .6)) brightness(1.45); }
  100% { filter: drop-shadow(0 5px 7px rgba(0, 0, 0, .6)) brightness(1); }
}

.tag {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  text-align: center;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: calc(var(--cd) * .34);
  font-weight: 500;
  line-height: 1;
  color: #4B3517;
  text-shadow: 0 1px 2px rgba(255, 250, 235, .55);
  z-index: 20;
  pointer-events: none;
}

.tag.on-dark { color: #F1E3BE; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }

/* ---------- кости ---------- */

.die-wrap {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--dd);
  height: var(--dd);
  z-index: 3;
}

.die {
  position: absolute;
  inset: 0;
  background-size: 100% 100%;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .65));
  transition: opacity .3s, transform .3s;
}

.die.used { opacity: .4; transform: scale(.86); }
.die.tumble { animation: tumble .58s var(--ease); }

@keyframes tumble {
  0%   { transform: translateY(-34px) rotate(-160deg) scale(.7); opacity: 0; }
  55%  { transform: translateY(6px) rotate(14deg) scale(1.06); opacity: 1; }
  75%  { transform: translateY(-4px) rotate(-4deg) scale(.99); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}

/* ---------- реплики и сообщения ---------- */

.quip, .toast {
  position: absolute;
  left: 50%;
  transform: translate(-50%, 8px);
  max-width: min(92%, 30rem);
  text-align: center;
  opacity: 0;
  pointer-events: none;
  z-index: 21;
  transition: opacity .28s, transform .28s var(--ease);
}

.quip {
  /* чуть выше середины: ровно по центру она накрывала кости */
  top: 34%;
  margin-top: -1.4em;
  padding: 9px 20px;
  border-radius: 999px;
  background: rgba(12, 9, 6, .78);
  border: 1px solid rgba(200, 162, 74, .34);
  box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .9);
  font-family: Forum, Georgia, serif;
  font-size: clamp(14px, 3.7vw, 19px);
  color: #F4E7C8;
  text-wrap: balance;
  backdrop-filter: blur(4px);
}

.toast {
  bottom: 3%;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(10, 8, 6, .86);
  border: 1px solid rgba(200, 162, 74, .3);
  color: #F0E6D2;
  font-size: 13px;
  backdrop-filter: blur(6px);
}

.quip.show, .toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- таблички игроков ---------- */

.plaque {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
  transition: border-color .3s, background .3s;
}

.plaque::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  width: 100%;
  background: linear-gradient(90deg, var(--brass), transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .5s var(--ease);
}

.plaque.act { border-color: color-mix(in srgb, var(--brass) 55%, transparent); background: var(--panel-2); }
.plaque.act::before { transform: scaleX(1); }

.disc { width: 26px; height: 26px; border-radius: 50%; flex: none; background-size: 100% 100%; }

.pwho { min-width: 0; }

.pname {
  font-family: Forum, Georgia, serif;
  font-size: 18px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .07em;
  text-transform: uppercase;
  line-height: 1.15;
}

.pmeta {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* аватарка: фото из Telegram, иначе шашка своего цвета.
   Вокруг — латунное кольцо: сколько осталось времени на ход */
.ava-ring { position: relative; flex: none; width: 40px; height: 40px; }

.ring {
  position: absolute;
  inset: -6px;
  width: calc(100% + 12px);
  height: calc(100% + 12px);
  opacity: 0;
  transition: opacity .25s;
}

.ring circle { fill: none; stroke-width: 3; }
.ring .track { stroke: rgba(200, 162, 74, .18); }
.ring .left { stroke: var(--brass-lit); stroke-linecap: round; stroke-dasharray: 150.8 150.8; transition: stroke-dasharray .5s linear; }
.plaque.clocked .ring { opacity: 1; }
.plaque.hurry .ring .left { stroke: #E07A5F; }

.ava {
  position: relative;
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 1px var(--line);
}

.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava .disc { width: 100%; height: 100%; }

.turn {
  margin-left: auto;
  flex: none;
  padding: 5px 11px;
  font-variant-numeric: tabular-nums;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  color: #14100A;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: 0;
  transform: scale(.85);
  transition: opacity .25s, transform .25s var(--ease);
}

.plaque.act .turn { opacity: 1; transform: none; }

/* ---------- диалоги ---------- */

.veil {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  background: rgba(6, 8, 13, .76);
  backdrop-filter: blur(10px) saturate(.9);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}

.veil.show { opacity: 1; pointer-events: auto; }

/* в Telegram окно ниже, чем думает браузер: иначе низ диалога
   с кнопкой «Начать» уезжает под интерфейс мессенджера */
.tg .veil { bottom: auto; height: var(--tgh, 100dvh); }
.veil { overflow-y: auto; }

.sheet {
  width: min(460px, 100%);
  max-height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: var(--shadow-lg);
  padding: 22px 20px 20px;
  transform: translateY(12px) scale(.98);
  transition: transform .3s var(--ease);
}

.veil.show .sheet { transform: none; }

.sheet h1 {
  margin: 0 0 4px;
  font-family: Forum, Georgia, serif;
  font-size: 27px;
  font-weight: 400;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-wrap: balance;
}

.sheet .lede { margin: 0 0 18px; color: var(--text-dim); font-size: 13px; }

.field { margin-bottom: 16px; }

.field > label {
  display: block;
  margin-bottom: 6px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
}

.seg button {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 9px 4px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-dim);
  transition: background .2s, color .2s;
}

.seg button[aria-pressed="true"] {
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  color: #14100A;
}

.seg button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

.sheet-actions { display: flex; gap: 8px; margin-top: 20px; }
.sheet-actions .btn { flex: 1; text-align: center; padding: 12px 10px; }

.hint { margin: 7px 0 0; font-size: 12px; color: var(--text-dim); min-height: 1em; }

.field.gap { margin-top: 20px; }

.inp {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
}

.inp::placeholder { color: var(--text-dim); }
.inp:focus { outline: 2px solid var(--brass); outline-offset: 1px; border-color: transparent; }

.inp.mono {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .3em;
  text-transform: uppercase;
  text-align: center;
}

.row { display: flex; gap: 8px; }
.row .inp { flex: 1; min-width: 0; }
.row .btn { flex: none; }

.code-big {
  margin: 4px 0 2px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 34px;
  letter-spacing: .24em;
  text-align: center;
  text-indent: .24em;
  color: var(--brass-lit);
}

.tables {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 168px;
  overflow-y: auto;
}

.tables li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px 9px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  font-size: 13px;
}

.tables li.muted { color: var(--text-dim); border-style: dashed; background: transparent; }
.tables b { font-weight: 500; letter-spacing: .16em; color: var(--brass-lit); }
.tables span { color: var(--text-dim); margin-right: auto; }
.tables .btn { padding: 6px 13px; font-size: 12px; }
.tables .dim { color: var(--text-dim); margin-right: 0; font-variant-numeric: tabular-nums; }

/* ---------- профиль: главный экран ---------- */

.home .me { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }

.me-ava {
  flex: none;
  width: 76px;
  height: 76px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  overflow: hidden;
  background: var(--panel-2);
  box-shadow: 0 0 0 2px #1A120B, 0 0 0 3.5px rgba(200, 162, 74, .6), 0 10px 22px rgba(0, 0, 0, .6);
  cursor: pointer;
}

.me-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }

.me-who { min-width: 0; }

.home .me-who h1 {
  margin: 0;
  font-size: 24px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rank { font-size: 12px; color: var(--text-dim); }
.rank b { color: var(--brass-lit); font-weight: 500; letter-spacing: .05em; }

.about {
  display: block;
  margin-top: 5px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text);
  font: italic 13px/1.35 "IBM Plex Sans", system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
}

.about.empty { color: var(--text-dim); font-style: normal; text-decoration: underline dotted; text-underline-offset: 3px; }

.play { display: grid; gap: 8px; margin-bottom: 18px; }
.play .btn { padding: 13px 10px; font-size: 14px; border-radius: var(--radius); }
.play-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.linkish {
  justify-self: center;
  border: 0;
  background: none;
  padding: 2px 4px;
  color: var(--text-dim);
  font-size: 12px;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

.stats div {
  padding: 8px 4px 7px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  text-align: center;
  line-height: 1.2;
}

.stats b { display: block; font: 500 17px "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.stats span { font-size: 10px; color: var(--text-dim); }

/* наколки: полученные — латунь на тёмном дереве, ещё не полученные — пунктиром */
.badges { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

.badge {
  display: grid;
  justify-items: center;
  gap: 5px;
  text-align: center;
  font-size: 9.5px;
  line-height: 1.15;
  color: var(--text-dim);
}

.badge i {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px dashed rgba(200, 162, 74, .3);
  color: rgba(200, 162, 74, .32);
  font: normal 22px Forum, Georgia, "Apple Symbols", serif;
}

.badge.got { color: var(--text); }

.badge.got i {
  border: 0;
  background: radial-gradient(circle at 35% 30%, #5A3B22, #1E120A);
  color: var(--brass-lit);
  box-shadow: 0 0 0 1.5px var(--brass), 0 6px 14px rgba(0, 0, 0, .5);
  text-shadow: 0 1px 0 rgba(0, 0, 0, .6);
}

.tables li.tap { cursor: pointer; }
.tables b.won { color: var(--brass-lit); }
.tables b.lost { color: var(--text-dim); }

.h2h { display: flex; align-items: baseline; gap: 12px; }
.h2h b { font-size: 30px; font-weight: 500; color: var(--brass-lit); }
.h2h span { color: var(--text-dim); font-size: 13px; }

/* выбор лица */
.looks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; }

.look-pick {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}

.look-pick img, .look-pick i {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  object-fit: cover;
  display: grid;
  place-items: center;
  font: normal 28px Forum, Georgia, serif;
  color: var(--brass);
  border: 1px dashed rgba(200, 162, 74, .4);
  box-shadow: 0 0 0 2px transparent;
  transition: box-shadow .2s;
}

.look-pick img { border: 0; }
.look-pick[aria-pressed="true"] img, .look-pick[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--brass-lit); }
.look-pick[aria-pressed="true"] { color: var(--text); }

.bro {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  color: #14100A;
  font-style: normal;

  }

  /* Кто садится. acc — аккаунт Telegram, если он известен.

    who = who && typeof who === 'object' ? who : {};
    var photo = clean(acc && acc.photo ? acc.photo : who.photo, 400);
    var look = who.look && typeof who.look === 'object' ? who.look : {};
    return {
      id: clean(who.id, 40) || 'p' + code6().toLowerCase(),
      name: clean(acc && acc.name ? acc.name : who.name, 24) || 'Игрок',
      photo: /^https:\/\//.test(photo) ? photo : '',
      acc: acc ? acc.id : null,
      look: {
        pic: /^(tg|photo|medal)$/.test(look.pic) ? look.pic : 'tg',
        medal: /^[a-z]{2,12}$/.test(look.medal) ? look.medal : 'star'

  /* ---------- стол ---------- */

  function freshTable(code, opts, now) {
    return {
      v: 2, seq: 1, code: code, status: 'open', createdAt: now, updatedAt: now,
      opts: {
        timer: !!(opts && opts.timer),
        to: Math.max(0, Math.min(21, Math.floor(Number(opts && opts.to) || 0)))
      },
      seats: { w: null, b: null },
      state: N.create(),
      tally: { w: 0, b: 0 },
      toss: null, gid: null, game: 0,
      offer: null, declined: 0,

    t.seats.b = t.seats.b || null;
    t.tally = t.tally || { w: 0, b: 0 };
    t.tally.w = t.tally.w || 0;
    t.tally.b = t.tally.b || 0;
    t.late = t.late || { w: 0, b: 0 };
    t.late.w = t.late.w || 0;
    t.late.b = t.late.b || 0;
    t.six = t.six || { w: 0, b: 0 };
    t.six.w = t.six.w || 0;
    t.six.b = t.six.b || 0;

    t.opts.timer = !!t.opts.timer;
    t.opts.to = t.opts.to || 0;

    t.declined = t.declined || 0;
    t.deadline = t.deadline || 0;

    st.points = st.points || [];
    for (var i = 0; i < 24; i++) st.points[i] = st.points[i] || 0;
    st.off = st.off || { w: 0, b: 0 };
    st.off.w = st.off.w || 0;
    st.off.b = st.off.b || 0;
    st.roll = st.roll || [];
    st.dice = st.dice || [];
    st.moves = st.moves || [];

    st.turnNo.w = st.turnNo.w || 0;

    t.toss = { a: a, b: b, n: now, turn: st.turn };
    t.state = st;

      mars: why === 'off' && t.state.off[loser] === 0,

    t.offer = null;

      by: by, auto: !!auto,
      moves: moves.map(function (m) { return { from: m.from, to: m.to, die: m.die }; })
    };
    t.state = cur;
    if (cur.winner) { endGame(t, cur.winner, 'off', now); return; }
    N.endTurn(cur);
    N.setRoll(cur, die(), die());
    countSix(t, cur);
    t.deadline = t.opts.timer ? now + LIMITS.move : 0;
  }

    return t.status === 'live' && !!t.deadline && !t.state.winner && now >= t.deadline + LIMITS.grace;
  }

    if (!overdue(t, now)) return false;
    var p = t.state.turn;
    t.late[p] += 1;
    if (t.late[p] >= LATE_MAX) {
      t.last = { by: p, moves: [], auto: true };
      endGame(t, N.opp(p), 'time', now);
      return true;
    }
    var path = AI.choose(N.clone(t.state), 'normal');
    var cur = N.clone(t.state);
    path.forEach(function (m) { N.applyTo(cur, m); });
    advance(t, cur, p, path, true, now);

  }

    if (!Array.isArray(list) || list.length > 4) return null;

     или причину отказа. Номер стола (seq) поднимает тот, кто пишет. */

    /* Ход целиком. Номер хода (game + ply) защищает от повтора: если ответ
       потерялся и ход прислали ещё раз, второй раз он не пройдёт. */

      if (!moves) return 'bad_moves';

      if (Number(body.game) !== t.game || Number(body.ply) !== st.turnNo[p]) return 'stale';
      var cur = play(st, moves);
      if (typeof cur === 'string') return cur;

      return null;
    },

    /* Предложить переиграть — только посреди партии */

      if (t.status !== 'live' || t.state.winner) return 'stale';
      if (t.offer) return t.offer.by === p ? null : 'busy';
      t.offer = { by: p, ts: now };

    },

    answer: function (t, p, body, now) {
      if (!t.offer || t.offer.by === p) return 'stale';
      if (body.yes) startGame(t, now);            /* неоконченная партия в счёт не идёт */
      else { t.offer = null; t.declined = now; }

    },

    /* Следующая партия после окончания. Жмут оба — начнётся одна. */
    again: function (t, p, body, now) {
      if (t.status !== 'live') return 'stale';
      if (!t.state.winner) return t.end ? null : 'stale';
      if (t.match && t.match.over) { t.tally = { w: 0, b: 0 }; t.match = null; }
      startGame(t, now);

    }
  };

  /* ---------- итог партии в профиль ---------- */

  function blankUser(who, now) {
    return {
      id: who.id, name: who.name || 'Игрок', photo: who.photo || '', about: '',
      w: 0, l: 0, mars: 0, marsLost: 0,
      streak: 0, best: 0,
      foes: {}, recent: [], badges: {},
      created: now, updated: now

  }

  /* Вписать исход партии в профиль игрока за местом p.
     Возвращает false, если эта партия там уже записана. */

    var e = t.end, me = t.seats[p], foe = t.seats[N.opp(p)];

    u.w = u.w || 0; u.l = u.l || 0; u.mars = u.mars || 0; u.marsLost = u.marsLost || 0;
    if (win) { u.w += 1; if (e.mars) u.mars += 1; }
    else { u.l += 1; if (e.mars) u.marsLost += 1; }
    u.streak = win ? Math.max(0, u.streak || 0) + 1 : Math.min(0, u.streak || 0) - 1;
    if (u.streak > (u.best || 0)) u.best = u.streak;

    var fk = foe.acc || foe.id;
    var f = u.foes[fk] || { name: foe.name, w: 0, l: 0 };
    f.name = foe.name || f.name;
    f.acc = foe.acc || null;
    f.photo = foe.photo || f.photo || '';
    if (win) f.w += 1; else f.l += 1;
    f.games = f.w + f.l;
    f.last = now;
    u.foes[fk] = f;

    u.recent.unshift({
      gid: e.gid, at: now, win: win, mars: !!e.mars, why: e.why,
      foe: { id: fk, name: foe.name, acc: foe.acc || null }
    });
    u.recent = u.recent.slice(0, 10);

    function badge(name) { if (!u.badges[name]) u.badges[name] = now; }
    if (win && e.mars) badge('mars1');
    if (u.mars >= 10) badge('mars10');
    if (e.six && e.six[p] >= 3) badge('six3');
    if (win && e.shutout) badge('shutout');
    if (u.w + u.l >= 100) badge('game100');

    if (me.name) u.name = me.name;
    if (me.photo && !u.custom) u.photo = me.photo;
    u.updated = now;
    return true;
  }

  /* Профиль для показа: соперники списком, трое частых — братишки */
  function pub(u) {
    var foes = [], id, f;
    for (id in u.foes || {}) {
      f = u.foes[id];
      foes.push({

        w: f.w || 0, l: f.l || 0, games: f.games || ((f.w || 0) + (f.l || 0)), last: f.last || 0

      w: u.w || 0, l: u.l || 0, mars: u.mars || 0, marsLost: u.marsLost || 0,
      streak: u.streak || 0, best: u.best || 0,
      recent: u.recent || [], badges: u.badges || {},

<script>
/* ============================================================
   Доска: резной орех, костяные вставки, шашки и кости рисуются
   на canvas и раздаются интерфейсу картинками.

   Вся геометрия считается в «альбомных» координатах 1240×820.
   На телефоне доска стоит вертикально: холст поворачивается на
   90°, а надписи, кости и метки рисуются ровно — поэтому ничего
   не читается вбок.
   ============================================================ */
(function (global) {
  'use strict';

  /* Доска лежит горизонтально, телефон — вертикально в руке.
     Ширину делят 12 пунктов и планка, поэтому она и задаёт размер
     шашки: всё лишнее из ширины убрано, лотки для снятых шашек
     переехали в полки на верхнем и нижнем борту. */
  var CD = 66;          /* шашка — единица меры */
  var COL = 68;         /* пункт чуть шире шашки */
  var BAR = 36;         /* средняя планка */
  var FRAME = 14;       /* борт */
  var SHELF = 72;       /* полка для снятых шашек */
  var PTH = 380;        /* длина пункта: 15 шашек влезают, не вылезая в середину */
  var MID = 170;        /* поле между рядами: костям нужно место, чтобы скакать */
  var DD = 88;          /* кость: четыре при дубле должны влезать в половину доски */

  var VW = 2 * FRAME + 12 * COL + BAR;                    /* 880 */
  var VH = 2 * FRAME + 2 * SHELF + 2 * PTH + MID;         /* 810 — доска шире, чем выше */

  var TOPY = FRAME + SHELF;              /* верх верхнего ряда */
  var BOTY = VH - FRAME - SHELF;         /* низ нижнего ряда */

  var C = {
    frameHi: '#5E3A23', frameLo: '#1E110B',
    bed: '#3E2517', bedLo: '#200F07',
    bone: '#D9C39B', boneMid: '#C2A97E', boneLo: '#9C8256',
    felt: '#1D5A53', feltMid: '#154742', feltLo: '#0E332F',

  /* Из координат доски — в координаты экрана. Доска не разворачивается:

  /* Голова белых — верхний правый угол, чёрных — нижний левый.
     Отсюда и раскладка: сверху пункты 11..0 слева направо,

    ctx.restore();

    ctx.strokeStyle = 'rgba(16,7,2,.75)';

      for (i = 0; i < rays; i++) {
        a = i * step + step / 2;
        c.moveTo(Math.cos(a) * r * 0.44, Math.sin(a) * r * 0.44);
        c.lineTo(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86);
      }
      c.stroke();
    }, 1, 0.16);

    [r * 0.30, r * 0.46, r].forEach(function (rr, k) {
      cut(ctx, function (c) {
        c.beginPath();
        c.arc(0, 0, rr, 0, 6.284);
        c.stroke();
      }, 1, k === 2 ? 0.26 : 0.20);
    });

    var g = ctx.createRadialGradient(-r * 0.12, -r * 0.12, 1, 0, 0, r * 0.30);
    g.addColorStop(0, 'rgba(255,224,170,.20)');
    g.addColorStop(1, 'rgba(24,11,4,.45)');
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.28, 0, 6.284);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  /* Восьмиконечная воровская звезда — главный знак на таких досках */
  function thiefStar(ctx, cx, cy, r) {
    var i, a;
    ctx.save();
    ctx.translate(cx, cy);

    /* два квадрата, повёрнутые друг относительно друга */
    [0, Math.PI / 4].forEach(function (turn) {
      cut(ctx, function (c) {
        c.beginPath();
        for (i = 0; i < 4; i++) {
          a = turn + i * Math.PI / 2;
          var x = Math.cos(a) * r, y = Math.sin(a) * r;
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.closePath();
        c.stroke();
      }, 1, 0.30);
    });

    /* лучи от центра к вершинам */
    cut(ctx, function (c) {
      c.beginPath();
      for (i = 0; i < 8; i++) {
        a = i * Math.PI / 4;
        c.moveTo(Math.cos(a) * r * 0.20, Math.sin(a) * r * 0.20);
        c.lineTo(Math.cos(a) * r * 0.97, Math.sin(a) * r * 0.97);
      }
      c.stroke();
    }, 1, 0.22);

    /* грани лучей — чтобы звезда читалась объёмной */
    ctx.save();
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.97, Math.sin(a) * r * 0.97);
      ctx.lineTo(Math.cos(a + Math.PI / 8) * r * 0.42, Math.sin(a + Math.PI / 8) * r * 0.42);
      ctx.lineTo(Math.cos(a - Math.PI / 8) * r * 0.42, Math.sin(a - Math.PI / 8) * r * 0.42);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? 'rgba(255,230,190,.13)' : 'rgba(18,8,2,.34)';
      ctx.fill();
    }
    ctx.restore();

    [r * 0.20, r * 0.42].forEach(function (rr) {
      cut(ctx, function (c) { c.beginPath(); c.arc(0, 0, rr, 0, 6.284); c.stroke(); }, 1, 0.24);
    });

    var g = ctx.createRadialGradient(-r * 0.08, -r * 0.08, 1, 0, 0, r * 0.20);
    g.addColorStop(0, 'rgba(255,224,170,.22)');
    g.addColorStop(1, 'rgba(24,11,4,.5)');
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.19, 0, 6.284);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  /* Ёлочка вдоль борта — самый ходовой резной поясок */
  function chevrons(ctx, x0, y0, x1, y1, size) {
    var len = Math.hypot(x1 - x0, y1 - y0), n = Math.floor(len / (size * 1.5));
    var ang = Math.atan2(y1 - y0, x1 - x0), i, t, x, y;
    for (i = 0; i <= n; i++) {
      t = (i * size * 1.5) / len;
      x = x0 + (x1 - x0) * t;
      y = y0 + (y1 - y0) * t;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      cut(ctx, function (c) {
        c.beginPath();
        c.moveTo(-size * 0.5, -size * 0.55);
        c.lineTo(size * 0.32, 0);
        c.lineTo(-size * 0.5, size * 0.55);
        c.stroke();
      }, 0.8, 0.26);
      ctx.restore();
    }
  }

  /* ---------- части доски ---------- */

  function drawFrame(ctx) {
    var g = ctx.createLinearGradient(0, 0, VW * 0.6, VH);
    g.addColorStop(0, C.frameHi);
    g.addColorStop(0.45, '#3B2114');
    g.addColorStop(1, C.frameLo);
    rrect(ctx, 0, 0, VW, VH, 16);
    ctx.fillStyle = g;
    ctx.fill();
    grain(ctx, 0, 0, VW, VH, 7, 210, 0.12);

    var c = FRAME / 2;
    ctx.save();
    ctx.beginPath();
    rrect(ctx, 0, 0, VW, VH, 16);
    rrect(ctx, FRAME, FRAME, VW - 2 * FRAME, VH - 2 * FRAME, 5);
    ctx.clip('evenodd');
    chevrons(ctx, 34, c, VW - 34, c, 10);
    chevrons(ctx, VW - 34, VH - c, 34, VH - c, 10);
    chevrons(ctx, c, VH - 34, c, 34, 10);
    chevrons(ctx, VW - c, 34, VW - c, VH - 34, 10);
    ctx.restore();

    [[c + 1, c + 1], [VW - c - 1, c + 1], [c + 1, VH - c - 1], [VW - c - 1, VH - c - 1]]
      .forEach(function (p) { thiefStar(ctx, p[0], p[1], 8); });

    ctx.strokeStyle = 'rgba(200,162,74,.42)';
    ctx.lineWidth = 1.1;
    rrect(ctx, 2.5, 2.5, VW - 5, VH - 5, 14); ctx.stroke();
    rrect(ctx, FRAME - 2, FRAME - 2, VW - 2 * FRAME + 4, VH - 2 * FRAME + 4, 6); ctx.stroke();
  }

  function drawBed(ctx) {
    var x = FRAME, y = FRAME, w = VW - 2 * FRAME, h = VH - 2 * FRAME;
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, C.bed);
    g.addColorStop(0.5, '#361F12');
    g.addColorStop(1, C.bedLo);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    grain(ctx, x, y, w, h, 21, 190, 0.10);

    var s = ctx.createLinearGradient(x, 0, x + 34, 0);
    s.addColorStop(0, 'rgba(0,0,0,.6)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = s; ctx.fillRect(x, y, 34, h);
    s = ctx.createLinearGradient(x + w, 0, x + w - 34, 0);
    s.addColorStop(0, 'rgba(0,0,0,.6)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = s; ctx.fillRect(x + w - 34, y, 34, h);
  }

  /* Полка для снятых шашек — утопленный жёлоб вдоль борта */
  function drawShelf(ctx, player) {
    var b = trayBox(player);
    rrect(ctx, b.x, b.y, b.w, b.h, 8);
    ctx.fillStyle = '#190D06';
    ctx.fill();
    ctx.save();
    ctx.clip();
    grain(ctx, b.x, b.y, b.w, b.h, player === 'w' ? 33 : 44, 40, 0.08);
    var s = ctx.createLinearGradient(0, b.y, 0, b.y + 18);
    s.addColorStop(0, 'rgba(0,0,0,.8)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = s; ctx.fillRect(b.x, b.y, b.w, 18);
    ctx.restore();
    ctx.strokeStyle = 'rgba(200,162,74,.28)';
    ctx.lineWidth = 1;
    rrect(ctx, b.x, b.y, b.w, b.h, 8); ctx.stroke();
    thiefStar(ctx, b.x + b.w / 2, b.y + b.h / 2, 26);
  }

  function drawBar(ctx) {
    var x = colX(6) - BAR, y = TOPY - 6, h = BOTY - TOPY + 12;
    var g = ctx.createLinearGradient(x, 0, x + BAR, 0);
    g.addColorStop(0, '#150B05');
    g.addColorStop(0.5, '#4E2D1B');
    g.addColorStop(1, '#150B05');
    rrect(ctx, x, y, BAR, h, 6);
    ctx.fillStyle = g; ctx.fill();
    ctx.save();
    ctx.clip();
    grain(ctx, x, y, BAR, h, 55, 30, 0.12);
    chevrons(ctx, x + BAR / 2, y + 22, x + BAR / 2, y + h - 22, 10);
    ctx.restore();
    ctx.strokeStyle = 'rgba(200,162,74,.26)';
    ctx.lineWidth = 1;
    rrect(ctx, x, y, BAR, h, 6); ctx.stroke();
  }

  function drawPoints(ctx) {
    var i, g, light, baseY, apexY, grd;
    for (i = 0; i < 24; i++) {
      g = geom(i);
      light = ((g.j + (g.top ? 0 : 1)) % 2) === 0;
      baseY = g.top ? TOPY : BOTY;
      apexY = g.top ? TOPY + PTH : BOTY - PTH;
      ctx.beginPath();
      ctx.moveTo(g.x + 1, baseY);
      ctx.lineTo(g.x + COL - 1, baseY);
      ctx.lineTo(g.x + COL / 2, apexY);
      ctx.closePath();
      grd = ctx.createLinearGradient(0, baseY, 0, apexY);
      if (light) {
        grd.addColorStop(0, C.bone); grd.addColorStop(0.55, C.boneMid); grd.addColorStop(1, C.boneLo);
      } else {
        grd.addColorStop(0, C.felt); grd.addColorStop(0.55, C.feltMid); grd.addColorStop(1, C.feltLo);
      }
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.save();
      ctx.clip();
      grain(ctx, g.x, Math.min(baseY, apexY), COL, PTH, 100 + i, 12, light ? 0.07 : 0.05);
      ctx.restore();
      ctx.strokeStyle = light ? 'rgba(70,45,18,.45)' : 'rgba(0,0,0,.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    /* золотой герб в поле между рядами, по одному на половину */
    var my = TOPY + PTH + MID / 2;
    if (gerb) {
      drawGerb(ctx, (colX(0) + colX(5) + COL) / 2, my, MID * 0.96);
      drawGerb(ctx, (colX(6) + colX(11) + COL) / 2, my, MID * 0.96);
    } else {
      thiefStar(ctx, (colX(0) + colX(5) + COL) / 2, my, 52);
      thiefStar(ctx, (colX(6) + colX(11) + COL) / 2, my, 52);
    }

    /* латунная нить вдоль домов */
    ctx.strokeStyle = 'rgba(200,162,74,.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(colX(0), TOPY - 3); ctx.lineTo(colX(5) + COL, TOPY - 3);
    ctx.moveTo(colX(6), BOTY + 3); ctx.lineTo(colX(11) + COL, BOTY + 3);
    ctx.stroke();
  }

  function drawLight(ctx) {
    var g = ctx.createLinearGradient(0, 0, VW * 0.75, VH);
    g.addColorStop(0, 'rgba(255,238,208,.10)');
    g.addColorStop(0.35, 'rgba(255,238,208,.02)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    rrect(ctx, 0, 0, VW, VH, 16);
    ctx.fillStyle = g; ctx.fill();

    var v = ctx.createRadialGradient(VW / 2, VH * 0.44, VH * 0.30, VW / 2, VH * 0.5, VH * 0.9);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.46)');
    rrect(ctx, 0, 0, VW, VH, 16);
    ctx.fillStyle = v; ctx.fill();
  }

  function render(canvas) {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    /* честная плотность экрана: на айфоне она 3, и обрезать её нельзя — мылит */
    var dpr = Math.min(global.devicePixelRatio || 1, 3);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');
    var k = w * dpr / VW;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    drawFrame(ctx);
    drawBed(ctx);
    drawShelf(ctx, 'w');
    drawShelf(ctx, 'b');
    drawPoints(ctx);
    drawBar(ctx);
    drawLight(ctx);
  }

  /* ---------- герб ---------- */

  var gerb = null;

  /* Официальный герб — общественное достояние (исходник — assets/gerb.svg).
     В gerb.png он уже перекрашен в золото: из герба взято только светлое —
     орёл без красного щита, сверху светлее, снизу темнее. Так он ложится
     в дерево инкрустацией, а грузится в шесть раз легче исходника. */
  function loadArt(done) {
    var im = new global.Image();
    im.onload = function () {
      gerb = im;
      if (done) done();
    };
    im.onerror = function () { if (done) done(); };
    im.src = 'assets/gerb.png';
  }

  /* Инкрустация: тёмный отпечаток снизу, золото сверху, блик по краю */
  function drawGerb(ctx, cx, cy, h) {
    if (!gerb) return;
    var w = h * gerb.width / gerb.height;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.filter = 'blur(1.5px) brightness(0)';
    ctx.drawImage(gerb, cx - w / 2 + 2.5, cy - h / 2 + 3, w, h);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.drawImage(gerb, cx - w / 2, cy - h / 2, w, h);
    ctx.globalAlpha = 0.30;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(gerb, cx - w / 2 - 1, cy - h / 2 - 1.5, w, h);
    ctx.restore();
  }

  /* ---------- шашки и кости картинками ---------- */

  var cache = {};

  function face(px, paint) {
    var cv = global.document.createElement('canvas');
    cv.width = cv.height = px;
    paint(cv.getContext('2d'), px);
    return cv.toDataURL('image/png');
  }

  /* Точёная шашка: фаска, две канавки и резная звезда посередине */
  function checker(side, px) {
    var key = 'man' + side + px;
    if (cache[key]) return cache[key];
    cache[key] = face(px, function (ctx, s) {
      var r = s / 2, i, a;
      var bone = side === 'w';
      ctx.save();
      ctx.beginPath();
      ctx.arc(r, r, r - 1, 0, 6.284);
      ctx.clip();

      var g = ctx.createRadialGradient(r * 0.68, r * 0.6, r * 0.1, r, r, r);
      if (bone) {
        g.addColorStop(0, '#FFFAEC'); g.addColorStop(0.42, '#F2E1BB');
        g.addColorStop(0.78, '#D6BA8A'); g.addColorStop(1, '#9A7C4B');
      } else {
        g.addColorStop(0, '#6A5C4B'); g.addColorStop(0.42, '#42372C');
        g.addColorStop(0.78, '#241C15'); g.addColorStop(1, '#0C0906');
      }
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);

      var gr = rnd32(bone ? 5 : 9);
      ctx.globalAlpha = bone ? 0.20 : 0.26;
      for (i = 0; i < 46; i++) {
        a = gr() * 6.284;
        var rr = r * (0.2 + gr() * 0.78);
        ctx.beginPath();
        ctx.arc(r, r, rr, a, a + 0.35 + gr() * 0.7);
        ctx.strokeStyle = gr() > 0.5 ? 'rgba(255,240,210,.5)' : 'rgba(30,18,6,.5)';
        ctx.lineWidth = 0.4 + gr() * 1.1;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      [0.80, 0.62].forEach(function (f) {
        ctx.beginPath(); ctx.arc(r, r - s * 0.008, r * f, 0, 6.284);
        ctx.strokeStyle = bone ? 'rgba(255,250,235,.55)' : 'rgba(210,180,120,.20)';
        ctx.lineWidth = s * 0.018; ctx.stroke();
        ctx.beginPath(); ctx.arc(r, r + s * 0.008, r * f, 0, 6.284);
        ctx.strokeStyle = 'rgba(40,24,8,.45)';
        ctx.lineWidth = s * 0.018; ctx.stroke();
      });

      /* насечка по ободу — след резца на токарном станке */
      ctx.save();
      ctx.translate(r, r);
      for (i = 0; i < 48; i++) {
        a = i * Math.PI / 24;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.87, Math.sin(a) * r * 0.87);
        ctx.lineTo(Math.cos(a) * r * 0.955, Math.sin(a) * r * 0.955);
        ctx.strokeStyle = 'rgba(40,24,8,.30)';
        ctx.lineWidth = s * 0.016;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.87, Math.sin(a) * r * 0.87 - s * 0.01);
        ctx.lineTo(Math.cos(a) * r * 0.955, Math.sin(a) * r * 0.955 - s * 0.01);
        ctx.strokeStyle = bone ? 'rgba(255,250,232,.34)' : 'rgba(206,174,116,.16)';
        ctx.lineWidth = s * 0.012;
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(r, r);
      for (i = 0; i < 8; i++) {
        a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.12, Math.sin(a) * r * 0.12);
        ctx.lineTo(Math.cos(a) * r * 0.44, Math.sin(a) * r * 0.44);
        ctx.strokeStyle = 'rgba(40,24,8,.42)';
        ctx.lineWidth = s * 0.022;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.12, Math.sin(a) * r * 0.12 - s * 0.012);
        ctx.lineTo(Math.cos(a) * r * 0.44, Math.sin(a) * r * 0.44 - s * 0.012);
        ctx.strokeStyle = bone ? 'rgba(255,248,228,.5)' : 'rgba(200,168,110,.22)';
        ctx.lineWidth = s * 0.016;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.12, 0, 6.284);
      ctx.fillStyle = bone ? 'rgba(120,92,48,.35)' : 'rgba(200,162,74,.3)';
      ctx.fill();
      ctx.restore();

      var sh = ctx.createRadialGradient(r, r, r * 0.72, r, r, r);
      sh.addColorStop(0, 'rgba(0,0,0,0)');
      sh.addColorStop(1, bone ? 'rgba(60,40,14,.5)' : 'rgba(0,0,0,.65)');
      ctx.fillStyle = sh;
      ctx.fillRect(0, 0, s, s);

      var hi = ctx.createLinearGradient(0, 0, s * 0.7, s * 0.8);
      hi.addColorStop(0, bone ? 'rgba(255,255,245,.5)' : 'rgba(255,236,200,.16)');
      hi.addColorStop(0.55, 'rgba(255,255,245,0)');
      ctx.fillStyle = hi;
      ctx.fillRect(0, 0, s, s);
      ctx.restore();
    });
    return cache[key];
  }

  var PIPS = {
    1: [[50, 50]],
    2: [[27, 27], [73, 73]],
    3: [[27, 27], [50, 50], [73, 73]],
    4: [[27, 27], [73, 27], [27, 73], [73, 73]],
    5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]],
    6: [[27, 25], [73, 25], [27, 50], [73, 50], [27, 75], [73, 75]]
  };

  /* Чёрный камень со светящимися точками. Точка — не дырка, а огонёк:
     сначала ореол вокруг, потом тело, потом добела горячая середина. */
  function die(side, value, px) {
    var key = 'die' + side + value + px;
    if (cache[key]) return cache[key];
    cache[key] = face(px, function (ctx, s) {
      var i, gr = rnd32(value * 17 + 5);
      ctx.save();
      rrect(ctx, 1, 1, s - 2, s - 2, s * 0.17);
      ctx.clip();

      var g = ctx.createLinearGradient(0, 0, s * 0.8, s);
      g.addColorStop(0, '#2A2A2E');
      g.addColorStop(0.45, '#161618');
      g.addColorStop(1, '#070708');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);

      /* камень: редкий крап и матовые разводы */
      for (i = 0; i < Math.round(s * 3); i++) {
        var x = gr() * s, y = gr() * s, r = s * (0.003 + gr() * 0.012);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 6.284);
        ctx.fillStyle = gr() > 0.5
          ? 'rgba(190,195,205,' + (0.05 + gr() * 0.16).toFixed(2) + ')'
          : 'rgba(0,0,0,' + (0.2 + gr() * 0.4).toFixed(2) + ')';
        ctx.fill();
      }

      PIPS[value].forEach(function (p) {
        var cx = p[0] / 100 * s, cy = p[1] / 100 * s, rr = s * 0.082;

        /* ореол */
        var halo = ctx.createRadialGradient(cx, cy, rr * 0.4, cx, cy, rr * 3.1);
        halo.addColorStop(0, 'rgba(255,196,92,.55)');
        halo.addColorStop(0.45, 'rgba(255,170,60,.18)');
        halo.addColorStop(1, 'rgba(255,150,40,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, rr * 3.1, 0, 6.284);
        ctx.fillStyle = halo;
        ctx.fill();

        /* тело огонька */
        var core = ctx.createRadialGradient(cx - rr * 0.2, cy - rr * 0.2, rr * 0.08, cx, cy, rr);
        core.addColorStop(0, '#FFFDF2');
        core.addColorStop(0.42, '#FFDE9A');
        core.addColorStop(0.82, '#E8A63A');
        core.addColorStop(1, '#9A5F12');
        ctx.beginPath();
        ctx.arc(cx, cy, rr, 0, 6.284);
        ctx.fillStyle = core;
        ctx.fill();

        /* добела горячая середина */
        ctx.beginPath();
        ctx.arc(cx - rr * 0.16, cy - rr * 0.18, rr * 0.34, 0, 6.284);
        ctx.fillStyle = 'rgba(255,255,250,.92)';
        ctx.fill();
      });

      /* полировка по верхней грани */
      var hi = ctx.createLinearGradient(0, 0, s * 0.5, s * 0.55);
      hi.addColorStop(0, 'rgba(226,232,244,.22)');
      hi.addColorStop(0.6, 'rgba(226,232,244,0)');
      ctx.fillStyle = hi;

    var set = mode === 'soft' ? SOFT : HARD;
    var list = set[key];
    if (!list || !list.length) return null;
    if (list.length === 1) return list[0];
    var i, guard = 0;
    do { i = Math.floor(Math.random() * list.length); } while (list[i] === last[key] && guard++ < 6);
    last[key] = list[i];
    return list[i];
  }

  /* Насколько часто событие вообще заслуживает реплики */
  var CHANCE = {
    roll: 1, six: 1, double: 0.32, worst: 0.4, stuck: 1, off: 0.2,
    head: 1, home: 1, almost: 1, slow: 1, hint: 0.6, undo: 0.5,
    start: 0.5, win: 1, mars: 1
  };

  function line(mode, event, side, force) {
    if (mode === 'off') return null;
    var now = Date.now();
    if (!force && now < quiet) return null;
    if (!force && Math.random() > (CHANCE[event] || 0.3)) return null;
    var text = pick(mode, event + '.' + side);
    if (!text) return null;
    quiet = now + 5000;
    return text;
  }

  function reset() { quiet = 0; last = {}; }

  global.NardyBanter = { line: line, reset: reset };
})(window);
</script>
<script>
/* ============================================================
   Статистика на самом телефоне. У игроков из Telegram партии
   с людьми ещё и в общей базе (js/fb.js) — это главный счёт;
   здесь то, что есть всегда: игры с компьютером, последние
   партии и счёт гостя. Копим сводку, а не список всех партий —
   она не растёт со временем.
   ============================================================ */
(function (global) {
  'use strict';

  var KEY = 'nardy.stats';
  var data = null;

  function side() { return { w: 0, l: 0, mars: 0, marsLost: 0 }; }

  function blank() {
    return { v: 1, total: side(), foes: {}, kinds: { net: side(), ai: side() }, recent: [], streak: 0, best: 0, badges: {} };
  }

  function load() {
    if (data) return data;
    try {
      data = JSON.parse(localStorage.getItem(KEY) || 'null');
    } catch (e) { data = null; }
    if (!data || data.v !== 1 || !data.foes) data = blank();
    /* старые записи: счёт по видам восстанавливаем по соперникам */
    if (!data.kinds) {
      data.kinds = { net: side(), ai: side() };
      for (var id in data.foes) {
        var f = data.foes[id], k = data.kinds[f.kind === 'net' ? 'net' : 'ai'];
        k.w += f.w; k.l += f.l;
      }
    }
    data.recent = data.recent || [];
    data.badges = data.badges || {};
    data.streak = data.streak || 0;
    data.best = data.best || 0;
    return data;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  /* foe: {id, name, kind}, kind — 'net' | 'ai'.
     extra: {six — сколько раз я выбросил 6-6 за партию, shutout — матч всухую} */
  function record(foe, win, mars, extra) {
    load();
    extra = extra || {};
    var now = Date.now();
    [data.total, data.kinds[foe.kind === 'net' ? 'net' : 'ai']].forEach(function (t) {
      if (win) { t.w++; if (mars) t.mars++; }
      else { t.l++; if (mars) t.marsLost++; }
    });

    var id = (foe.kind === 'net' ? 'n:' : foe.kind === 'ai' ? 'a:' : 'd:') + (foe.id || foe.name || '?');
    var f = data.foes[id];
    if (!f) f = data.foes[id] = { id: id, name: foe.name || 'Соперник', kind: foe.kind, w: 0, l: 0 };
    f.name = foe.name || f.name;
    f.kind = foe.kind;
    f.acc = foe.acc || f.acc || null;
    if (win) f.w++; else f.l++;
    f.last = now;

    data.recent.unshift({ at: now, win: !!win, mars: !!mars, kind: foe.kind, name: foe.name || 'Соперник', acc: foe.acc || null });
    data.recent = data.recent.slice(0, 10);

    /* серии и наколки — только за людей */
    if (foe.kind === 'net') {
      data.streak = win ? Math.max(0, data.streak) + 1 : Math.min(0, data.streak) - 1;
      if (data.streak > data.best) data.best = data.streak;
      var k = data.kinds.net;
      if (win && mars) mark('mars1', now);
      if (k.mars >= 10) mark('mars10', now);
      if ((extra.six || 0) >= 3) mark('six3', now);
      if (win && extra.shutout) mark('shutout', now);
      if (k.w + k.l >= 100) mark('game100', now);
    }
    save();
  }

  function mark(name, now) { if (!data.badges[name]) data.badges[name] = now; }

  function summary() {
    load();
    var list = [], id;
    for (id in data.foes) {
      var f = data.foes[id];
      list.push({ id: id, acc: f.acc || null, name: f.name, kind: f.kind, w: f.w, l: f.l, games: f.w + f.l, last: f.last || 0 });
    }
    /* братишки — живые соперники, с кем сыграно больше всего,
       и не всякий встречный: нужно сыграть хотя бы три партии */
    var live = list.filter(function (f) { return f.kind === 'net'; })
      .sort(function (a, b) { return b.games - a.games || b.last - a.last; });
    var bros = {};
    live.slice(0, 3).forEach(function (f) { if (f.games >= 3) bros[f.id] = true; });
    list.sort(function (a, b) { return b.games - a.games || b.last - a.last; });
    return {
      total: data.total, people: data.kinds.net, ai: data.kinds.ai,
      foes: list, bros: bros, recent: data.recent,
      streak: data.streak, best: data.best, badges: data.badges
    };
  }

  function reset() { data = blank(); save(); }

  global.NardyStats = { record: record, summary: summary, reset: reset };
})(window);
</script>
<script>
/* ============================================================
   Профиль: звание, наколки, медальон, фото, «о себе».

   Звание и наколки даются только за игру с людьми — компьютер
   считается отдельно, иначе звание можно было бы набить на новичке.
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- звание: по числу побед над людьми ---------- */

  /* of — то же звание в родительном падеже: «ещё 3 победы до Бродяги» */
  var RANKS = [
    { name: 'Шнырь', of: 'Шныря', from: 0 },
    { name: 'Фраер', of: 'Фраера', from: 5 },
    { name: 'Бродяга', of: 'Бродяги', from: 15 },
    { name: 'Блатной', of: 'Блатного', from: 40 },
    { name: 'Смотрящий', of: 'Смотрящего', from: 100 },
    { name: 'Вор в законе', of: 'Вора в законе', from: 250 }
  ];

  function rank(wins) {
    var i = 0;
    while (i + 1 < RANKS.length && wins >= RANKS[i + 1].from) i++;
    var next = RANKS[i + 1] || null;
    return {
      name: RANKS[i].name,
      level: i,
      next: next ? next.of : null,
      need: next ? next.from - wins : 0
    };
  }

  /* ---------- наколки ---------- */

  var BADGES = [
    { id: 'mars1', name: 'Первый марс', hint: 'выиграть, пока соперник не снял ни одной шашки', mark: '✶' },
    { id: 'mars10', name: 'Десять марсов', hint: 'поставить десять марсов', mark: 'Ⅹ' },
    { id: 'six3', name: 'Три шеш-беша', hint: 'выбросить 6-6 трижды за одну партию', mark: '⚅' },
    { id: 'shutout', name: 'Всухую', hint: 'выиграть матч, не отдав ни одной партии', mark: '∅' },
    { id: 'game100', name: 'Сотая партия', hint: 'сыграть сто партий с людьми', mark: 'Ⅽ' }
  ];

  /* ---------- резные медальоны вместо фото ---------- */

  var MEDALS = [
    { id: 'star', mark: '✵' },
    { id: 'crown', mark: '♛' },
    { id: 'spade', mark: '♠' },
    { id: 'cross', mark: '✠' },
    { id: 'moon', mark: '☾' },
    { id: 'dice', mark: '⚄' }
  ];
  var medalCache = {};

  function medalOf(id) {
    for (var i = 0; i < MEDALS.length; i++) if (MEDALS[i].id === id) return MEDALS[i];
    return null;
  }

  /* Медальон рисуем сами: тёмный орех, латунный обод, знак золотом
     с тенью — будто вырезан в дереве и залит металлом. */
  function medal(id, size) {
    var m = medalOf(id);
    if (!m) return '';
    size = size || 160;
    var key = id + ':' + size;
    if (medalCache[key]) return medalCache[key];
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d'), r = size / 2;

    var wood = g.createRadialGradient(r * .7, r * .6, r * .1, r, r, r);
    wood.addColorStop(0, '#5A3B22');
    wood.addColorStop(.7, '#3A2414');
    wood.addColorStop(1, '#1E120A');
    g.fillStyle = wood;
    g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.fill();

    /* волокна дерева */
    g.save();
    g.beginPath(); g.arc(r, r, r * .96, 0, Math.PI * 2); g.clip();
    g.globalAlpha = .13;
    g.strokeStyle = '#0D0704';
    for (var i = 0; i < 14; i++) {
      g.lineWidth = 1 + (i % 3);
      g.beginPath();
      var y = size * (i / 14) + (i % 2 ? 3 : -2);
      g.moveTo(0, y);
      g.bezierCurveTo(r * .6, y - 6, r * 1.3, y + 7, size, y - 2);
      g.stroke();
    }
    g.restore();

    /* латунный обод и резная канавка */
    var rim = g.createLinearGradient(0, 0, size, size);
    rim.addColorStop(0, '#F1D98F');
    rim.addColorStop(.5, '#A8822E');
    rim.addColorStop(1, '#E5C97F');
    g.lineWidth = size * .06;
    g.strokeStyle = rim;
    g.beginPath(); g.arc(r, r, r - size * .03, 0, Math.PI * 2); g.stroke();
    g.lineWidth = size * .012;
    g.strokeStyle = 'rgba(10,6,3,.7)';
    g.beginPath(); g.arc(r, r, r * .8, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(229,201,127,.35)';
    g.beginPath(); g.arc(r, r, r * .8 + size * .012, 0, Math.PI * 2); g.stroke();

    /* знак: тёмная выемка, поверх золото */
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = Math.round(size * .5) + 'px Forum, Georgia, "Apple Symbols", serif';
    g.fillStyle = 'rgba(8,5,2,.85)';
    g.fillText(m.mark, r + size * .012, r + size * .03);
    var gold = g.createLinearGradient(0, r - size * .25, 0, r + size * .25);
    gold.addColorStop(0, '#FFF0C0');
    gold.addColorStop(.45, '#E5C97F');
    gold.addColorStop(1, '#9A7426');
    g.fillStyle = gold;
    g.fillText(m.mark, r, r + size * .01);

    medalCache[key] = c.toDataURL('image/png');
    return medalCache[key];
  }

  /* ---------- своё фото: ужимаем до 160×160, чтобы база не пухла ---------- */

  function shrink(file) {
    return new Promise(function (ok, no) {
      if (!file || !/^image\//.test(file.type)) { no(new Error('не картинка')); return; }
      var rd = new FileReader();
      rd.onerror = function () { no(new Error('не прочиталось')); };
      rd.onload = function () {
        var img = new Image();
        img.onerror = function () { no(new Error('не картинка')); };
        img.onload = function () {
          var S = 160, c = document.createElement('canvas');
          c.width = c.height = S;
          var g = c.getContext('2d');
          var side = Math.min(img.width, img.height);
          var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
          g.drawImage(img, sx, sy, side, side, 0, 0, S, S);
          ok(c.toDataURL('image/jpeg', .82));
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  /* ---------- как игрок выглядит: фото, медальон, «о себе» ----------
     Хранится на телефоне; у игроков из Telegram ещё и в общей базе. */

  var LOOK = 'nardy.look';

  function look() {
    var v = null;
    try { v = JSON.parse(localStorage.getItem(LOOK) || 'null'); } catch (e) { v = null; }
    v = v || {};
    return { pic: v.pic || 'tg', medal: v.medal || 'star', photo: v.photo || '', about: v.about || '' };
  }

  function setLook(patch) {
    var v = look(), k;
    for (k in patch) v[k] = patch[k];
    try { localStorage.setItem(LOOK, JSON.stringify(v)); } catch (e) {}
    return v;
  }

  /* Картинка игрока по его настройкам: своё фото, медальон или фото из Telegram */
  function picture(v, tgPhoto, size) {
    if (v.pic === 'photo' && v.photo) return v.photo;
    if (v.pic === 'medal') return medal(v.medal, size);
    if (tgPhoto) return tgPhoto;
    return medal(v.medal || 'star', size);
  }

  global.NardyProfile = {
    RANKS: RANKS, BADGES: BADGES, MEDALS: MEDALS,
    rank: rank, medal: medal, shrink: shrink,
    look: look, setLook: setLook, picture: picture
  };
})(window);
</script>
<script>
/* ============================================================
   Аккаунт. Игра открыта в Telegram — профиль общий для всех
   устройств и лежит в базе Firebase под номером Telegram.
   Если когда-нибудь появится свой сервер, вход пойдёт через
   него с проверкой подписи Telegram. Открыта просто в браузере —
   играем гостем, статистика остаётся на этом устройстве.
   ============================================================ */
(function (global) {
  'use strict';

  /* адрес сервера; пока пусто — работаем без него */
  var API = '';
  try { API = localStorage.getItem('nardy.api') || API; } catch (e) {}
  API = API.replace(/\/+$/, '');

  var me = null;
  try { me = JSON.parse(localStorage.getItem('nardy.me') || 'null'); } catch (e) { me = null; }

  function save() {
    try {
      if (me) localStorage.setItem('nardy.me', JSON.stringify(me));
      else localStorage.removeItem('nardy.me');
    } catch (e) {}
  }

  /* База Firebase — главный путь; внутри артефакта её нет */
  function fb() { return !API && !!global.NardyFB && NardyFB.ready() && !global.claude; }

  function hasServer() { return !!API || fb(); }
  function signed() { return !!me; }
  function user() { return me; }

  function ask(path, body) {
    if (!API) return Promise.reject(new Error('нет сервера'));
    return fetch(API + path, body ? {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    } : undefined).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d && d.error ? d.error : 'ошибка ' + r.status);
        return d;
      });
    });
  }

  /* Вход. Гостя пускаем всегда — иначе без сервера играть нельзя */
  function login(name) {
    var initData = global.NardyTG ? NardyTG.initData() : '';
    if (API && initData) {
      return ask('/api/login', { initData: initData }).then(function (d) {
        me = { id: d.user.id, name: d.user.name, photo: d.user.photo, guest: false };
        save();
        return me;
      }, function (e) {
        return guest(name, String(e.message || e));
      });
    }
    var tg = fb() && global.NardyTG ? NardyTG.account() : null;
    if (tg) {
      me = { id: tg.id, name: tg.name, photo: tg.photo, guest: false };
      save();
      return Promise.resolve(me);
    }
    return Promise.resolve(guest(name, API || fb() ? 'вход только из Telegram' : ''));
  }

  function guest(name, why) {
    var id = null;
    try { id = localStorage.getItem('nardy.id'); } catch (e) {}
    me = {
      id: id || 'guest',
      name: (name || (global.NardyTG && NardyTG.userName()) || 'Игрок').slice(0, 18),
      photo: (global.NardyTG && NardyTG.photo()) || '',
      guest: true,
      why: why || ''
    };
    save();
    return me;
  }

  function logout() { me = null; save(); }

  function rename(name) {
    if (!me) return;
    me.name = (name || 'Игрок').slice(0, 18);
    save();
  }

  function profile(id) {
    id = id || (me && me.id) || '';
    if (fb()) return NardyFB.profile(id).then(function (u) { return { user: u }; });
    return ask('/api/profile?id=' + encodeURIComponent(id));
  }

  function top() {
    if (fb()) return NardyFB.top().then(function (list) { return { top: list }; });
    return ask('/api/top');
  }

  global.NardyAccount = {
    api: function () { return API; },
    fb: fb,
    hasServer: hasServer, signed: signed, user: user,
    login: login, logout: logout, rename: rename,
    profile: profile, top: top
  };
})(window);
</script>
<script>
/* ============================================================
   Telegram: приложение открывается внутри мессенджера.
   Всё необязательное — если запущено просто в браузере, модуль
   молча отвечает «нет».
   ============================================================ */
(function (global) {
  'use strict';

  var BOT = 'vashi_nardy_bot';   /* имя бота из @BotFather */
  var APP = 'nardy';   /* короткое имя мини-приложения из @BotFather */

  var W = global.Telegram && global.Telegram.WebApp ? global.Telegram.WebApp : null;
  var on = !!(W && W.initData !== undefined && W.platform && W.platform !== 'unknown');

  function ready() {
    if (!on) return;
    try {
      W.ready();
      W.expand();
      if (W.disableVerticalSwipes) W.disableVerticalSwipes();   /* иначе перетаскивание шашки свернёт окно */
      if (W.setHeaderColor) W.setHeaderColor('#0F1218');
      if (W.setBackgroundColor) W.setBackgroundColor('#0F1218');
      if (W.enableClosingConfirmation) W.enableClosingConfirmation();
      document.documentElement.classList.add('tg');
      if (W.platform === 'ios' || W.platform === 'android') {
        document.documentElement.classList.add('tg-mobile');
      }
      /* На iOS высоту окна знает только сам Telegram — 100dvh там врёт */
      applyHeight();
      if (W.onEvent) {
        W.onEvent('viewportChanged', applyHeight);
        W.onEvent('themeChanged', applyHeight);
      }
    } catch (e) {}
  }

  function applyHeight() {
    try {
      var h = W.viewportStableHeight || W.viewportHeight;
      if (h) document.documentElement.style.setProperty('--tgh', Math.round(h) + 'px');
      window.dispatchEvent(new Event('resize'));
    } catch (e) {}
  }

  /* Имя из профиля — чтобы не заставлять представляться */
  function userName() {
    try {
      var u = W && W.initDataUnsafe && W.initDataUnsafe.user;
      if (!u) return '';
      return (u.first_name || u.username || '').slice(0, 18);
    } catch (e) { return ''; }
  }

  /* Фото профиля — если Telegram его отдал */
  function photo() {
    try {
      var u = W && W.initDataUnsafe && W.initDataUnsafe.user;
      return (u && u.photo_url) || '';
    } catch (e) { return ''; }
  }

  /* Кто открыл игру: номер в Telegram — ключ профиля */
  function account() {
    try {
      var u = W && W.initDataUnsafe && W.initDataUnsafe.user;
      if (!u || !u.id) return null;
      return {
        id: 'tg' + u.id,
        name: (u.first_name || u.username || 'Игрок').slice(0, 24),
        photo: u.photo_url || ''
      };
    } catch (e) { return null; }
  }

  /* Подписанные данные о входе — их проверяет сервер */
  function initData() {
    try { return (W && W.initData) || ''; } catch (e) { return ''; }
  }

  function startParam() {
    try {
      var p = W && W.initDataUnsafe && W.initDataUnsafe.start_param;
      return p ? String(p).toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
    } catch (e) { return ''; }
  }

  /* Отдача, ради которой всё и затевалось: доска отзывается на пальцы */
  function buzz(kind) {
    if (!on || !W.HapticFeedback) return;
    try {
      var h = W.HapticFeedback;
      if (kind === 'move') h.impactOccurred('light');
      else if (kind === 'off') h.impactOccurred('medium');
      else if (kind === 'dice') h.impactOccurred('rigid');
      else if (kind === 'win') h.notificationOccurred('success');
      else if (kind === 'lose') h.notificationOccurred('warning');
      else if (kind === 'no') h.notificationOccurred('error');
      else if (kind === 'tap') h.selectionChanged();
    } catch (e) {}
  }

  function deepLink(code) {
    if (!BOT) return '';
    return 'https://t.me/' + BOT + '/' + APP + '?startapp=' + code;
  }

  /* Приглашение уходит в чат Telegram, а не в буфер обмена */
  function invite(code, text) {
    var link = deepLink(code);
    if (!on || !link) return false;
    try {
      W.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) +
        '&text=' + encodeURIComponent(text || 'Партию в нарды?'));
      return true;
    } catch (e) { return false; }
  }

  function close() { if (on) { try { W.close(); } catch (e) {} } }

  /* Значок на экран «Домой»: Telegram сам покажет системное окно,
     человек нажмёт «Добавить». Без его согласия значок не поставить. */
  function homeScreen(cb) {
    if (!on || !W.addToHomeScreen || !W.checkHomeScreenStatus) { cb('unsupported'); return; }
    try { W.checkHomeScreenStatus(function (status) { cb(status || 'unknown'); }); }
    catch (e) { cb('unsupported'); }
  }

  function addHome() {

  global.NardyTG = {
    on: on,

<script>
/* ============================================================
   Firebase: столы и профили без своего сервера.

   Google бесплатно держит базу (Realtime Database) и пускает
   игроков анонимным входом — без регистрации и без карты,
   из России без VPN. Партию ведёт сам телефон теми же
   правилами, что и сервер (js/table.js). База следит за
   порядком (правила — в firebase.rules.json):
     • за стол пишут только двое севших;
     • каждая запись поднимает номер стола ровно на один —
       опоздавшая копия не затрёт свежую, а тот, кто опоздал,
       перечитывает стол и пробует снова.

   Работаем через обычные HTTP-запросы и поток событий
   (EventSource) — без тяжёлой библиотеки Firebase.
   ============================================================ */
(function (global) {
  'use strict';

  var CFG = {
    key: 'AIzaSyA8NB_PgCVCEWaqRVaG2Ei3pHVWhfpL3yY',      /* публичный ключ веб-приложения, не секрет */
    db: 'https://nardy-577d6-default-rtdb.europe-west1.firebasedatabase.app'
  };
  var T = global.NardyTable, N = global.Nardy;

  function clone(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }

  function fail(status, message) {
    var e = new Error(message || ('http ' + status));
    e.status = status;
    return e;
  }

  function json(r) {
    return r.json().then(function (d) {
      if (!r.ok) throw fail(r.status, d && d.error && (d.error.message || d.error));
      return d;
    }, function () { throw fail(r.status); });
  }

  /* ---------- анонимный вход ----------
     Номер игрока (uid) живёт в памяти телефона и не меняется между
     запусками. Пропуск (token) действует час и обновляется сам. */

  var sess = null, pending = null;
  try { sess = JSON.parse(localStorage.getItem('nardy.fb') || 'null'); } catch (e) { sess = null; }

  function keepSess() {
    try { localStorage.setItem('nardy.fb', JSON.stringify({ uid: sess.uid, rt: sess.rt })); } catch (e) {}
  }

  function signUp() {
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + CFG.key, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true })
    }).then(json).then(function (d) {
      sess = { uid: d.localId, rt: d.refreshToken, tok: d.idToken, exp: Date.now() + (Number(d.expiresIn) - 120) * 1000 };
      keepSess();
      return sess.tok;
    });
  }

  function refresh() {
    return fetch('https://securetoken.googleapis.com/v1/token?key=' + CFG.key, {
      method: 'POST',
      headers: { 'content-type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(sess.rt)
    }).then(json).then(function (d) {
      sess = { uid: d.user_id, rt: d.refresh_token, tok: d.id_token, exp: Date.now() + (Number(d.expires_in) - 120) * 1000 };
      keepSess();
      return sess.tok;
    });
  }

  function token() {
    if (sess && sess.tok && Date.now() < sess.exp) return Promise.resolve(sess.tok);
    if (pending) return pending;
    var p = sess && sess.rt
      ? refresh().then(null, function (e) { if (e.status === 400) return signUp(); throw e; })
      : signUp();
    pending = p.then(function (t) { pending = null; return t; }, function (e) { pending = null; throw e; });
    return pending;
  }

  function uid() { return sess ? sess.uid : null; }

  /* ---------- база ---------- */

  /* Всё игровое лежит в папке v1: поменяется устройство данных —
     заведём v2, и старые записи не помешают новым */
  function url(path, tok, query) {
    return CFG.db + '/v1/' + path + '.json?auth=' + encodeURIComponent(tok) + (query || '');
  }

  function get(path, query) {
    return token().then(function (tok) {
      return fetch(url(path, tok, query), { cache: 'no-store' }).then(json);
    });
  }

  function put(path, val) {
    return token().then(function (tok) {
      return fetch(url(path, tok), { method: 'PUT', body: JSON.stringify(val) }).then(json);
    });
  }

  /* Прочитать — изменить — записать. field — номер записи ('seq' у стола,
     'rev' у профиля): база примет запись, только если он вырос ровно на один.
     fn получает копию и возвращает новое значение или undefined — «не менять». */
  function update(path, fn, field) {
    var tries = 0;
    function once() {
      return get(path).then(function (cur) {
        var next = fn(cur == null ? null : clone(cur));
        if (next === undefined) return { value: cur, changed: false };
        next[field] = (cur ? cur[field] || 0 : 0) + 1;
        return put(path, next).then(function () {
          return { value: next, changed: true };
        }, function (e) {
          if (e.status === 401 && ++tries < 6) return once();     /* кто-то записал раньше нас */
          throw e;
        });
      });
    }
    return once();
  }

  /* Поток событий: база сама говорит, что запись изменилась. Сами
     изменения не собираем по кусочкам — просто перечитываем целиком,
     так надёжнее. Пропуск истёк — переподключаемся с новым. */
  function stream(path, onChange) {
    var es = null, dead = false, timer = null, retry = 0;

    function open() {
      if (dead) return;
      token().then(function (tok) {
        if (dead) return;
        es = new EventSource(url(path, tok));
        es.addEventListener('put', ping);
        es.addEventListener('patch', ping);
        es.addEventListener('auth_revoked', again);
        es.addEventListener('cancel', again);
        es.onerror = function () { if (es && es.readyState === 2) again(); };
      }, later);
    }
    function ping() { retry = 0; onChange(); }
    function again() {
      if (es) es.close();
      es = null;
      if (sess) sess.exp = 0;              /* на всякий случай берём свежий пропуск */
      later();
    }
    function later() {
      if (dead) return;
      clearTimeout(timer);
      timer = setTimeout(open, Math.min(10000, 500 * Math.pow(2, retry++)));
    }

    open();
    return {
      close: function () { dead = true; clearTimeout(timer); if (es) es.close(); es = null; },
      kick: function () { if (es) es.close(); es = null; retry = 0; open(); }
    };
  }

  /* ---------- время ----------
     Часы у телефонов расходятся. Меряем их по часам базы: при каждой
     отметке «я здесь» база вписывает своё время и возвращает его. */

  var skew = 0;
  function now() { return Math.round(Date.now() + skew); }

  /* ---------- профили ---------- */

  function acc() { return global.NardyTG ? NardyTG.account() : null; }

  function record(t) {
    var e = t.end;
    if (!e) return Promise.resolve();
    return ['w', 'b'].reduce(function (chain, p) {
      var me = t.seats[p];
      if (!me || !me.acc || !t.seats[N.opp(p)]) return chain;
      return chain.then(function () {
        return update('users/' + me.acc, function (u) {
          u = u || T.blankUser({ id: me.acc, name: me.name, photo: me.photo }, e.at);
          return T.recordInto(u, t, p) ? u : undefined;
        }, 'rev');
      }).then(null, function () {});
    }, Promise.resolve());
  }

  function profile(id) {
    return get('users/' + encodeURIComponent(id)).then(function (u) { return u ? T.pub(u) : null; });
  }

  /* Своё: имя, «о себе», медальон, чем показывать лицо */
  function saveMe(me, patch) {
    return update('users/' + me.id, function (u) {
      u = u || T.blankUser({ id: me.id, name: me.name, photo: me.photo }, now());
      for (var k in patch) u[k] = patch[k];
      u.updated = now();
      return u;
    }, 'rev');
  }

  /* Своё фото лежит отдельно от профиля — чтобы рейтинг не тянул
     полсотни картинок разом */
  var photos = {};
  function photoOf(acc) {
    if (!acc) return Promise.resolve('');
    if (photos[acc] !== undefined) return Promise.resolve(photos[acc]);
    return get('photos/' + encodeURIComponent(acc)).then(function (p) {
      photos[acc] = typeof p === 'string' ? p : '';
      return photos[acc];
    }, function () { return ''; });
  }
  function putPhoto(acc, data) {
    photos[acc] = data;
    return put('photos/' + encodeURIComponent(acc), data);
  }

  function top() {
    return get('users', '&orderBy=%22w%22&limitToLast=50').then(function (all) {
      var list = [], k;
      for (k in all || {}) {
        list.push({ id: k, name: all[k].name, photo: all[k].photo || '', w: all[k].w || 0, l: all[k].l || 0 });
      }
      list.sort(function (a, b) { return b.w - a.w || a.l - b.l; });
      return list;
    });
  }

  /* ---------- стол ---------- */

  function seatOf(t) {
    if (!t || !t.uids || !uid()) return null;
    if (t.uids.w === uid()) return 'w';
    if (t.uids.b === uid()) return 'b';
    return null;
  }

  /* Что видит игра: стол, кто был в сети и время по часам базы */
  var seenCache = {};
  function view(t) {
    var out = clone(T.normalize(t));
    delete out.uids;
    out.seen = seenCache[t.code] || { w: 0, b: 0 };
    out.now = now();
    return out;
  }

  function transport(myId, myName) {
    var cur = null, clockTimer = null;

    function who(w) {
      var v = global.NardyProfile ? NardyProfile.look() : {};
      return {
        id: myId(), name: (w && w.name) || myName() || 'Игрок', photo: (w && w.photo) || '',
        look: { pic: v.pic || 'tg', medal: v.medal || 'star' }
      };
    }

    function create(body) {
      var p = body.seat === 'b' ? 'b' : 'w', tries = 0;
      function attempt() {
        var code = T.code6(), t = T.freshTable(code, body.opts, now());
        t.uids = {};
        t.uids[p] = uid();
        t.seats[p] = T.person(who(body.who), acc());
        return put('tables/' + code, t).then(function () {
          cur = code;
          return { ok: true, seat: p, table: view(t), code: code };
        }, function (e) {
          if (e.status === 401 && ++tries < 5) return attempt();   /* такой код уже занят */
          throw e;
        });
      }
      return token().then(attempt);
    }

    function sit(code, want, w) {
      var p = null, why = null;
      return token().then(function () {
        return update('tables/' + code, function (t) {
          p = why = null;
          if (!t) { why = 'gone'; return; }
          T.normalize(t);
          t.uids = t.uids || {};
          p = seatOf(t);
          if (p) return;                                   /* уже сидим — просто вернуться */
          p = !t.seats.w ? 'w' : (!t.seats.b ? 'b' : null);
          if (!p) { why = 'full'; return; }
          t.uids[p] = uid();
          t.updatedAt = now();
          T.seat(t, p, T.person(who(w), acc()), now());
          return t;
        }, 'seq');
      }).then(function (r) {
        if (why) return { ok: false, why: why };
        cur = code;
        return { ok: true, seat: p, table: view(r.value), code: code };
      });
    }

    /* Просьба игрока: сперва отработать просрочку, потом саму просьбу.
       Партия кончилась на этой записи — пишем итог в профили. */
    function act(name, body) {
      var why = null, ended = false;
      return update('tables/' + cur, function (t) {
        why = null;
        ended = false;
        if (!t) { why = 'gone'; return; }
        T.normalize(t);
        var p = seatOf(t);
        if (!p) { why = 'not_seated'; return; }
        var at = now(), had = !!t.end;
        var late = T.settle(t, at);
        why = T.ask[name](t, p, body, at);
        ended = !had && !!t.end;
        if (why && !late) return;
        t.updatedAt = at;
        return t;
      }, 'seq').then(function (r) {
        if (r.changed && ended) record(r.value);
        return r.value ? { table: view(r.value), error: why } : { error: why || 'gone' };
      }, function (e) {
        if (!e || !e.status) return { error: 'net' };           /* нет связи — повторим */
        /* база отказала всерьёз — отдаём игре стол как есть, пусть выровняется */
        return get('tables/' + cur).then(function (t) {
          return { table: t ? view(t) : null, error: 'denied' };
        }, function () { return { error: 'net' }; });
      });
    }

    /* Просьбы идут по одной и повторяются, пока связь не вернётся */
    var queue = [], busy = false, tries = 0;
    function pump() {
      if (busy || !queue.length) return;
      busy = true;
      var job = queue[0];
      act(job.name, job.body).then(function (d) {
        busy = false;
        if (d.error === 'net') {
          tries++;
          if (tries === 1 && global.NardyNet && NardyNet.onLost) NardyNet.onLost();
          setTimeout(pump, Math.min(10000, 600 * Math.pow(2, tries - 1)));
          return;
        }
        queue.shift();
        if (tries && global.NardyNet && NardyNet.onBack) NardyNet.onBack();
        tries = 0;
        job.ok(d);
        pump();
      });
    }
    function ask(name, body) {
      return new Promise(function (ok) { queue.push({ name: name, body: body || {}, ok: ok }); pump(); });
    }

    /* Кто в сети: раз в 20 секунд отмечаемся сами и смотрим на соперника */
    function heartbeat(code, p) {
      if (!p) return Promise.resolve();
      var sent = Date.now();
      return put('seen/' + code + '/' + p, { '.sv': 'timestamp' }).then(function (ts) {
        if (typeof ts === 'number') skew = ts - (sent + Date.now()) / 2;
        return get('seen/' + code);
      }).then(function (s) {
        seenCache[code] = { w: (s && s.w) || 0, b: (s && s.b) || 0 };
      }, function () {});
    }

    /* Сходить за опоздавшего, когда выйдет срок. Караулят оба телефона,
       запишет тот, кто успеет, — второй увидит, что уже сделано. */
    function guard(t) {
      clearTimeout(clockTimer);
      if (!t || t.status !== 'live' || !t.deadline || t.state.winner) return;
      var ms = t.deadline + T.LIMITS.grace + 200 - now();
      clockTimer = setTimeout(function () {
        var ended = false;
        update('tables/' + t.code, function (x) {
          ended = false;
          if (!x) return;
          T.normalize(x);
          if (!seatOf(x)) return;
          var had = !!x.end;
          if (!T.settle(x, now())) return;
          ended = !had && !!x.end;
          x.updatedAt = now();
          return x;
        }, 'seq').then(function (r) { if (r.changed && ended) record(r.value); }, function () {});
      }, Math.max(0, ms));
    }

    return {
      kind: 'fb',
      hasLobby: false,
      hasPresence: true,
      authoritative: true,

      watchLobby: function (cb) { cb([]); return function () {}; },
      create: create,
      sit: sit,

      watchTable: function (code, cb, onErr) {
        cur = code;
        var dead = false, busyRead = false, again = false, fails = 0, beat = null, s = null, mine = null;

        function read() {
          if (dead) return;
          if (busyRead) { again = true; return; }
          busyRead = true;
          get('tables/' + code).then(function (t) {
            busyRead = false;
            if (dead) return;
            fails = 0;
            if (!t) { dead = true; cb(null); return; }
            T.normalize(t);
            var first = !mine;
            mine = seatOf(t);
