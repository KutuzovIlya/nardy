<meta name="theme-color" content="#0F1218">
<title>Длинные нарды</title>
<meta name="description" content="Длинные нарды: партия против компьютера или вдвоём по сети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Нарды. Свёрстано под телефон: экран делится на три полосы —
   соперник сверху, доска посередине во всю оставшуюся высоту,
   вы снизу. На большом экране раскладка та же, просто шире.
   ============================================================ */

:root {
  --bg:        #0F1218;
  --bg-deep:   #06080D;
  --panel:     #171B24;
  --panel-2:   #1F242F;
  --line:      rgba(200, 162, 74, .18);
  --text:      #EBE3D3;
  --text-dim:  #968D7C;
  --brass:     #C8A24A;
  --brass-lit: #E5C97F;
  --shadow-lg: 0 40px 90px -35px rgba(0, 0, 0, .9);
  --radius:    14px;
  --move-dur:  360ms;
  --ease:      cubic-bezier(.22, .68, .36, 1);
  --gap:       10px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  background-image: radial-gradient(120% 80% at 50% 0%, #161B24 0%, var(--bg-deep) 100%);
  color: var(--text);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; }

/* ---------- каркас ---------- */

.app {
  height: 100dvh;
  max-width: 760px;
  margin: 0 auto;
  padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
           calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  user-select: none;
  -webkit-user-select: none;
}

/* внутри Telegram шапку рисует сам мессенджер, а высоту окна он же и сообщает */
.tg .app {
  padding-top: 6px;
  height: var(--tgh, 100dvh);
}

/* ---------- верхняя планка ---------- */

.rail {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.mark {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: Forum, Georgia, serif;
  font-size: 20px;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1;
}

.mark em {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-style: normal;
  font-size: 9px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--brass);
}

.tally {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--text-dim);
}

.tally b { font-size: 16px; font-weight: 500; color: var(--text); }

.chip {
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--brass);
  white-space: nowrap;
}

.rail-actions { display: flex; gap: 6px; }

/* ---------- кнопки ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color .18s, background .18s, transform .12s, color .18s, opacity .18s;
}

.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .32; }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.btn-icon {
  width: 38px;
  padding: 0;
  height: 38px;
  display: grid;
  place-items: center;
  font-size: 15px;
  line-height: 1;
}

.btn-key {
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  border-color: transparent;
  color: #14100A;
  font-weight: 500;
}

@media (hover: hover) {
  .btn:hover:not(:disabled) { border-color: var(--brass); color: var(--brass-lit); }
  .btn-key:hover:not(:disabled) { color: #14100A; filter: brightness(1.08); }
}

/* ---------- стол ---------- */

.table {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--gap);
}

.stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.board {
  position: relative;
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  touch-action: none;
}

.board canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  display: block;
}

.layer { position: absolute; inset: 0; pointer-events: none; }
.layer.hit { pointer-events: auto; }

.zone { position: absolute; border-radius: 4px; }

.zone.live { cursor: pointer; }

.zone.live::after {
  content: "";
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 162, 74, .34), transparent 70%);
  opacity: 0;
  transition: opacity .2s;
}

@media (hover: hover) {
  .zone.live:hover::after { opacity: 1; }
}

.zone.tray.live {
  box-shadow: inset 0 0 0 2px rgba(200, 162, 74, .45), inset 0 0 26px rgba(200, 162, 74, .25);
  border-radius: 9px;
}

.zone.tray::after { display: none; }

/* ---------- шашки ---------- */

.man {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  height: var(--cd);
  border-radius: 50%;
  background-size: 100% 100%;
  will-change: transform;
  transition: transform var(--move-dur) var(--ease), filter .2s ease;
  z-index: 1;
  filter: drop-shadow(0 5px 7px rgba(0, 0, 0, .6));
}

.man.pick { z-index: 6; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .7)) brightness(1.08); }

.man.pick::before,
.man.hint::before {
  content: "";
  position: absolute;
  inset: -6%;
  border-radius: 50%;
  border: 2px solid var(--brass);
  box-shadow: 0 0 18px rgba(200, 162, 74, .55);
}

.man.hint::before { border-style: dashed; animation: breathe 1.4s ease-in-out infinite; }

.man.land { animation: land .34s var(--ease); }

@keyframes land {
  0% { filter: drop-shadow(0 5px 7px rgba(0, 0, 0, .6)) brightness(1.45); }
  100% { filter: drop-shadow(0 5px 7px rgba(0, 0, 0, .6)) brightness(1); }
}

.tag {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  text-align: center;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: calc(var(--cd) * .34);
  font-weight: 500;
  line-height: 1;
  color: #4B3517;
  text-shadow: 0 1px 2px rgba(255, 250, 235, .55);
  z-index: 20;
  pointer-events: none;
}

.tag.on-dark { color: #F1E3BE; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }

/* ---------- метки хода ---------- */

.spot {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  height: var(--cd);
  border-radius: 50%;
  border: 2px solid var(--brass);
  background: radial-gradient(circle, rgba(200, 162, 74, .24), rgba(200, 162, 74, .04) 70%);
  box-shadow: 0 0 22px rgba(200, 162, 74, .35);
  animation: breathe 1.6s ease-in-out infinite;
  z-index: 4;
  cursor: pointer;
  pointer-events: auto;
  touch-action: none;
}

.spot em {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-style: normal;
  font-size: calc(var(--cd) * .38);
  color: var(--brass-lit);
}

@keyframes breathe {
  0%, 100% { opacity: .55; }
  50%      { opacity: 1; }
}

/* ---------- кости ---------- */

.die-wrap {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--dd);
  height: var(--dd);
  z-index: 3;
}

.die {
  position: absolute;
  inset: 0;
  background-size: 100% 100%;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .65));
  transition: opacity .3s, transform .3s;
}

.die.used { opacity: .4; transform: scale(.86); }
.die.tumble { animation: tumble .58s var(--ease); }

@keyframes tumble {
  0%   { transform: translateY(-34px) rotate(-160deg) scale(.7); opacity: 0; }
  55%  { transform: translateY(6px) rotate(14deg) scale(1.06); opacity: 1; }
  75%  { transform: translateY(-4px) rotate(-4deg) scale(.99); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}

/* ---------- реплики и сообщения ---------- */

.quip, .toast {
  position: absolute;
  left: 50%;
  transform: translate(-50%, 8px);
  max-width: min(92%, 30rem);
  text-align: center;
  opacity: 0;
  pointer-events: none;
  z-index: 21;
  transition: opacity .28s, transform .28s var(--ease);
}

.quip {
  /* чуть выше середины: ровно по центру она накрывала кости */
  top: 34%;
  margin-top: -1.4em;
  padding: 9px 20px;
  border-radius: 999px;
  background: rgba(12, 9, 6, .78);
  border: 1px solid rgba(200, 162, 74, .34);
  box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .9);
  font-family: Forum, Georgia, serif;
  font-size: clamp(14px, 3.7vw, 19px);
  color: #F4E7C8;
  text-wrap: balance;
  backdrop-filter: blur(4px);
}

.toast {
  bottom: 3%;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(10, 8, 6, .86);
  border: 1px solid rgba(200, 162, 74, .3);
  color: #F0E6D2;
  font-size: 13px;
  backdrop-filter: blur(6px);
}

.quip.show, .toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- таблички игроков ---------- */

.plaque {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
  transition: border-color .3s, background .3s;
}

.plaque::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  width: 100%;
  background: linear-gradient(90deg, var(--brass), transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .5s var(--ease);
}

.plaque.act { border-color: color-mix(in srgb, var(--brass) 55%, transparent); background: var(--panel-2); }
.plaque.act::before { transform: scaleX(1); }

.disc { width: 26px; height: 26px; border-radius: 50%; flex: none; background-size: 100% 100%; }

.pwho { min-width: 0; }

.pname {
  font-family: Forum, Georgia, serif;
  font-size: 19px;
  letter-spacing: .07em;
  text-transform: uppercase;
  line-height: 1.15;
}

.pmeta {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* аватарка: фото из Telegram, иначе шашка своего цвета */
.ava {
  position: relative;
  width: 46px;
  height: 46px;
  flex: none;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 1px var(--line);
}

.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava .disc { width: 100%; height: 100%; }

.turn {
  margin-left: auto;
  flex: none;
  padding: 4px 11px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  color: #14100A;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: 0;
  transform: scale(.85);
  transition: opacity .25s, transform .25s var(--ease);
}

.plaque.act .turn { opacity: 1; transform: none; }

/* ---------- диалоги ---------- */

.veil {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  background: rgba(6, 8, 13, .76);
  backdrop-filter: blur(10px) saturate(.9);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}

.veil.show { opacity: 1; pointer-events: auto; }

/* в Telegram окно ниже, чем думает браузер: иначе низ диалога
   с кнопкой «Начать» уезжает под интерфейс мессенджера */
.tg .veil { bottom: auto; height: var(--tgh, 100dvh); }
.veil { overflow-y: auto; }

.sheet {
  width: min(460px, 100%);
  max-height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: var(--shadow-lg);
  padding: 22px 20px 20px;
  transform: translateY(12px) scale(.98);
  transition: transform .3s var(--ease);
}

.veil.show .sheet { transform: none; }

.sheet h1 {
  margin: 0 0 4px;
  font-family: Forum, Georgia, serif;
  font-size: 27px;
  font-weight: 400;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-wrap: balance;
}

.sheet .lede { margin: 0 0 18px; color: var(--text-dim); font-size: 13px; }

.field { margin-bottom: 16px; }

.field > label {
  display: block;
  margin-bottom: 6px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
}

.seg button {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 9px 4px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-dim);
  transition: background .2s, color .2s;
}

.seg button[aria-pressed="true"] {
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  color: #14100A;
}

.seg button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

.sheet-actions { display: flex; gap: 8px; margin-top: 20px; }
.sheet-actions .btn { flex: 1; text-align: center; padding: 12px 10px; }

.hint { margin: 7px 0 0; font-size: 12px; color: var(--text-dim); min-height: 1em; }

.field.gap { margin-top: 20px; }

.inp {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
}

.inp::placeholder { color: var(--text-dim); }
.inp:focus { outline: 2px solid var(--brass); outline-offset: 1px; border-color: transparent; }

.inp.mono {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .3em;
  text-transform: uppercase;
  text-align: center;
}

.row { display: flex; gap: 8px; }
.row .inp { flex: 1; min-width: 0; }
.row .btn { flex: none; }

.code-big {
  margin: 4px 0 2px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 34px;
  letter-spacing: .24em;
  text-align: center;
  text-indent: .24em;
  color: var(--brass-lit);
}

.tables {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 168px;
  overflow-y: auto;
}

.tables li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px 9px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  font-size: 13px;
}

.tables li.muted { color: var(--text-dim); border-style: dashed; background: transparent; }
.tables b { font-weight: 500; letter-spacing: .16em; color: var(--brass-lit); }
.tables span { color: var(--text-dim); margin-right: auto; }
.tables .btn { padding: 6px 13px; font-size: 12px; }

.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

.rules { font-size: 13.5px; color: var(--text-dim); }

.rules h3 {
  margin: 16px 0 4px;
  font-family: Forum, Georgia, serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text);
}

.rules p { margin: 0 0 7px; }
.rules b { color: var(--text); font-weight: 500; }

.crown {
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  margin: 0 auto 12px;
  border-radius: 50%;
  border: 1px solid var(--line);
}

.crown .disc { width: 38px; height: 38px; }

/* ---------- совсем узкие экраны ---------- */

/* на телефоне название не нужно — его показывает сам Telegram */
@media (max-width: 560px) {
  .mark { display: none; }
  .tally { margin-left: 0; margin-right: auto; }
  .app { padding-left: calc(6px + env(safe-area-inset-left)); padding-right: calc(6px + env(safe-area-inset-right)); }
}

@media (max-width: 380px) {
  .btn { padding: 8px 11px; font-size: 12px; }
  .btn-icon { width: 34px; height: 34px; }
  .pstats { gap: 10px; }
}

@media (max-height: 620px) {
  .plaque { padding: 6px 11px; }
  .pname { font-size: 15px; }
  .pmeta { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, .man { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
<div class="app">

  <header class="rail">
    <div class="mark">Нарды <em>длинные</em></div>

    <div class="tally">
      <span class="chip" id="net-chip" hidden></span>
      <b id="tally-w">0</b>
      <span>:</span>
      <b id="tally-b">0</b>
    </div>

    <nav class="rail-actions">
      <button class="btn btn-icon" id="act-hint" type="button" title="Подсказка" aria-label="Подсказка">?</button>
      <button class="btn btn-icon" id="act-undo" type="button" title="Отменить ход" aria-label="Отменить ход">↶</button>
      <button class="btn btn-icon" id="act-sound" type="button" aria-pressed="true" title="Звук">♪</button>
      <button class="btn btn-key" id="act-new" type="button">Партия</button>
    </nav>
  </header>

  <main class="table">
    <div class="plaque" id="pl-b">
      <span class="ava" id="ava-b"><span class="disc b"></span></span>
      <div class="pwho">
        <div class="pname">Чёрные</div>
        <div class="pmeta" id="meta-b">Компьютер</div>
      </div>
      <span class="turn">ходит</span>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board">
        <canvas id="scene"></canvas>
        <div class="layer hit" id="zones"></div>
        <div class="layer" id="men"></div>
        <div class="layer" id="spots"></div>
        <div class="layer" id="dice"></div>
        <div class="quip" id="quip"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>

    <div class="plaque" id="pl-w">
      <span class="ava" id="ava-w"><span class="disc w"></span></span>
      <div class="pwho">
        <div class="pname">Белые</div>
        <div class="pmeta" id="meta-w">Игрок</div>
      </div>
      <span class="turn">ходит</span>
    </div>
  </main>

</div>

<div class="veil" id="veil">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Меню"></div>
</div>
<script>
/* ============================================================
   Длинные нарды — движок правил
   Кольцо из 24 пунктов. Оба игрока идут в сторону возрастания
   индекса. Голова белых — пункт 0, голова чёрных — пункт 12.
   Дом белых — 18..23, дом чёрных — 6..11.
   В points[] белые хранятся положительным числом, чёрные —
   отрицательным.
   ============================================================ */
(function (global) {
  'use strict';

  var WHITE = 'w', BLACK = 'b', OFF = -1, NP = 24, NC = 15;
  var HEAD = { w: 0, b: 12 };

  function opp(p) { return p === WHITE ? BLACK : WHITE; }
  function rel(p, i) { return (i - HEAD[p] + NP) % NP; }
  function absOf(p, r) { return (HEAD[p] + r) % NP; }

    [r * 0.30, r * 0.46, r].forEach(function (rr, k) {

    g.addColorStop(0, 'rgba(255,224,170,.20)');
    g.addColorStop(1, 'rgba(24,11,4,.45)');

    ctx.arc(0, 0, r * 0.28, 0, 6.284);

    ctx.fill();

  /* Восьмиконечная воровская звезда — главный знак на таких досках */
  function thiefStar(ctx, cx, cy, r) {
    var i, a;
    ctx.save();
    ctx.translate(cx, cy);

    /* два квадрата, повёрнутые друг относительно друга */
    [0, Math.PI / 4].forEach(function (turn) {
      cut(ctx, function (c) {
        c.beginPath();
        for (i = 0; i < 4; i++) {

    cut(ctx, function (c) {

        a = i * Math.PI / 4;

        c.lineTo(Math.cos(a) * r * 0.97, Math.sin(a) * r * 0.97);

    ctx.save();
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4;

      ctx.moveTo(Math.cos(a) * r * 0.97, Math.sin(a) * r * 0.97);
      ctx.lineTo(Math.cos(a + Math.PI / 8) * r * 0.42, Math.sin(a + Math.PI / 8) * r * 0.42);
      ctx.lineTo(Math.cos(a - Math.PI / 8) * r * 0.42, Math.sin(a - Math.PI / 8) * r * 0.42);
      ctx.closePath();

      ctx.fill();

    [r * 0.20, r * 0.42].forEach(function (rr) {
      cut(ctx, function (c) { c.beginPath(); c.arc(0, 0, rr, 0, 6.284); c.stroke(); }, 1, 0.24);
    });

    var g = ctx.createRadialGradient(-r * 0.08, -r * 0.08, 1, 0, 0, r * 0.20);
    g.addColorStop(0, 'rgba(255,224,170,.22)');
    g.addColorStop(1, 'rgba(24,11,4,.5)');
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.19, 0, 6.284);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  /* Ёлочка вдоль борта — самый ходовой резной поясок */
  function chevrons(ctx, x0, y0, x1, y1, size) {
    var len = Math.hypot(x1 - x0, y1 - y0), n = Math.floor(len / (size * 1.5));
    var ang = Math.atan2(y1 - y0, x1 - x0), i, t, x, y;
    for (i = 0; i <= n; i++) {

  /* ---------- части доски ---------- */

  function drawFrame(ctx) {
    var g = ctx.createLinearGradient(0, 0, VW * 0.6, VH);
    g.addColorStop(0, C.frameHi);
    g.addColorStop(0.45, '#3B2114');
    g.addColorStop(1, C.frameLo);
    rrect(ctx, 0, 0, VW, VH, 16);
    ctx.fillStyle = g;
    ctx.fill();
    grain(ctx, 0, 0, VW, VH, 7, 210, 0.12);

    ctx.save();
    ctx.beginPath();

    rrect(ctx, FRAME, FRAME, VW - 2 * FRAME, VH - 2 * FRAME, 5);

    chevrons(ctx, VW - 34, VH - c, 34, VH - c, 10);
    chevrons(ctx, c, VH - 34, c, 34, 10);
    chevrons(ctx, VW - c, 34, VW - c, VH - 34, 10);

    ctx.strokeStyle = 'rgba(200,162,74,.42)';
    ctx.lineWidth = 1.1;
    rrect(ctx, 2.5, 2.5, VW - 5, VH - 5, 14); ctx.stroke();
    rrect(ctx, FRAME - 2, FRAME - 2, VW - 2 * FRAME + 4, VH - 2 * FRAME + 4, 6); ctx.stroke();
  }

  function drawBed(ctx) {
    var x = FRAME, y = FRAME, w = VW - 2 * FRAME, h = VH - 2 * FRAME;
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, C.bed);
    g.addColorStop(0.5, '#361F12');
    g.addColorStop(1, C.bedLo);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    grain(ctx, x, y, w, h, 21, 190, 0.10);

    var s = ctx.createLinearGradient(x, 0, x + 34, 0);
    s.addColorStop(0, 'rgba(0,0,0,.6)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = s; ctx.fillRect(x, y, 34, h);
    s = ctx.createLinearGradient(x + w, 0, x + w - 34, 0);
    s.addColorStop(0, 'rgba(0,0,0,.6)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = s; ctx.fillRect(x + w - 34, y, 34, h);

  /* Полка для снятых шашек — утопленный жёлоб вдоль борта */
  function drawShelf(ctx, player) {
    var b = trayBox(player);

    ctx.fillStyle = '#190D06';
    ctx.fill();

  function drawBar(ctx) {
    var x = colX(6) - BAR, y = TOPY - 6, h = BOTY - TOPY + 12;
    var g = ctx.createLinearGradient(x, 0, x + BAR, 0);
    g.addColorStop(0, '#150B05');
    g.addColorStop(0.5, '#4E2D1B');

      } else {

    var g = ctx.createLinearGradient(0, 0, VW * 0.75, VH);
    g.addColorStop(0, 'rgba(255,238,208,.10)');
    g.addColorStop(0.35, 'rgba(255,238,208,.02)');

  /* ---------- шашки и кости картинками ---------- */

  function face(px, paint) {

  /* Точёная шашка: фаска, две канавки и резная звезда посередине */

        ctx.lineWidth = s * 0.018; ctx.stroke();
        ctx.beginPath(); ctx.arc(r, r + s * 0.008, r * f, 0, 6.284);
        ctx.strokeStyle = 'rgba(40,24,8,.45)';
        ctx.lineWidth = s * 0.018; ctx.stroke();

      ctx.save();

      for (i = 0; i < 48; i++) {
        a = i * Math.PI / 24;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.87, Math.sin(a) * r * 0.87);
        ctx.lineTo(Math.cos(a) * r * 0.955, Math.sin(a) * r * 0.955);
        ctx.strokeStyle = 'rgba(40,24,8,.30)';
        ctx.lineWidth = s * 0.016;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.87, Math.sin(a) * r * 0.87 - s * 0.01);
        ctx.lineTo(Math.cos(a) * r * 0.955, Math.sin(a) * r * 0.955 - s * 0.01);
        ctx.strokeStyle = bone ? 'rgba(255,250,232,.34)' : 'rgba(206,174,116,.16)';
        ctx.lineWidth = s * 0.012;
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(r, r);
      for (i = 0; i < 8; i++) {
        a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.12, Math.sin(a) * r * 0.12);
        ctx.lineTo(Math.cos(a) * r * 0.44, Math.sin(a) * r * 0.44);
        ctx.strokeStyle = 'rgba(40,24,8,.42)';
        ctx.lineWidth = s * 0.022;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.12, Math.sin(a) * r * 0.12 - s * 0.012);
        ctx.lineTo(Math.cos(a) * r * 0.44, Math.sin(a) * r * 0.44 - s * 0.012);
        ctx.strokeStyle = bone ? 'rgba(255,248,228,.5)' : 'rgba(200,168,110,.22)';
        ctx.lineWidth = s * 0.016;
        ctx.stroke();

      ctx.arc(0, 0, r * 0.12, 0, 6.284);
      ctx.fillStyle = bone ? 'rgba(120,92,48,.35)' : 'rgba(200,162,74,.3)';
      ctx.fill();
      ctx.restore();

      var sh = ctx.createRadialGradient(r, r, r * 0.72, r, r, r);
      sh.addColorStop(0, 'rgba(0,0,0,0)');
      sh.addColorStop(1, bone ? 'rgba(60,40,14,.5)' : 'rgba(0,0,0,.65)');
      ctx.fillStyle = sh;
      ctx.fillRect(0, 0, s, s);

      var hi = ctx.createLinearGradient(0, 0, s * 0.7, s * 0.8);
      hi.addColorStop(0, bone ? 'rgba(255,255,245,.5)' : 'rgba(255,236,200,.16)');
      hi.addColorStop(0.55, 'rgba(255,255,245,0)');
      ctx.fillStyle = hi;
      ctx.fillRect(0, 0, s, s);
      ctx.restore();
    });
    return cache[key];
  }

  var PIPS = {
    1: [[50, 50]],
    2: [[27, 27], [73, 73]],
    3: [[27, 27], [50, 50], [73, 73]],
    4: [[27, 27], [73, 27], [27, 73], [73, 73]],
    5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]],
    6: [[27, 25], [73, 25], [27, 50], [73, 50], [27, 75], [73, 75]]
  };

  /* Костяной кубик: точка в кольце — как на старых игральных костях */
  function die(side, value, px) {

    if (cache[key]) return cache[key];
    cache[key] = face(px, function (ctx, s) {
      var bone = side === 'w', i, gr = rnd32(value * 7 + (bone ? 1 : 2));

      } else {

        ctx.strokeStyle = gr() > 0.5 ? 'rgba(255,244,220,.6)' : 'rgba(40,25,8,.6)';
        ctx.lineWidth = 0.4 + gr();
        ctx.stroke();

        ctx.lineWidth = s * 0.016;

        var pg = ctx.createRadialGradient(cx - rr * 0.3, cy - rr * 0.35, rr * 0.1, cx, cy, rr);
        if (bone) { pg.addColorStop(0, '#6A5537'); pg.addColorStop(1, '#241A0D'); }
        else { pg.addColorStop(0, '#F6EAC8'); pg.addColorStop(1, '#B39A63'); }
        ctx.beginPath();
        ctx.arc(cx, cy, rr, 0, 6.284);
        ctx.fillStyle = pg;
        ctx.fill();
      });

      var hi = ctx.createLinearGradient(0, 0, s * 0.5, s * 0.6);
      hi.addColorStop(0, bone ? 'rgba(255,255,248,.55)' : 'rgba(255,240,210,.14)');
      hi.addColorStop(0.6, 'rgba(255,255,255,0)');
      ctx.fillStyle = hi;
      ctx.fillRect(0, 0, s, s);
      var sh = ctx.createLinearGradient(s * 0.4, s * 0.5, s, s);
      sh.addColorStop(0, 'rgba(0,0,0,0)');
      sh.addColorStop(1, bone ? 'rgba(70,48,16,.34)' : 'rgba(0,0,0,.5)');
      ctx.fillStyle = sh;
      ctx.fillRect(0, 0, s, s);
      ctx.restore();
    });
    return cache[key];
  }

  global.NardyBoard = {
    VW: VW, VH: VH, CD: CD, DD: DD, COL: COL, PTH: PTH,
    setFlip: setFlip, isFlip: isFlip, vw: vw, vh: vh, map: map,
    geom: geom, manAt: manAt, trayAt: trayAt, trayBox: trayBox, diceAt: diceAt,
    gapFor: gapFor, render: render, checker: checker, die: die

})(window);

<script>
/* ============================================================
   Telegram: приложение открывается внутри мессенджера.
   Всё необязательное — если запущено просто в браузере, модуль
   молча отвечает «нет».
   ============================================================ */
(function (global) {
  'use strict';

  var BOT = 'vashi_nardy_bot';   /* имя бота из @BotFather */
  var APP = 'nardy';   /* короткое имя мини-приложения из @BotFather */

  var W = global.Telegram && global.Telegram.WebApp ? global.Telegram.WebApp : null;
  var on = !!(W && W.initData !== undefined && W.platform && W.platform !== 'unknown');

  function ready() {
    if (!on) return;
    try {
      W.ready();
      W.expand();
      if (W.disableVerticalSwipes) W.disableVerticalSwipes();   /* иначе перетаскивание шашки свернёт окно */
      if (W.setHeaderColor) W.setHeaderColor('#0F1218');
      if (W.setBackgroundColor) W.setBackgroundColor('#0F1218');
      if (W.enableClosingConfirmation) W.enableClosingConfirmation();
      document.documentElement.classList.add('tg');
      if (W.platform === 'ios' || W.platform === 'android') {
        document.documentElement.classList.add('tg-mobile');
      }
      /* На iOS высоту окна знает только сам Telegram — 100dvh там врёт */
      applyHeight();
      if (W.onEvent) {
        W.onEvent('viewportChanged', applyHeight);
        W.onEvent('themeChanged', applyHeight);
      }
    } catch (e) {}
  }

  function applyHeight() {
    try {
      var h = W.viewportStableHeight || W.viewportHeight;
      if (h) document.documentElement.style.setProperty('--tgh', Math.round(h) + 'px');
      window.dispatchEvent(new Event('resize'));
    } catch (e) {}
  }

  /* Имя из профиля — чтобы не заставлять представляться */
  function userName() {
    try {
      var u = W && W.initDataUnsafe && W.initDataUnsafe.user;
      if (!u) return '';
      return (u.first_name || u.username || '').slice(0, 18);
    } catch (e) { return ''; }
  }

  /* Фото профиля — если Telegram его отдал */
  function photo() {
    try {
      var u = W && W.initDataUnsafe && W.initDataUnsafe.user;
      return (u && u.photo_url) || '';
    } catch (e) { return ''; }
  }

  function startParam() {
    try {
      var p = W && W.initDataUnsafe && W.initDataUnsafe.start_param;
      return p ? String(p).toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
    } catch (e) { return ''; }
  }

  /* Отдача, ради которой всё и затевалось: доска отзывается на пальцы */
  function buzz(kind) {
    if (!on || !W.HapticFeedback) return;
    try {
      var h = W.HapticFeedback;
      if (kind === 'move') h.impactOccurred('light');
      else if (kind === 'off') h.impactOccurred('medium');
      else if (kind === 'dice') h.impactOccurred('rigid');
      else if (kind === 'win') h.notificationOccurred('success');
      else if (kind === 'lose') h.notificationOccurred('warning');
      else if (kind === 'no') h.notificationOccurred('error');
      else if (kind === 'tap') h.selectionChanged();
    } catch (e) {}
  }

  function deepLink(code) {
    if (!BOT) return '';
    return 'https://t.me/' + BOT + '/' + APP + '?startapp=' + code;
  }

  /* Приглашение уходит в чат Telegram, а не в буфер обмена */
  function invite(code, text) {
    var link = deepLink(code);
    if (!on || !link) return false;
    try {
      W.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) +

    } catch (e) { return false; }
  }

    userName: userName,

    buzz: buzz,
    deepLink: deepLink,
    invite: invite,
    close: close,
    platform: on ? W.platform : ''
