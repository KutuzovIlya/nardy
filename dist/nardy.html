<title>Длинные нарды</title>
<meta name="description" content="Длинные нарды: партия против компьютера или вдвоём за одним экраном.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Нарды — оформление
   Палитра: ореховая доска с латунной инкрустацией на тёмном
   столе. Акцент — латунь, всё остальное приглушено.
   ============================================================ */

:root {
  --bg:        #EFE8DA;
  --bg-deep:   #E0D5C0;
  --panel:     #FAF6EE;
  --panel-2:   #F2EADA;
  --line:      rgba(74, 56, 32, .18);
  --line-soft: rgba(74, 56, 32, .10);
  --text:      #2B2318;
  --text-dim:  #6E6050;
  --brass:     #8A6716;
  --brass-lit: #B08A2E;
  --felt:      #14514A;
  --oxblood:   #7B2E26;
  --shadow-lg: 0 30px 70px -30px rgba(40, 28, 12, .45);
  --shadow-sm: 0 2px 10px rgba(40, 28, 12, .14);
  --radius:    14px;
  --move-dur:  380ms;
  --ease:      cubic-bezier(.22, .68, .36, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #10131A;
    --bg-deep:   #070910;
    --panel:     #181C25;
    --panel-2:   #1F242F;
    --line:      rgba(200, 162, 74, .18);
    --line-soft: rgba(200, 162, 74, .09);
    --text:      #EBE3D3;
    --text-dim:  #968D7C;
    --brass:     #C8A24A;
    --brass-lit: #E5C97F;
    --shadow-lg: 0 40px 90px -35px rgba(0, 0, 0, .9);
    --shadow-sm: 0 2px 12px rgba(0, 0, 0, .5);
  }
}

:root[data-theme="dark"] {
  --bg:        #10131A;
  --bg-deep:   #070910;
  --panel:     #181C25;
  --panel-2:   #1F242F;
  --line:      rgba(200, 162, 74, .18);
  --line-soft: rgba(200, 162, 74, .09);
  --text:      #EBE3D3;
  --text-dim:  #968D7C;
  --brass:     #C8A24A;
  --brass-lit: #E5C97F;
  --shadow-lg: 0 40px 90px -35px rgba(0, 0, 0, .9);
  --shadow-sm: 0 2px 12px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  background: var(--bg);
  background-image: radial-gradient(120% 90% at 50% -10%, var(--bg) 0%, var(--bg-deep) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

/* ---------- каркас ---------- */

.app {
  min-height: 100%;
  user-select: none;
  -webkit-user-select: none;
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- верхняя планка ---------- */

.rail {
  display: flex;
  align-items: center;
  gap: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.mark {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: Forum, Georgia, serif;
  font-size: 30px;
  letter-spacing: .16em;
  text-transform: uppercase;
  line-height: 1;
  color: var(--text);
}

.mark em {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-style: normal;
  font-size: 10px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--brass);
}

.tally {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--text-dim);
}

.tally b {
  font-size: 17px;
  font-weight: 500;
  color: var(--text);
}

.tally span {
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
}

.chip {
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px !important;
  letter-spacing: .12em !important;
  text-transform: uppercase;
  color: var(--brass) !important;
  white-space: nowrap;
}

.rail-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

.btn .tight { display: none; }

/* ---------- кнопки ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 999px;
  padding: 8px 15px;
  font-size: 13px;
  letter-spacing: .02em;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .18s, color .18s;
  white-space: nowrap;
}

.btn:hover:not(:disabled) { border-color: var(--brass); color: var(--brass-lit); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .38; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.btn-icon { padding: 8px 11px; }

.btn-key {
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  border-color: transparent;
  color: #14100A;
  font-weight: 500;
}

.btn-key:hover:not(:disabled) { color: #14100A; filter: brightness(1.08); }

/* ---------- доска ---------- */

.table { position: relative; }

.stage { position: relative; }

.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1240 / 820;
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  touch-action: manipulation;
}

.board canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 18px;
  display: block;
}

.layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.layer.hit { pointer-events: auto; }

/* пункты — прозрачные зоны нажатия */
.zone {
  position: absolute;
  cursor: default;
  border-radius: 4px;
}

.zone.live {
  cursor: pointer;
  touch-action: none;
}

/* доступный пункт слегка светится у основания */
.zone.live::after {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  height: 26%;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(200, 162, 74, .30), transparent 70%);
  opacity: 0;
  transition: opacity .2s;
}

.zone.live[data-row="top"]::after { top: -4%; }
.zone.live[data-row="bottom"]::after { bottom: -4%; }
.zone.live:hover::after { opacity: 1; }

.spot { touch-action: none; }

.zone.tray::after { display: none; }

.zone.tray.live {
  box-shadow: inset 0 0 0 2px rgba(200, 162, 74, .45), inset 0 0 26px rgba(200, 162, 74, .25);
  border-radius: 9px;
}

/* ---------- шашки ---------- */

.man {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  height: var(--cd);
  border-radius: 50%;
  will-change: transform;
  transition: transform var(--move-dur) var(--ease), filter .2s ease;
  z-index: 1;
}

.man::after {
  content: "";
  position: absolute;
  inset: 21%;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .28), rgba(0, 0, 0, .12) 70%);
}

.man.w {
  background:
    radial-gradient(circle at 34% 27%, #FFFAEE 0%, #EDDFC0 38%, #D3BE95 72%, #A78F63 100%);
  box-shadow:
    inset 0 0 0 2px rgba(255, 253, 245, .55),
    inset 0 -7px 14px rgba(122, 96, 55, .38),
    0 7px 16px -4px rgba(0, 0, 0, .62);
}

.man.w::after { box-shadow: inset 0 0 0 1.5px rgba(140, 112, 66, .35); }

.man.b {
  background:
    radial-gradient(circle at 34% 27%, #5A5045 0%, #3A312A 38%, #211B17 72%, #0D0A08 100%);
  box-shadow:
    inset 0 0 0 2px rgba(200, 162, 74, .30),
    inset 0 -7px 14px rgba(0, 0, 0, .55),
    0 6px 14px -4px rgba(0, 0, 0, .65);
}

.man.b::after { box-shadow: inset 0 0 0 1.5px rgba(200, 162, 74, .22); }

.man.pick { filter: brightness(1.1); z-index: 6; }

.man.pick::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid var(--brass);
  box-shadow: 0 0 18px rgba(200, 162, 74, .55);
}

.man.hint::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px dashed var(--brass-lit);
  animation: breathe 1.4s ease-in-out infinite;
}

.man.land { animation: land .34s var(--ease); }

@keyframes land {
  0%   { filter: brightness(1.4); }
  100% { filter: brightness(1); }
}

/* счётчик на высокой стопке */
.tag {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  text-align: center;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: calc(var(--cd) * .34);
  line-height: 1;
  font-weight: 500;
  color: #4B3517;
  text-shadow: 0 1px 2px rgba(255, 250, 235, .55);
  z-index: 20;
  pointer-events: none;
}

.tag.on-dark {
  color: #F1E3BE;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
}

/* ---------- метки возможных ходов ---------- */

.spot {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cd);
  height: var(--cd);
  border-radius: 50%;
  border: 2px solid var(--brass);
  background: radial-gradient(circle, rgba(200, 162, 74, .22), rgba(200, 162, 74, .04) 70%);
  box-shadow: 0 0 22px rgba(200, 162, 74, .35);
  animation: breathe 1.6s ease-in-out infinite;
  z-index: 4;
  cursor: pointer;
  pointer-events: auto;
}

.spot em {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-style: normal;
  font-size: calc(var(--cd) * .38);
  color: var(--brass-lit);
}

@keyframes breathe {
  0%, 100% { opacity: .55; }
  50%      { opacity: 1; }
}

/* ---------- кости ---------- */

.die-wrap {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--dd);
  height: var(--dd);
  z-index: 3;
}

.die {
  position: absolute;
  inset: 0;
  border-radius: calc(var(--dd) * .22);
  background: linear-gradient(155deg, #FDF6E6 0%, #EADCBD 55%, #CBB68C 100%);
  box-shadow:
    inset 0 2px 3px rgba(255, 255, 255, .9),
    inset 0 -4px 8px rgba(120, 96, 56, .35),
    0 10px 20px -8px rgba(0, 0, 0, .7);
  transition: opacity .3s, transform .3s;
}

.die.dark {
  background: linear-gradient(155deg, #4C4239 0%, #2B241E 55%, #14100D 100%);
  box-shadow:
    inset 0 2px 3px rgba(255, 255, 255, .16),
    inset 0 -4px 8px rgba(0, 0, 0, .6),
    0 10px 20px -8px rgba(0, 0, 0, .8);
}

.die i {
  position: absolute;
  width: 17%;
  height: 17%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #6A5B45, #2A2119);
  box-shadow: inset 0 -1px 2px rgba(0, 0, 0, .5);
}

.die.dark i { background: radial-gradient(circle at 35% 30%, #E8D9B4, #B49A63); }

.die.used { opacity: .45; transform: scale(.88); filter: saturate(.6); }

.die.tumble { animation: tumble .58s var(--ease); }

@keyframes tumble {
  0%   { transform: translateY(-34px) rotate(-160deg) scale(.7); opacity: 0; }
  55%  { transform: translateY(6px) rotate(14deg) scale(1.06); opacity: 1; }
  75%  { transform: translateY(-4px) rotate(-4deg) scale(.99); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}

/* ---------- сообщение над доской ---------- */

.quip {
  position: absolute;
  left: 50%;
  top: 4%;
  transform: translate(-50%, 8px);
  max-width: min(88%, 34rem);
  padding: 10px 22px;
  border-radius: 999px;
  background: rgba(12, 9, 6, .8);
  border: 1px solid rgba(200, 162, 74, .34);
  box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .9);
  font-family: Forum, Georgia, serif;
  font-size: clamp(15px, 2.2vw, 21px);
  letter-spacing: .02em;
  color: #F2E4C2;
  text-align: center;
  text-wrap: balance;
  opacity: 0;
  pointer-events: none;
  transition: opacity .28s, transform .28s var(--ease);
  z-index: 21;
}

.quip.show { opacity: 1; transform: translate(-50%, 0); }

.toast {
  position: absolute;
  left: 50%;
  bottom: 6%;
  transform: translate(-50%, 10px);
  padding: 9px 18px;
  border-radius: 999px;
  background: rgba(10, 8, 6, .84);
  border: 1px solid rgba(200, 162, 74, .38);
  color: #F0E6D2;
  font-size: 13px;
  letter-spacing: .02em;
  max-width: min(92%, 30rem);
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 20;
  backdrop-filter: blur(6px);
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- нижние панели ---------- */

.panels {
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  gap: 14px;
  align-items: start;
}

.plaque {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
  transition: border-color .3s, background .3s;
}

.plaque::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  width: 100%;
  background: linear-gradient(90deg, var(--brass), transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .5s var(--ease);
}

.plaque.act { border-color: color-mix(in srgb, var(--brass) 55%, transparent); background: var(--panel-2); }
.plaque.act::before { transform: scaleX(1); }

.disc {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  flex: none;
}

.disc.w { background: radial-gradient(circle at 34% 28%, #FFFAEE, #E0D0AE 60%, #AC9469); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .5), 0 2px 6px rgba(0, 0, 0, .35); }
.disc.b { background: radial-gradient(circle at 34% 28%, #574D42, #241E19 60%, #100C09); box-shadow: inset 0 0 0 1.5px rgba(200, 162, 74, .3), 0 2px 6px rgba(0, 0, 0, .45); }

.pname {
  font-family: Forum, Georgia, serif;
  font-size: 19px;
  letter-spacing: .08em;
  text-transform: uppercase;
  line-height: 1.15;
}

.pmeta {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: .04em;
}

.pstats {
  margin-left: auto;
  display: flex;
  gap: 14px;
  text-align: right;
}

.pstats div { display: flex; flex-direction: column; }

.pstats b {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 17px;
  font-weight: 500;
  line-height: 1.1;
}

.pstats span {
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* журнал ходов */

.log {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 10px 4px 10px 14px;
  min-height: 84px;
}

.log h2 {
  margin: 0 0 6px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.log ol {
  margin: 0;
  padding: 0 10px 0 0;
  list-style: none;
  max-height: 102px;
  overflow-y: auto;
  mask-image: linear-gradient(to top, transparent, #000 20px);
  -webkit-mask-image: linear-gradient(to top, transparent, #000 20px);
  display: flex;
  flex-direction: column-reverse;
  gap: 3px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
}

.log li { display: flex; gap: 8px; }
.log li b { font-weight: 500; color: var(--text); min-width: 52px; }
.log li.w b { color: var(--text); }
.log li.b b { color: var(--brass); }

/* ---------- модальное окно ---------- */

.veil {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: color-mix(in srgb, var(--bg-deep) 78%, transparent);
  backdrop-filter: blur(10px) saturate(.9);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s;
}

.veil.show { opacity: 1; pointer-events: auto; }

.sheet {
  width: min(480px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
  box-shadow: var(--shadow-lg);
  padding: 26px 28px 24px;
  transform: translateY(12px) scale(.98);
  transition: transform .35s var(--ease);
}

.veil.show .sheet { transform: none; }

.sheet h1 {
  margin: 0 0 4px;
  font-family: Forum, Georgia, serif;
  font-size: 34px;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-wrap: balance;
}

.sheet .lede {
  margin: 0 0 22px;
  color: var(--text-dim);
  font-size: 13px;
  max-width: 46ch;
}

.field { margin-bottom: 18px; }

.field > label {
  display: block;
  margin-bottom: 7px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
}

.seg button {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 8px 6px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-dim);
  transition: background .2s, color .2s;
}

.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] {
  background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  color: #14100A;
}
.seg button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

.hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--text-dim);
  min-height: 1em;
}

.field.gap { margin-top: 24px; }

.inp {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
}

.inp::placeholder { color: var(--text-dim); }
.inp:focus { outline: 2px solid var(--brass); outline-offset: 1px; border-color: transparent; }

.inp.mono {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .3em;
  text-transform: uppercase;
  text-align: center;
}

.row { display: flex; gap: 8px; }
.row .inp { flex: 1; min-width: 0; }
.row .btn { flex: none; }

.code-big {
  margin: 4px 0 2px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 40px;
  letter-spacing: .28em;
  text-align: center;
  text-indent: .28em;
  color: var(--brass-lit);
}

.tables {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 168px;
  overflow-y: auto;
}

.tables li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px 9px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  font-size: 13px;
}

.tables li.muted {
  color: var(--text-dim);
  border-style: dashed;
  background: transparent;
}

.tables b {
  font-weight: 500;
  letter-spacing: .16em;
  color: var(--brass-lit);
}

.tables span { color: var(--text-dim); margin-right: auto; }
.tables .btn { padding: 6px 13px; font-size: 12px; }

.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

.sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
.sheet-actions .btn { flex: 1; text-align: center; padding: 11px 16px; }

.rules { font-size: 13.5px; color: var(--text-dim); }
.rules h3 {
  margin: 18px 0 5px;
  font-family: Forum, Georgia, serif;
  font-size: 17px;
  font-weight: 400;
  letter-spacing: .08em;
  text-transform: uppercase;

   Длинные нарды — движок правил
   Кольцо из 24 пунктов. Оба игрока идут в сторону возрастания

  }

  /* Законные ходы с учётом обязанности разыграть максимум костей

  function legalMoves(st, memo) {

<script>
/* ============================================================
   Длинные нарды — оценка позиции и выбор хода компьютером
   ============================================================ */
(function (global) {
  'use strict';

  var N = global.Nardy;
  var NP = N.NP;

  /* Оценка позиции глазами игрока p. Больше — лучше. */
  function side(st, p) {
    var i, c, r, progress = 0, head = 0, spots = 0, stack = 0, homeCnt = 0;
    for (i = 0; i < NP; i++) {
      c = N.cnt(st, i, p);
      if (!c) continue;
      r = N.rel(p, i);
      progress += r * c;
      spots++;
      if (i === N.HEAD[p]) head = c;
      if (r >= 18) homeCnt += c;
      if (c > 4) stack += (c - 4);
    }
    var s = 0;
    s += st.off[p] * 34;          /* снятая шашка дороже любого продвижения */
    s += progress * 0.85;
    s -= head * head * 0.30;      /* куча на голове — потерянные темпы */
    s += spots * 2.2;             /* занятые пункты: пространство и выбор */
    s -= stack * 1.4;             /* башни выше четырёх бесполезны */
    s += homeCnt * 0.7;
    s += blocks(st, p);
    return s;
  }

  /* Непрерывные цепочки своих пунктов; ценнее, если запирают соперника */
  function blocks(st, p) {
    var q = N.opp(p), occ = [], k, total = 0;
    for (k = 0; k < NP; k++) occ.push(N.cnt(st, N.absOf(p, k), p) > 0);
    k = 0;
    while (k < NP) {
      if (!occ[k]) { k++; continue; }
      var a = k;
      while (k < NP && occ[k]) k++;
      var len = k - a;
      if (len < 2) continue;
      var front = -1, m, r;
      for (m = a; m < a + len; m++) {
        r = N.rel(q, N.absOf(p, m));
        if (r > front) front = r;
      }
      var behind = 0, j;
      for (j = 0; j < NP; j++) {
        var c = N.cnt(st, j, q);
        if (c && N.rel(q, j) < front) behind += c;

      if (len >= 4) total += behind * 0.8;

    return side(st, p) - side(st, N.opp(p)) * 0.92;
  }

  function afterReply(st, p, deadline) {

      N.endTurn(s);

  function choose(st, level) {

    var p = st.turn, i;

    }

    if (level === 'easy') {
      for (i = 0; i < seqs.length; i++) seqs[i].score += (Math.random() - 0.5) * 55;

      h: VH - 2 * FRAME - 16
    };
  }

  function diceAt(player, idx, n) {
    var cx = player === 'w' ? FX0 + 9 * PTW + BAR : FX0 + 3 * PTW;
    var total = n * DD + (n - 1) * 10;
    return { x: cx - total / 2 + idx * (DD + 10), y: (FY0 + PTH + FY1 - PTH) / 2 - DD / 2 };
  }

  /* ---------- рисование ---------- */

  function rnd32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* Древесные волокна */
  function grain(ctx, x, y, w, h, seed, lines, alpha) {
    var r = rnd32(seed), i, xx, yy, amp, ph, per;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    for (i = 0; i < lines; i++) {
      yy = y + r() * h;
      amp = 1.5 + r() * 6;
      ph = r() * 6.283;
      per = 90 + r() * 300;
      ctx.beginPath();
      ctx.moveTo(x, yy);
      for (xx = x; xx <= x + w; xx += 12) ctx.lineTo(xx, yy + Math.sin(xx / per + ph) * amp);
      ctx.strokeStyle = r() > 0.45
        ? 'rgba(255,218,168,' + (alpha * r() * 0.9).toFixed(3) + ')'
        : 'rgba(24,12,4,' + (alpha * 1.7 * r()).toFixed(3) + ')';
      ctx.lineWidth = 0.5 + r() * 1.7;
      ctx.stroke();

  }

  /* Хатам: цепочка ромбов вдоль отрезка */
  function inlayRun(ctx, x0, y0, x1, y1, offset) {
    var len = Math.hypot(x1 - x0, y1 - y0), step = 21.5;
    var n = Math.floor(len / step), i, t, x, y, k;
    var pal = [C.bone, C.brass, C.dark, C.brass];
    for (i = 0; i <= n; i++) {
      t = (i * step) / len;
      x = x0 + (x1 - x0) * t;
      y = y0 + (y1 - y0) * t;
      k = (i + offset) % pal.length;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = pal[k];
      ctx.globalAlpha = k === 2 ? 0.85 : 0.92;
      ctx.fillRect(-4.6, -4.6, 9.2, 9.2);
      ctx.restore();
    }
  }

  function drawFrame(ctx) {
    var g = ctx.createLinearGradient(0, 0, VW * 0.6, VH);
    g.addColorStop(0, C.frameHi);
    g.addColorStop(0.45, '#3A2115');
    g.addColorStop(1, C.frameLo);
    rrect(ctx, 0, 0, VW, VH, 18);
    ctx.fillStyle = g;
    ctx.fill();
    grain(ctx, 0, 0, VW, VH, 7, 190, 0.10);

    var c = FRAME / 2;
    inlayRun(ctx, c, c, VW - c, c, 0);
    inlayRun(ctx, c, VH - c, VW - c, VH - c, 2);
    inlayRun(ctx, c, c, c, VH - c, 1);
    inlayRun(ctx, VW - c, c, VW - c, VH - c, 3);

    ctx.strokeStyle = 'rgba(200,162,74,.55)';
    ctx.lineWidth = 1.1;
    rrect(ctx, 2.5, 2.5, VW - 5, VH - 5, 16); ctx.stroke();
    rrect(ctx, FRAME - 2.5, FRAME - 2.5, VW - 2 * FRAME + 5, VH - 2 * FRAME + 5, 6); ctx.stroke();

    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, C.bed);
    g.addColorStop(0.5, '#341E12');
    g.addColorStop(1, C.bedLo);

    ctx.fillRect(x, y, w, h);

    s.addColorStop(0, 'rgba(0,0,0,.55)'); s.addColorStop(1, 'rgba(0,0,0,0)');

    s.addColorStop(0, 'rgba(0,0,0,.5)'); s.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = '#1B0F08';
    ctx.fill();
    ctx.save();
    ctx.clip();

    s.addColorStop(0, 'rgba(0,0,0,.75)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = s; ctx.fillRect(x, y, 22, h);
    ctx.restore();
    ctx.strokeStyle = 'rgba(200,162,74,.32)';
    ctx.lineWidth = 1;
    rrect(ctx, x, y, w, h, 9); ctx.stroke();

    /* гравировка «ДОМ» у дальнего края лотка */
    ctx.save();
    ctx.translate(x + w / 2, side === 'l' ? y + 40 : y + h - 40);
    ctx.rotate(side === 'l' ? -Math.PI / 2 : Math.PI / 2);
    ctx.fillStyle = 'rgba(200,162,74,.42)';
    ctx.font = '500 15px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

  function drawBar(ctx) {
    var x = FX0 + 6 * PTW, y = FRAME + 8, h = VH - 2 * FRAME - 16;
    var g = ctx.createLinearGradient(x, 0, x + BAR, 0);
    g.addColorStop(0, '#160C06');
    g.addColorStop(0.5, '#4A2B1A');
    g.addColorStop(1, '#160C06');
    rrect(ctx, x, y, BAR, h, 7);
    ctx.fillStyle = g; ctx.fill();
    grain(ctx, x, y, BAR, h, 55, 26, 0.10);
    ctx.strokeStyle = 'rgba(200,162,74,.30)';
    ctx.lineWidth = 1;
    rrect(ctx, x, y, BAR, h, 7); ctx.stroke();
  }

  function drawPoints(ctx) {
    var i, g, light, baseY, apexY, grd;
    for (i = 0; i < 24; i++) {
      g = geom(i);
      light = ((g.j + (g.top ? 0 : 1)) % 2) === 0;
      baseY = g.top ? FY0 : FY1;
      apexY = g.top ? FY0 + PTH : FY1 - PTH;
      ctx.beginPath();
      ctx.moveTo(g.x + 1.5, baseY);
      ctx.lineTo(g.x + PTW - 1.5, baseY);
      ctx.lineTo(g.x + PTW / 2, apexY);
      ctx.closePath();
      grd = ctx.createLinearGradient(0, baseY, 0, apexY);
      if (light) {
        grd.addColorStop(0, C.bone); grd.addColorStop(0.55, C.boneMid); grd.addColorStop(1, C.boneLo);
      } else {
        grd.addColorStop(0, C.felt); grd.addColorStop(0.55, C.feltMid); grd.addColorStop(1, C.feltLo);
      }
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,162,74,.18)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    /* латунная нить вдоль домов */
    ctx.strokeStyle = 'rgba(200,162,74,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(colX(6), FY0 - 3); ctx.lineTo(colX(11) + PTW, FY0 - 3);
    ctx.moveTo(colX(0), FY1 + 3); ctx.lineTo(colX(5) + PTW, FY1 + 3);
    ctx.stroke();
  }

  function drawLight(ctx) {
    var g = ctx.createLinearGradient(0, 0, VW * 0.75, VH);
    g.addColorStop(0, 'rgba(255,240,214,.09)');
    g.addColorStop(0.35, 'rgba(255,240,214,.02)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    rrect(ctx, 0, 0, VW, VH, 18);
    ctx.fillStyle = g; ctx.fill();

    var v = ctx.createRadialGradient(VW / 2, VH * 0.42, VH * 0.30, VW / 2, VH * 0.5, VH * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.45)');
    rrect(ctx, 0, 0, VW, VH, 18);
    ctx.fillStyle = v; ctx.fill();
  }

  function render(canvas) {
    var w = canvas.clientWidth, h = canvas.clientHeight;

    var dpr = Math.min(global.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(w * dpr);

    ctx.setTransform(w * dpr / VW, 0, 0, h * dpr / VH, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    drawFrame(ctx);
    drawBed(ctx);
    drawTray(ctx, 'l');
    drawTray(ctx, 'r');
    drawPoints(ctx);
    drawBar(ctx);
    drawLight(ctx);
  }

  global.NardyBoard = {
    VW: VW, VH: VH, CD: CD, DD: DD, PTW: PTW, PTH: PTH, FY0: FY0, FY1: FY1,
    geom: geom, manAt: manAt, trayAt: trayAt, trayBox: trayBox, diceAt: diceAt, gapFor: gapFor,
    render: render
  };
})(window);
</script>
